```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>每月預算記帳</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
    }

    /* =========================
       Header
    ========================= */

    header {
      background: #111827;
      color: white;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-weight: 800;
      font-size: 18px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .version {
      font-size: 12px;
      opacity: 0.65;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: white;
      padding: 7px 12px;
      border-radius: 8px;
    }

    /* =========================
       Main
    ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 90px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-title {
      margin: 0 0 18px;
      font-size: 25px;
      font-weight: 800;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 19px;
      font-weight: 800;
    }

    /* =========================
       Cards
    ========================= */

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    /* =========================
       Summary
    ========================= */

    .summary-card {
      background: white;
      border-radius: 16px;
      padding: 17px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .summary-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .summary-value {
      font-size: 25px;
      font-weight: 800;
    }

    .income-value {
      color: #059669;
    }

    .expense-value {
      color: #dc2626;
    }

    .remaining-value {
      color: #2563eb;
    }

    /* =========================
       Forms
    ========================= */

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
      color: #111827;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-group {
      margin-bottom: 13px;
    }

    /* =========================
       Buttons
    ========================= */

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-success {
      background: #dcfce7;
      color: #166534;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 13px;
    }

    /* =========================
       Auth
    ========================= */

    #authPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111827;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .auth-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .auth-subtitle {
      color: #6b7280;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .auth-switch {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #6b7280;
    }

    .auth-switch button {
      border: 0;
      background: transparent;
      color: #2563eb;
      font-weight: 700;
    }

    /* =========================
       Month
    ========================= */

    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-control button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      background: white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .month-input {
      width: 145px;
    }

    /* =========================
       Budget
    ========================= */

    .budget-row {
      margin-bottom: 15px;
    }

    .budget-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .budget-head span:last-child {
      color: #6b7280;
    }

    .progress {
      height: 8px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #2563eb;
      border-radius: inherit;
      transition: width .2s;
    }

    .budget-over {
      background: #dc2626;
    }

    /* =========================
       Ledger
    ========================= */

    .ledger-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ledger-name {
      font-size: 19px;
      font-weight: 800;
    }

    .ledger-code {
      color: #6b7280;
      font-size: 13px;
      margin-top: 3px;
    }

    .ledger-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* =========================
       Transaction toggle
    ========================= */

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .type-btn {
      padding: 11px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: white;
      font-weight: 800;
    }

    .type-btn.active-expense {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    .type-btn.active-income {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    /* =========================
       Transactions
    ========================= */

    .filter-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaction-item {
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      padding: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .transaction-main {
      min-width: 0;
      flex: 1;
    }

    .transaction-item-title {
      font-weight: 800;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .transaction-meta {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.6;
    }

    .transaction-right {
      text-align: right;
      flex-shrink: 0;
    }

    .transaction-amount {
      font-weight: 900;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .amount-income {
      color: #059669;
    }

    .amount-expense {
      color: #dc2626;
    }

    .transaction-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
    }

    .empty {
      padding: 30px 15px;
      text-align: center;
      color: #9ca3af;
    }

    /* =========================
       Modal
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 17px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 17px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
    }

    .close-btn {
      border: 0;
      background: #f3f4f6;
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 17px;
    }

    /* =========================
       Navigation
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: center;
      z-index: 30;
    }

    .bottom-nav-inner {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .nav-btn {
      border: 0;
      background: white;
      padding: 11px 5px;
      color: #6b7280;
      font-size: 12px;
    }

    .nav-btn.active {
      color: #2563eb;
      font-weight: 800;
    }

    .nav-icon {
      display: block;
      font-size: 19px;
      margin-bottom: 2px;
    }

    /* =========================
       Toast
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 75px;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 200;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    /* =========================
       Loading
    ========================= */

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 800px) {

      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-row {
        grid-template-columns: 1fr 1fr;
      }

    }

    @media (max-width: 600px) {

      header {
        padding: 12px 15px;
      }

      main {
        padding: 15px;
        padding-bottom: 85px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .version {
        display: none;
      }

      .page-title {
        font-size: 22px;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr 1fr;
      }

      .filter-row {
        grid-template-columns: 1fr;
      }

      .month-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .transaction-item {
        align-items: flex-start;
      }

      .transaction-right {
        min-width: 100px;
      }

      .ledger-actions {
        width: 100%;
      }

    }

    @media (max-width: 420px) {

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .summary-value {
        font-size: 22px;
      }

      .transaction-item {
        flex-direction: column;
      }

      .transaction-right {
        width: 100%;
        text-align: left;
      }

      .transaction-actions {
        justify-content: flex-start;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       Auth
  ========================== -->

  <section id="authPage">

    <div class="auth-card">

      <div class="auth-title">
        💰 每月預算記帳
      </div>

      <div class="auth-subtitle">
        簡單記錄每個月的收入、支出與預算
      </div>

      <form id="authForm">

        <div class="form-group">

          <label for="authEmail">
            Email
          </label>

          <input
            id="authEmail"
            type="email"
            autocomplete="email"
            required
          />

        </div>

        <div class="form-group">

          <label for="authPassword">
            密碼
          </label>

          <input
            id="authPassword"
            type="password"
            autocomplete="current-password"
            required
          />

        </div>

        <button
          id="authSubmit"
          type="submit"
          class="btn btn-primary"
          style="width:100%;"
        >
          登入
        </button>

      </form>

      <div class="auth-switch">

        <span id="authSwitchText">
          還沒有帳號？
        </span>

        <button
          id="authSwitchBtn"
          type="button"
        >
          註冊
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       App
  ========================== -->

  <div id="app" class="app hidden">

    <header>

      <div class="header-inner">

        <div class="brand">
          💰 每月預算記帳
        </div>

        <div class="header-right">

          <span class="version">
            V3.1.4
          </span>

          <button
            class="logout-btn"
            onclick="logout()"
          >
            登出
          </button>

        </div>

      </div>

    </header>


    <main>

      <!-- =========================
           Home
      ========================== -->

      <section
        id="homePage"
        class="page active"
      >

        <h1 class="page-title">
          本月總覽
        </h1>

        <div class="month-bar">

          <div class="month-control">

            <button
              onclick="changeMonth(-1)"
              title="上個月"
            >
              ‹
            </button>

            <input
              id="currentMonth"
              class="month-input"
              type="month"
              onchange="monthChanged()"
            />

            <button
              onclick="changeMonth(1)"
              title="下個月"
            >
              ›
            </button>

          </div>

        </div>


        <!-- Ledger -->

        <div class="card">

          <div class="ledger-top">

            <div>

              <div
                id="currentLedgerName"
                class="ledger-name"
              >
                個人帳本
              </div>

              <div
                id="currentLedgerCode"
                class="ledger-code"
              >
                個人帳本
              </div>

            </div>

            <div class="ledger-actions">

              <button
                class="btn btn-secondary btn-small"
                onclick="openLedgerModal()"
              >
                切換帳本
              </button>

              <button
                id="inviteBtn"
                class="btn btn-secondary btn-small"
                onclick="createInviteCode()"
              >
                產生邀請碼
              </button>

            </div>

          </div>

          <div
            id="inviteCodeArea"
            class="hidden"
            style="margin-top:12px;"
          >

            <label>
              共享帳本邀請碼
            </label>

            <div style="display:flex;gap:8px;">

              <input
                id="inviteCodeInput"
                readonly
              />

              <button
                class="btn btn-primary"
                onclick="copyInviteCode()"
              >
                複製
              </button>

            </div>

          </div>

        </div>


        <!-- Summary -->

        <div class="grid grid-4">

          <div class="summary-card">

            <div class="summary-label">
              本月收入
            </div>

            <div
              id="summaryIncome"
              class="summary-value income-value"
            >
              $0
            </div>

          </div>

          <div class="summary-card">

            <div class="summary-label">
              本月支出
            </div>

            <div
              id="summaryExpense"
              class="summary-value expense-value"
            >
              $0
            </div>

          </div>

          <div class="summary-card">

            <div class="summary-label">
              預算剩餘
            </div>

            <div
              id="summaryRemaining"
              class="summary-value remaining-value"
            >
              $0
            </div>

          </div>

          <div class="summary-card">

            <div class="summary-label">
              可自由使用
            </div>

            <div
              id="summaryFree"
              class="summary-value"
            >
              $0
            </div>

          </div>

        </div>


        <!-- Budget -->

        <div
          class="card"
          style="margin-top:18px;"
        >

          <h2 class="section-title">
            📊 本月預算
          </h2>

          <div id="budgetProgress"></div>

        </div>


        <!-- Quick add -->

        <div class="card">

          <h2 class="section-title">
            ➕ 快速記帳
          </h2>

          <form id="transactionForm">

            <div class="type-toggle">

              <button
                type="button"
                id="expenseTypeBtn"
                class="type-btn active-expense"
                onclick="setTransactionType('expense')"
              >
                💸 支出
              </button>

              <button
                type="button"
                id="incomeTypeBtn"
                class="type-btn"
                onclick="setTransactionType('income')"
              >
                💰 收入
              </button>

            </div>


            <div class="grid grid-2">

              <div class="form-group">

                <label for="transactionDate">
                  日期
                </label>

                <input
                  id="transactionDate"
                  type="date"
                  required
                />

              </div>


              <div class="form-group">

                <label for="transactionAmount">
                  金額
                </label>

                <input
                  id="transactionAmount"
                  type="number"
                  min="0"
                  step="1"
                  placeholder="例如 500"
                  required
                />

              </div>

            </div>


            <div class="grid grid-2">

              <div class="form-group">

                <label for="transactionCategory">
                  分類
                </label>

                <select
                  id="transactionCategory"
                  required
                ></select>

              </div>


              <div class="form-group">

                <label for="paymentMethod">
                  付款方式
                </label>

                <select
                  id="paymentMethod"
                  required
                >

                  <option value="現金">
                    💵 現金
                  </option>

                  <option value="信用卡">
                    💳 信用卡
                  </option>

                  <option value="轉帳">
                    🏦 轉帳
                  </option>

                  <option value="電子支付">
                    📱 電子支付
                  </option>

                  <option value="其他">
                    📦 其他
                  </option>

                </select>

              </div>

            </div>


            <div class="form-group">

              <label for="transactionNote">
                項目／備註
              </label>

              <input
                id="transactionNote"
                type="text"
                placeholder="例如：午餐、薪資、Netflix"
              />

            </div>


            <button
              id="addTransactionBtn"
              class="btn btn-primary"
              type="submit"
              style="width:100%;"
            >
              新增記帳
            </button>

          </form>

        </div>

      </section>


      <!-- =========================
           Transactions
      ========================== -->

      <section
        id="transactionsPage"
        class="page"
      >

        <h1 class="page-title">
          📒 記帳紀錄
        </h1>

        <div class="card">

          <div class="filter-row">

            <div>

              <label>
                搜尋
              </label>

              <input
                id="searchFilter"
                type="text"
                placeholder="搜尋項目或備註"
                oninput="renderTransactions()"
              />

            </div>


            <div>

              <label>
                分類
              </label>

              <select
                id="categoryFilter"
                onchange="renderTransactions()"
              >

                <option value="all">
                  全部分類
                </option>

              </select>

            </div>


            <div>

              <label>
                類型
              </label>

              <select
                id="typeFilter"
                onchange="renderTransactions()"
              >

                <option value="all">
                  全部
                </option>

                <option value="expense">
                  支出
                </option>

                <option value="income">
                  收入
                </option>

              </select>

            </div>


            <button
              class="btn btn-secondary"
              onclick="clearFilters()"
            >
              清除
            </button>

          </div>

        </div>


        <div class="card">

          <div
            id="transactionList"
            class="transaction-list"
          ></div>

        </div>

      </section>


      <!-- =========================
           Budget Page
      ========================== -->

      <section
        id="budgetPage"
        class="page"
      >

        <h1 class="page-title">
          📊 月預算設定
        </h1>

        <div class="month-bar">

          <div class="month-control">

            <button onclick="changeMonth(-1)">
              ‹
            </button>

            <input
              id="budgetMonth"
              class="month-input"
              type="month"
              onchange="budgetMonthChanged()"
            />

            <button onclick="changeMonth(1)">
              ›
            </button>

          </div>

        </div>


        <div class="card">

          <form id="budgetForm">

/*
  使用「本機日期」，
  避免 toISOString() 在台灣時區造成日期提前／延後一天。
*/

function getLocalDateString() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function getSafeCurrentMonth() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  return `${year}-${month}`;
}


function normalizeMonth(month) {

  if (
    typeof month !== "string" ||
    !/^\d{4}-\d{2}$/.test(month)
  ) {

    return getSafeCurrentMonth();

  }

  const [year, monthNumber] =
    month
      .split("-")
      .map(Number);

  if (
    monthNumber < 1 ||
    monthNumber > 12
  ) {

    return getSafeCurrentMonth();

  }

  return month;
}


function monthToDate(month) {

  return `${normalizeMonth(month)}-01`;

}


function getNextMonth(month) {

  const [year, monthNumber] =
    normalizeMonth(month)
      .split("-")
      .map(Number);

  const date =
    new Date(
      year,
      monthNumber,
      1
    );

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  return `${y}-${m}`;
}


function getMonthDateRange(month) {

  const safeMonth =
    normalizeMonth(month);

  return {
    start:
      `${safeMonth}-01`,

    end:
      `${getNextMonth(safeMonth)}-01`
  };

}


function formatMoney(value) {

  const number =
    Number(value || 0);

  if (!Number.isFinite(number)) {
    return "0";
  }

  return number
    .toLocaleString("zh-TW");
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

}


/*
  將 Supabase 錯誤轉成比較容易閱讀的訊息。
*/

function getErrorMessage(error) {

  if (!error) {
    return "未知錯誤";
  }

  if (error.message) {
    return error.message;
  }

  if (error.details) {
    return error.details;
  }

  if (error.hint) {
    return error.hint;
  }

  return String(error);

}

async function submitAuth(event) {

  event.preventDefault();

  const email =

  }


  if (password.length < 6) {

    showToast(
      "密碼至少需要 6 個字元"
    );

    return;

  }


  const submit =
    document.getElementById(
      "authSubmit"
    );

  submit.disabled =
    true;


  try {

    let result;

    if (
      authMode === "login"
    ) {

      result =
        await db.auth.signInWithPassword({
          email,
          password
        });

    } else {

      result =
        await db.auth.signUp({
          email,
          password
        });

    }


    if (result.error) {
      throw result.error;
    }


    if (
      authMode === "login"
    ) {

      showToast(
        "登入成功"
      );

    } else {

      if (
        result.data &&
        result.data.session
      ) {

        );

      } else {

        showToast(

      error

    showToast(
      "操作失敗：" +
      getErrorMessage(error)
    );

  } finally {

async function ensurePersonalLedger() {

  if (!currentUser) {
    return null;
  }


  const {
    data,
    error

    await db.rpc(
      "ensure_personal_ledger"
    );


  if (error) {

    console.error(
      "ensure_personal_ledger",
      error
    );

    return null;

  }


  return data;

async function loadLedgers() {

  try {

    await ensurePersonalLedger();


    const {
      data: memberships,
      error: memberError
    } =
      await db
        .from("ledger_members")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        );


    if (memberError) {
      throw memberError;
    }


    if (
      !memberships ||
      memberships.length === 0
    ) {

      ledgers = [];
      currentLedger = null;

      renderLedgerSelect();
      renderCurrentLedgerTools();

      return;

    }


    const ledgerIds =
      memberships
        .map(
          item =>
            item.ledger_id
        )
        .filter(Boolean);


    if (
      ledgerIds.length === 0
    ) {

      ledgers = [];
      currentLedger = null;

      renderLedgerSelect();
      renderCurrentLedgerTools();

      return;

    }


    const {
      data: ledgerData,
      error: ledgerError
    } =
      await db
        .from("ledgers")
        .select("*")
        .in(
          "id",
          ledgerIds
        );


    if (ledgerError) {
      throw ledgerError;
    }


    ledgers =
      ledgerData || [];


    if (!currentLedger) {

      currentLedger =
        ledgers[0] ||
        null;

    } else {

      currentLedger =
        ledgers.find(
          ledger =>
            ledger.id ===
            currentLedger.id
        ) ||
        ledgers[0] ||
        null;

    }


    renderLedgerSelect();
    renderCurrentLedgerTools();

  } catch (error) {

    console.error(
      "loadLedgers",
      error
    );

    showToast(
      "載入帳本失敗：" +
      getErrorMessage(error)
    );

  }

}

/* =========================================================
   Render Dashboard
========================================================= */

function calculateTotals() {

  let income = 0;
  let expense = 0;


  transactions.forEach(
    tx => {

      const amount =
        Number(
          tx.amount || 0
        );


      if (
        !Number.isFinite(amount)
      ) {
        return;
      }


      if (amount >= 0) {

        income += amount;

      } else {

        expense +=
          Math.abs(amount);

      }

    }
  );


  return {
    income,
    expense
  };

}


function renderDashboard() {

  const totals =
    calculateTotals();


  const incomeEl =
    document.getElementById(
      "summaryIncome"
    );

  const expenseEl =
    document.getElementById(
      "summaryExpense"
    );

  const remainingEl =
    document.getElementById(
      "summaryRemaining"
    );

  const freeEl =
    document.getElementById(
      "summaryFree"
    );


  if (incomeEl) {

    incomeEl.textContent =
      "$" +
      formatMoney(
        totals.income
      );

  }


  if (expenseEl) {

    expenseEl.textContent =
      "$" +
      formatMoney(
        totals.expense
      );

  }


  const remaining =
    Number(
      budget.income || 0
    ) -
    totals.expense;


  if (remainingEl) {

    remainingEl.textContent =
      "$" +
      formatMoney(
        remaining
      );

  }


  const freeBudget =
    Number(
      budget.free_spending || 0
    );


  const freeSpent =
    getCategoryExpense(
      "free_spending"
    );


  if (freeEl) {

    freeEl.textContent =
      "$" +
      formatMoney(
        freeBudget -
        freeSpent
      );

  }


  renderBudgetProgress();
  renderBudgetSummary();
  renderTransactions();

}


function getCategoryExpense(
  category
) {

  return transactions
    .filter(
      tx =>
        getTransactionType(tx) ===
        "expense" &&
        tx.category ===
        category
    )
    .reduce(
      (
        sum,
        tx
      ) =>
        sum +
        Math.abs(
          Number(
            tx.amount || 0
          )
        ),
      0
    );

}

function renderBudgetProgress() {

  const container =
    document.getElementById(
      "budgetProgress"
    );


  if (!container) return;


  const categories =
    Object.keys(
      categoryMap
    );


  container.innerHTML =
    categories
      .map(
        category => {

          const info =
            categoryMap[
              category
            ];


          const budgetValue =
            Number(
              budget[category] ||
              0
            );


          const spent =
            getCategoryExpense(
              category
            );


          const percentage =
            budgetValue > 0
              ? Math.min(
                  (
                    spent /
                    budgetValue
                  ) * 100,
                  100
                )
              : 0;


          const over =
            spent >
              budgetValue &&
            budgetValue > 0;


          return `

            <div class="budget-row">

              <div class="budget-head">

                <span>
                  ${info.icon}
                  ${escapeHtml(info.name)}
                </span>

                <span>
                  $${formatMoney(spent)}
                  /
                  $${formatMoney(budgetValue)}
                </span>

              </div>

              <div class="progress">

                <div
                  class="progress-bar ${over ? "budget-over" : ""}"
                  style="width:${percentage}%"
                ></div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}

/*
  這是這次修正的核心。

  不使用：
      note || null

  直接當成 item。

  而是保證：
      item 永遠有字串內容。

  同時保證：
      category
      payment_method
      amount
      date
  都不會以 null / undefined 送進資料庫。
*/

async function addTransaction(
  event
) {

  event.preventDefault();


  if (
    !currentUser
  ) {

    showToast(
      "登入狀態已失效，請重新登入"
    );

    return;

  }


  if (
    !currentLedger
  ) {

    showToast(
      "請先選擇帳本"
    );

    return;

  }


  const date =
    document.getElementById(
      "transactionDate"
    )?.value
    ?.trim();


  const amountInput =
    Number(
      document.getElementById(
        "transactionAmount"
      )?.value
      || 0
    );


  const category =
    document.getElementById(
      "transactionCategory"
    )?.value
    ?.trim();


  const paymentMethod =
    document.getElementById(
      "paymentMethod"
    )?.value
    ?.trim();


  const note =
    document.getElementById(
      "transactionNote"
    )?.value
    ?.trim()
    || "";


  /* =========================
     前端驗證
  ========================= */


  if (!date) {

    showToast(
      "請選擇日期"
    );

    return;

  }


  if (
    !Number.isFinite(
      amountInput
    ) ||
    amountInput <= 0
  ) {

    showToast(
      "請輸入正確金額"
    );

    return;

  }


  if (!category) {

    showToast(
      "請選擇分類"
    );

    return;

  }


  /*
    payment_method 即使選單出現異常，
    也不允許傳 null。
  */

  const safePaymentMethod =
    PAYMENT_METHODS.includes(
      paymentMethod
    )
      ? paymentMethod
      : "其他";


  /*
    amount：

    收入 = 正數
    支出 = 負數
  */

  const signedAmount =
    transactionType === "income"
      ? Math.abs(
          amountInput
        )
      : -Math.abs(
          amountInput
        );


  /*
    item 是資料庫可能設定 NOT NULL 的欄位。

    如果使用者沒有輸入備註，
    就自動使用分類名稱。

    因此 item 永遠不會是 null。
  */

  let item = "";


  if (note) {

    item =
      note;

  } else if (
    category === "income"
  ) {

    item =
      "收入";

  } else if (
    categoryMap[category]
  ) {

    item =
      categoryMap[
        category
      ].name;

  } else {

    item =
      "未分類";

  }


  /*
    最後再做一次保險。
  */

  item =
    String(item || "未分類")
      .trim();


  const row = {

    user_id:
      currentUser.id,

    ledger_id:
      currentLedger.id,

    date:
      date,

    item:
      item,

    category:
      category,

    payment_method:
      safePaymentMethod,

    amount:
      signedAmount,

    note:
      note || null

  };


  /*
    在真正 insert 前印出資料。

    如果 Supabase 還有錯誤，
    可以直接從瀏覽器 Console 看到送出的內容。
  */

  console.log(
    "新增記帳資料：",
    row
  );


  const button =
    document.getElementById(
      "addTransactionBtn"
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "儲存中...";

  }


  try {

    const {
      data,
      error
    } =
      await db
        .from("transactions")
        .insert(
          row
        )
        .select()
        .single();


    if (error) {

      console.error(
        "Supabase transactions insert error:",
        error
      );

      throw error;

    }


    console.log(
      "新增成功：",
      data
    );


    /*
      清空表單
    */

    document
      .getElementById(
        "transactionForm"
      )
      .reset();


    /*
      恢復今天日期。
    */

    document.getElementById(
      "transactionDate"
    ).value =
      getLocalDateString();


    /*
      恢復支出模式。
    */

    setTransactionType(
      "expense"
    );


    /*
      重新載入目前帳本資料。
    */

    await loadData();


    showToast(
      "記帳成功 🎉"
    );

  } catch (error) {

    console.error(
      "addTransaction",
      error
    );


    /*
      特別處理常見 NOT NULL 錯誤。
    */

    const message =
      getErrorMessage(
        error
      );


    if (
      message.includes(
        "null value"
      )
    ) {

      showToast(
        "記帳失敗：資料庫有欄位不允許空值，請查看 Console"
      );

    } else {

      showToast(
        "記帳失敗：" +
        message
      );

    }

  } finally {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "新增記帳";

    }

  }

}


/* =========================================================
   Transaction List
========================================================= */

function renderTransactions() {

  const container =
    document.getElementById(
      "transactionList"
    );


  if (!container) {
    return;
  }


  const search =
    (
      document.getElementById(
        "searchFilter"
      )?.value ||
      ""
    )
      .trim()
      .toLowerCase();


  const categoryFilter =
    document.getElementById(
      "categoryFilter"
    )?.value ||
    "all";


  const typeFilter =
    document.getElementById(
      "typeFilter"
    )?.value ||
    "all";


  let list =
    [...transactions];


  if (search) {

    list =
      list.filter(
        tx => {

          const text =
            [

              tx.item,

              tx.note,

              tx.payment_method

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


          return text.includes(
            search
          );

        }
      );

  }


  if (
    categoryFilter !==
    "all"
  ) {

    list =
      list.filter(
        tx =>
          tx.category ===
          categoryFilter
      );

  }


  if (
    typeFilter !==
    "all"
  ) {

    list =
      list.filter(
        tx =>
          getTransactionType(
            tx
          ) ===
          typeFilter
      );

  }


  if (
    list.length === 0
  ) {

    container.innerHTML = `
      <div class="empty">
        這個月份目前沒有符合條件的紀錄
      </div>
    `;

    return;

  }


  container.innerHTML =
    list
      .map(
        tx =>
          transactionHtml(
            tx
          )
      )
      .join("");

}


function transactionHtml(
  tx
) {

  const type =
    getTransactionType(
      tx
    );


  const amount =
    Math.abs(
      Number(
        tx.amount || 0
      )
    );


  const categoryInfo =
    categoryMap[
      tx.category
    ];


  const categoryText =
    categoryInfo
      ? `${categoryInfo.icon} ${escapeHtml(categoryInfo.name)}`
      : (
        tx.category === "income"
          ? "💰 收入"
          : escapeHtml(
              tx.category ||
              "未分類"
            )
      );


  const title =
    tx.item ||
    tx.note ||
    "未命名項目";


  const signedText =
    type === "income"
      ? `+$${formatMoney(amount)}`
      : `-$${formatMoney(amount)}`;


  const txId =
    escapeHtml(
      tx.id
    );


  return `

    <div class="transaction-item">

      <div class="transaction-main">

        <div class="transaction-item-title">
          ${escapeHtml(title)}
        </div>

        <div class="transaction-meta">

          ${escapeHtml(tx.date || "")}
          ·
          ${categoryText}
          ·
          ${escapeHtml(
            tx.payment_method ||
            "其他"
          )}

          ${
            tx.note &&
            tx.note !== tx.item
              ? `<br>${escapeHtml(tx.note)}`
              : ""
          }

        </div>

      </div>


      <div class="transaction-right">

        <div
          class="
            transaction-amount
            ${
              type === "income"
                ? "amount-income"
                : "amount-expense"
            }
          "
        >
          ${signedText}
        </div>


        <div class="transaction-actions">

          <button
            class="btn btn-secondary btn-small"
            onclick="openEditModal('${txId}')"
          >
            編輯
          </button>

          <button
            class="btn btn-danger btn-small"
            onclick="deleteTransaction('${txId}')"
          >
            刪除
          </button>

        </div>

      </div>

    </div>

  `;

}

function openEditModal(

      )
    );


  renderEditCategoryOptions(

      tx.payment_method
    )
      ? tx.payment_method
      : "其他";


  document.getElementById(
    "editNote"
  ).value =
    tx.note ||
    (
      tx.item ===
      categoryMap[
        tx.category
      ]?.name
        ? ""
        : tx.item || ""
    );


  updateEditTypeButtons();


  document
    .getElementById(
      "editModal"
    )
    .classList.remove(
      "hidden"
    );

}


function renderEditCategoryOptions(
  selectedCategory
) {

  const select =
    document.getElementById(
      "editCategory"
    );


  if (!select) {
    return;
  }


  select.innerHTML =
    "";


  if (
    editTransactionType ===
    "income"
  ) {

    select.innerHTML = `
      <option value="income">
        💰 收入
      </option>
    `;

    return;

  }


  Object.entries(
    categoryMap
  ).forEach(
    (
      [key, info]
    ) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        key;


      option.textContent =
        `${info.icon} ${info.name}`;


      if (
        key ===
        selectedCategory
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );

}


function setEditTransactionType(
  type
) {

  editTransactionType =
    type;


  const categorySelect =
    document.getElementById(
      "editCategory"
    );


  const currentCategory =
    categorySelect?.value ||
    "other";


  if (
    type === "income"
  ) {

    renderEditCategoryOptions(
      "income"
    );

  } else {

    renderEditCategoryOptions(
      categoryMap[
        currentCategory
      ]
        ? currentCategory
        : "other"
    );

  }


  updateEditTypeButtons();

}


function updateEditTypeButtons() {

  const expenseBtn =
    document.getElementById(
      "editExpenseBtn"
    );

  const incomeBtn =
    document.getElementById(
      "editIncomeBtn"
    );


  if (
    !expenseBtn ||
    !incomeBtn
  ) {
    return;
  }


  expenseBtn.className =
    "type-btn" +
    (
      editTransactionType ===
      "expense"
        ? " active-expense"
        : ""
    );


  incomeBtn.className =
    "type-btn" +
    (
      editTransactionType ===
      "income"
        ? " active-income"
        : ""
    );

}


function closeEditModal() {

  document
    .getElementById(
      "editModal"
    )
    .classList.add(
      "hidden"
    );

}


async function saveEditedTransaction() {

  if (
    !currentUser ||
    !currentLedger
  ) {

    showToast(
      "登入狀態或帳本狀態已失效"
    );

    return;

  }


  const id =
    document.getElementById(
      "editId"
    ).value;


  const date =
    document.getElementById(
      "editDate"
    ).value
    ?.trim();


  const amountInput =
    Number(
      document.getElementById(
        "editAmount"
      ).value ||
      0
    );


  const category =
    document.getElementById(
      "editCategory"
    ).value
    ?.trim();


  const paymentMethod =
    document.getElementById(
      "editPaymentMethod"
    ).value
    ?.trim();


  const note =
    document.getElementById(
      "editNote"
    ).value
    ?.trim()
    || "";


  if (!id) {

    showToast(
      "找不到記帳 ID"
    );

    return;

  }


  if (!date) {

    showToast(
      "請選擇日期"
    );

    return;

  }


  if (
    !Number.isFinite(
      amountInput
    ) ||
    amountInput <= 0
  ) {

    showToast(
      "請輸入正確金額"
    );

    return;

  }


  if (!category) {

    showToast(
      "請選擇分類"
    );

    return;

  }


  const safePaymentMethod =
    PAYMENT_METHODS.includes(
      paymentMethod
    )
      ? paymentMethod
      : "其他";


  /*
    item 永遠保持有值。
  */

  let item = "";


  if (note) {

    item =
      note;

  } else if (
    category === "income"
  ) {

    item =
      "收入";

  } else if (
    categoryMap[category]
  ) {

    item =
      categoryMap[
        category
      ].name;

  } else {

    item =
      "未分類";

  }


  item =
    String(
      item ||
      "未分類"
    ).trim();


  const signedAmount =
    editTransactionType ===
    "income"
      ? Math.abs(
          amountInput
        )
      : -Math.abs(
          amountInput
        );


  const updateData = {

    date:
      date,

    item:
      item,

    category:
      category,

    payment_method:
      safePaymentMethod,

    amount:
      signedAmount,

    note:
      note || null

  };


  console.log(
    "更新記帳資料：",
    {
      id,
      ledger_id:
        currentLedger.id,
      ...updateData
    }
  );


  const button =
    document.getElementById(
      "saveEditBtn"
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      "儲存中...";

  }


  try {

    const {
      error
    } =
      await db
        .from("transactions")
        .update(
          updateData
        )
        .eq(
          "id",
          id
        )
        .eq(
          "ledger_id",
          currentLedger.id
        );


    if (error) {
      throw error;
    }


    closeEditModal();

    await loadData();


    showToast(
      "記帳已更新"
    );

  } catch (error) {

    console.error(
      "saveEditedTransaction",
      error
    );


    showToast(
      "更新失敗：" +
      getErrorMessage(error)
    );

  } finally {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        "儲存";

    }

  }

}


/* =========================================================
   Delete Transaction
========================================================= */

async function deleteTransaction(
  id
) {

  const tx =
    transactions.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!tx) {
    return;
  }


  const confirmed =
    confirm(
      `確定要刪除「${
        tx.item ||
        "這筆記帳"
      }」嗎？`
    );


  if (!confirmed) {
    return;
  }


  try {

    const {
      error
    } =
      await db
        .from("transactions")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "ledger_id",
          currentLedger.id
        );


    if (error) {
      throw error;
    }


    await loadData();


    showToast(
      "記帳已刪除"
    );

  } catch (error) {

    console.error(
      "deleteTransaction",
      error
    );

    showToast(
      "刪除失敗：" +
      getErrorMessage(error)
    );

  }

}


/* =========================================================
   Navigation
========================================================= */

function showPage(
  page
) {

  currentPage =
    page;


  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      section => {

        section.classList.remove(
          "active"
        );

      }
    );


  const target =
    document.getElementById(
      page + "Page"
    );


  if (target) {

    target.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.page ===
          page
        );

      }
    );


  if (
    page === "budget"
  ) {

    populateBudgetForm();

  }


  if (
    page === "transactions"
  ) {

    renderTransactions();

  }

}


/* =========================================================
   Month
========================================================= */

function changeMonth(
  delta
) {

  currentMonth =
    normalizeMonth(
      currentMonth
    );


  const [
    year,
    month
  ] =
    currentMonth
      .split("-")
      .map(Number);


  const date =
    new Date(
      year,
      month - 1 + delta,
      1
    );


  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  currentMonth =
    `${y}-${m}`;


  updateMonthInputs();

  loadData();

}


async function monthChanged() {

  const value =
    document.getElementById(
      "currentMonth"
    ).value;


  currentMonth =
    normalizeMonth(
      value
    );


  updateMonthInputs();

  await loadData();

}


async function budgetMonthChanged() {

  const value =
    document.getElementById(
      "budgetMonth"
    ).value;


  currentMonth =
    normalizeMonth(
      value
    );


  updateMonthInputs();

  await loadData();

  populateBudgetForm();

}


function updateMonthInputs() {

  const homeInput =
    document.getElementById(
      "currentMonth"
    );


  const budgetInput =
    document.getElementById(
      "budgetMonth"
    );


  if (homeInput) {

    homeInput.value =
      currentMonth;

  }


  if (budgetInput) {

    budgetInput.value =
      currentMonth;

  }

}


/* =========================================================
   Filters
========================================================= */

function clearFilters() {

  const search =
    document.getElementById(
      "searchFilter"
    );


  const category =
    document.getElementById(
      "categoryFilter"
    );


  const type =
    document.getElementById(
      "typeFilter"
    );


  if (search) {
    search.value =
      "";
  }


  if (category) {

  }

}


/* =========================================================
   Init
========================================================= */

async function startApp() {

  /*
    防止 onAuthStateChange 與 init 同時觸發，
    導致整個 App 重複初始化。
  */

  if (appStarted) {
    return;
  }


  appStarted =
    true;


  document
    .getElementById(
      "authPage"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "app"
    )
    .classList.remove(
      "hidden"
    );


  currentMonth =
    normalizeMonth(
      currentMonth ||
      getSafeCurrentMonth()
    );


  updateMonthInputs();

  renderCategoryOptions();


  document.getElementById(
    "transactionDate"
  ).value =
    getLocalDateString();


  setTransactionType(
    "expense"
  );


  await loadLedgers();


  if (!currentLedger) {

    showToast(
      "找不到可使用的帳本"
    );

    return;

  }


  await loadData();

}


async function init() {

  try {

    const {
      data,
      error
    } =
      await db.auth.getSession();


    if (error) {
      throw error;
    }


    if (
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await startApp();

    } else {

      appStarted =
        false;


      document
        .getElementById(
          "authPage"
        )
        .classList.remove(
          "hidden"
        );


      document
        .getElementById(
          "app"
        )
        .classList.add(
          "hidden"
        );

    }

  } catch (error) {

    console.error(
      "init",
      error
    );


    appStarted =
      false;


    document
      .getElementById(
        "authPage"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "app"
      )
      .classList.add(
        "hidden"
      );


    showToast(
      "啟動失敗：" +
      getErrorMessage(error)
    );

  }

}


/* =========================================================
   Auth Listener
========================================================= */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      session &&
      session.user
    ) {

      currentUser =
        session.user;

      /*
        避免登入時重複 startApp。
      */

      if (!appStarted) {

        await startApp();

      }

    } else {

      currentUser =
        null;

      currentLedger =
        null;

      ledgers = [];

      transactions = [];

      budget = {};

      appStarted =
        false;


      document
        .getElementById(
          "authPage"
        )
        .classList.remove(
          "hidden"
        );


      document
        .getElementById(
          "app"
        )
        .classList.add(
          "hidden"
        );

    }

  }
);
