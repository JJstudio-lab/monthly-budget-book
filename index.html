<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f5f7fb" />
  <title>每月預算記帳本</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
      --radius: 18px;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
    }

    /* =========================
       Login
    ========================= */

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, #e0e7ff 0, transparent 35%),
        radial-gradient(circle at bottom left, #dbeafe 0, transparent 35%),
        var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 15px 50px rgba(15, 23, 42, 0.1);
    }

    .auth-logo {
      font-size: 46px;
      text-align: center;
      margin-bottom: 10px;
    }

    .auth-title {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin: 8px 0 28px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #f3f4f6;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .auth-tab {
      border: 0;
      background: transparent;
      padding: 10px;
      border-radius: 9px;
      color: var(--muted);
    }

    .auth-tab.active {
      background: white;
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* =========================
       Forms
    ========================= */

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 11px;
      padding: 12px 13px;
      outline: none;
      transition: 0.15s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 16px;
      font-weight: 700;
      transition: 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-success {
      background: #dcfce7;
      color: var(--success);
    }

    .btn-block {
      width: 100%;
    }

    .btn-large {
      padding: 14px 18px;
      font-size: 16px;
    }

    .message {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    /* =========================
       Header
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      white-space: nowrap;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .month-control input {
      width: 155px;
      padding: 8px 10px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-email {
      color: var(--muted);
      font-size: 13px;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       Navigation
    ========================= */

    .desktop-nav {
      border-bottom: 1px solid var(--border);
      background: white;
    }

    .desktop-nav-inner {
      max-width: 1180px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      padding: 14px 17px;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 3px solid transparent;
    }

    .nav-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .mobile-nav {
      display: none;
    }

    /* =========================
       Main
    ========================= */

    .main {
      max-width: 1180px;
      margin: auto;
      padding: 24px 20px 50px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page-title {
      margin: 0;
      font-size: 26px;
    }

    .page-subtitle {
      color: var(--muted);
      margin: 5px 0 22px;
    }

    /* =========================
       Cards
    ========================= */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
    }

    .stat-value.small {
      font-size: 21px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 18px;
    }

    /* =========================
       Budget
    ========================= */

    .budget-list {
      display: grid;
      gap: 14px;
    }

    .budget-row {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .budget-row-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .budget-name {
      font-weight: 700;
    }

    .budget-number {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .progress {
      height: 9px;
      border-radius: 999px;
      background: #eef0f4;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 0.3s;
    }

    .progress-bar.over {
      background: var(--danger);
    }

    .budget-edit-area {
      margin-top: 14px;
    }

    .budget-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .budget-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 18px;
    }

    .budget-readonly {
      background: #f9fafb;
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .budget-total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    .budget-total-row + .budget-total-row {
      border-top: 1px solid var(--border);
    }

    /* =========================
       Transaction
    ========================= */

    .transaction-form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .transaction-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 5px;
    }

    .recent-list {
      display: grid;
      gap: 9px;
    }

    .transaction-item {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .transaction-main {
      min-width: 0;
    }

    .transaction-title {
      font-weight: 750;
      margin-bottom: 5px;
    }

    .transaction-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .transaction-amount {
      font-weight: 800;
      white-space: nowrap;
    }

    .transaction-amount.expense {
      color: var(--danger);
    }

    .transaction-buttons {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .mini-btn {
      border: 0;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .mini-edit {
      background: var(--primary-light);
      color: var(--primary);
    }

    .mini-delete {
      background: #fee2e2;
      color: var(--danger);
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
    }

    /* =========================
       Filters
    ========================= */

    .filter-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .list-summary {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    /* =========================
       Modal
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 580px;
      border-radius: 20px;
      padding: 22px;
      max-height: 90vh;
      overflow: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f3f4f6;
      font-size: 20px;
    }

    /* =========================
       Toast
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 100px);
      opacity: 0;
      z-index: 200;
      background: #111827;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      transition: 0.25s;
      pointer-events: none;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    /* =========================
       Loading
    ========================= */

    .loading {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(4px);
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      background: white;
      border-radius: 15px;
      padding: 20px 25px;
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 850px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      body {
        padding-bottom: 76px;
      }

      .topbar-inner {
        padding: 12px 14px;
        flex-wrap: wrap;
        gap: 9px;
      }

      .brand {
        font-size: 18px;
      }

      .month-control {
        margin-left: auto;
      }

      .month-control input {
        width: 135px;
      }

      .user-area {
        width: 100%;
        justify-content: space-between;
      }

      .desktop-nav {
        display: none;
      }

      .mobile-nav {
        position: fixed;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 80;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(15px);
        border-top: 1px solid var(--border);
        padding:
          7px
          7px
          calc(7px + env(safe-area-inset-bottom));
      }

      .mobile-nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 7px 2px;
        font-size: 11px;
        font-weight: 700;
        border-radius: 10px;
      }

      .mobile-nav button.active {
        color: var(--primary);
        background: var(--primary-light);
      }

      .main {
        padding: 18px 13px 25px;
      }

      .page-title {
        font-size: 23px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-value {
        font-size: 21px;
      }

      .card {
        padding: 15px;
        border-radius: 15px;
      }

      .budget-grid {
        grid-template-columns: 1fr;
      }

      .transaction-form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .transaction-item {
        align-items: flex-start;
      }

      .transaction-amount {
        font-size: 15px;
      }

      .budget-actions,
      .transaction-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .budget-actions .btn,
      .transaction-actions .btn {
        width: 100%;
      }

      .toast {
        bottom: 90px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN / REGISTER
  ========================== -->

  <div id="authPage" class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">💰</div>
      <h1 class="auth-title">每月預算記帳本</h1>
      <div class="auth-subtitle">雲端同步版 V2.3</div>

      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" onclick="switchAuthMode('login')">
          登入
        </button>
        <button id="registerTab" class="auth-tab" onclick="switchAuthMode('register')">
          註冊
        </button>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            id="authEmail"
            type="email"
            placeholder="請輸入 Email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label">密碼</label>
          <input
            id="authPassword"
            type="password"
            placeholder="至少 6 個字元"
            minlength="6"
            required
          />
        </div>

        <button id="authSubmit" class="btn btn-primary btn-block btn-large">
          登入
        </button>
      </form>

      <div id="authMessage" class="message"></div>
    </div>
  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="app" class="app hidden">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-inner">

        <div class="brand">
          💰 每月預算記帳本
        </div>

        <div class="month-control">
          <span>📅</span>
          <input
            id="monthInput"
            type="month"
            onchange="changeMonth()"
          />
        </div>

        <div class="user-area">
          <span id="userEmail" class="user-email"></span>
          <button class="btn btn-secondary" onclick="logout()">
            登出
          </button>
        </div>

      </div>
    </header>


    <!-- DESKTOP NAV -->
    <nav class="desktop-nav">
      <div class="desktop-nav-inner">

        <button
          class="nav-btn active"
          data-page="home"
          onclick="showPage('home')"
        >
          🏠 首頁
        </button>

        <button
          class="nav-btn"
          data-page="transaction"
          onclick="showPage('transaction')"
        >
          ➕ 記帳
        </button>

        <button
          class="nav-btn"
          data-page="budget"
          onclick="showPage('budget')"
        >
          💰 預算
        </button>

        <button
          class="nav-btn"
          data-page="details"
          onclick="showPage('details')"
        >
          📋 明細
        </button>

      </div>
    </nav>


    <!-- MAIN -->
    <main class="main">

      <!-- =========================
           HOME
      ========================== -->

      <section id="page-home" class="page active">

        <h1 class="page-title">🏠 本月概況</h1>
        <p class="page-subtitle">
          <span id="homeMonthText"></span> 的財務狀況
        </p>

        <div class="stats-grid">

          <div class="stat-card">
            <div class="stat-label">💵 本月收入</div>
            <div id="statIncome" class="stat-value">
              $0
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">💸 本月總支出</div>
            <div id="statExpense" class="stat-value">
              $0
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">💰 本月剩餘</div>
            <div id="statRemaining" class="stat-value">
              $0
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">💳 信用卡支出</div>
            <div id="statCreditCard" class="stat-value small">
              $0
            </div>
          </div>

        </div>


        <div class="dashboard-grid">

          <!-- Budget usage -->
          <div class="card">
            <h2 class="card-title">
              📊 預算使用狀況
            </h2>

            <div id="homeBudgetList" class="budget-list"></div>
          </div>


          <!-- Recent transactions -->
          <div class="card">
            <h2 class="card-title">
              🧾 最近記帳
            </h2>

            <div id="homeRecentList" class="recent-list"></div>

            <button
              class="btn btn-secondary btn-block"
              style="margin-top: 14px;"
              onclick="showPage('details')"
            >
              查看全部明細 →
            </button>
          </div>

        </div>

      </section>


      <!-- =========================
           TRANSACTION
      ========================== -->

      <section id="page-transaction" class="page">

        <h1 class="page-title">➕ 新增記帳</h1>
        <p class="page-subtitle">
          記錄這個月的每一筆支出
        </p>

        <div class="card">

          <form id="transactionForm" onsubmit="addTransaction(event)">

            <div class="transaction-form-grid">

              <div class="form-group">
                <label class="form-label">
                  日期
                </label>

                <input
                  id="txDate"
                  type="date"
                  required
                />
              </div>


              <div class="form-group">
                <label class="form-label">
                  項目
                </label>

                <input
                  id="txItem"
                  type="text"
                  placeholder="例如：午餐、Netflix、加油"
                  required
                />
              </div>


              <div class="form-group">
                <label class="form-label">
                  分類
                </label>

                <select id="txCategory" required>
                  <option value="必要生活費">
                    必要生活費
                  </option>

                  <option value="信用卡">
                    信用卡
                  </option>

                  <option value="現金／預備金">
                    現金／預備金
                  </option>

                  <option value="自由支出">
                    自由支出
                  </option>

                  <option value="投資">
                    投資
                  </option>

                  <option value="其他">
                    其他
                  </option>
                </select>
              </div>


              <div class="form-group">
                <label class="form-label">
                  支付方式
                </label>

                <select id="txPaymentMethod" required>
                  <option value="信用卡">
                    💳 信用卡
                  </option>

                  <option value="現金">
                    💵 現金
                  </option>
                </select>
              </div>


              <div class="form-group">
                <label class="form-label">
                  金額
                </label>

                <input
                  id="txAmount"
                  type="number"
                  min="0"
                  step="1"
                  placeholder="0"
                  required
                />
              </div>


              <div class="form-group">
                <label class="form-label">
                  備註
                </label>

                <input
                  id="txNote"

<script>
/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://dxzzgcsatudrgjnbtbnl.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_m5bOwLJZRbhQls_76MoDrw_jCiF7Sbd";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   Global State
========================================================= */

let currentUser = null;
let currentMonth = getSafeCurrentMonth();

let budget = {
  income: 36000,
  necessary: 7000,
  credit_card: 15000,
  cash_reserve: 5000,
  free_spending: 10000,
  investment: 0,
  other: 0
};

let transactions = [];

let currentPage = "home";
let authMode = "login";
let booting = false;


/* =========================================================
   Helpers
========================================================= */

function getSafeCurrentMonth() {
  const now = new Date();

  const year = now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  return `${year}-${month}`;
}


function normalizeMonth(month) {

  if (
    typeof month === "string" &&
    /^\d{4}-\d{2}$/.test(month)
  ) {
    return month;
  }

  return getSafeCurrentMonth();
}


function getNextMonth(month) {

  month = normalizeMonth(month);

  const [year, monthNumber] =
    month.split("-").map(Number);

  const date =
    new Date(
      year,
      monthNumber,
      1
    );

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  return `${y}-${m}-01`;
}


function formatMoney(value) {

  const number =
    Number(value || 0);

  return "$" +
    number.toLocaleString("zh-TW");
}


function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function getMonthLabel(month) {

  const [year, monthNumber] =
    normalizeMonth(month)
      .split("-");

  return `${year} 年 ${Number(monthNumber)} 月`;
}


function setMonthInput() {

  const input =
    document.getElementById("monthInput");

  if (input) {
    input.value =
      normalizeMonth(currentMonth);
  }

  const label =
    getMonthLabel(currentMonth);

  const homeText =
    document.getElementById("homeMonthText");

  const detailsText =
    document.getElementById("detailsMonthText");

  if (homeText) {
    homeText.textContent = label;
  }

  if (detailsText) {
    detailsText.textContent = label;
  }
}


function showLoading(show = true) {

  const loading =
    document.getElementById("loading");

  loading.classList.toggle(
    "show",
    show
  );
}


function toast(message) {

  const element =
    document.getElementById("toast");

  element.textContent =
    message;

  element.classList.add("show");

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(() => {
      element.classList.remove("show");
    }, 2800);
}


/* =========================================================
   Auth
========================================================= */

function switchAuthMode(mode) {

  authMode = mode;

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const submit =
    document.getElementById("authSubmit");

  if (mode === "login") {

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    submit.textContent = "登入";

  } else {

    loginTab.classList.remove("active");
    registerTab.classList.add("active");

    submit.textContent = "建立帳號";
  }

  clearAuthMessage();
}


function showAuthMessage(
  message,
  type = "error"
) {

  const element =
    document.getElementById("authMessage");

  element.textContent =
    message;

  element.className =
    `message show ${type}`;
}


function clearAuthMessage() {

  const element =
    document.getElementById("authMessage");

  element.textContent = "";
  element.className = "message";
}


async function handleAuth(event) {

  event.preventDefault();

  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("authPassword")
      .value;

  clearAuthMessage();

  showLoading(true);

  try {

    if (authMode === "login") {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        throw error;
      }

      currentUser =
        data.user;

      await startApp();

    } else {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      if (error) {
        throw error;
      }

      if (data.session) {

        currentUser =
          data.user;

        await startApp();

      } else {

        showAuthMessage(
          "註冊成功！請到 Email 完成驗證後再登入。",
          "success"
        );
      }
    }

  } catch (error) {

    console.error(error);

    showAuthMessage(
      getAuthErrorMessage(error),
      "error"
    );

  } finally {

    showLoading(false);
  }
}


function getAuthErrorMessage(error) {

  const message =
    error?.message || "";

  if (
    message
      .toLowerCase()
      .includes("invalid login credentials")
  ) {
    return "Email 或密碼錯誤，請確認帳號密碼。";
  }

  if (
    message
      .toLowerCase()
      .includes("email not confirmed")
  ) {
    return "Email 尚未驗證，請先到信箱完成驗證。";
  }

  if (
    message
      .toLowerCase()
      .includes("user already registered")
  ) {
    return "這個 Email 已經註冊過了，請直接登入。";
  }

  return message ||
    "操作失敗，請稍後再試。";
}


async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  transactions = [];

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authPage")
    .classList.remove("hidden");

  document
    .getElementById("authPassword")
    .value = "";

  toast("已登出");
}


/* =========================================================
   App Start
========================================================= */

async function init() {

  setMonthInput();

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if (data?.session?.user) {

    currentUser =
      data.session.user;

    await startApp();
  }
}


async function startApp() {

  if (!currentUser) {
    return;
  }

  if (booting) {
    return;
  }

  booting = true;

  try {

    document
      .getElementById("authPage")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    document
      .getElementById("userEmail")
      .textContent =
      currentUser.email || "";

    currentMonth =
      normalizeMonth(currentMonth);

    setMonthInput();

    await loadMonthData();

    showPage(currentPage);

  } finally {

    booting = false;
  }
}


/* =========================================================
   Month
========================================================= */

async function changeMonth() {

  const input =
    document.getElementById("monthInput");

  let value =
    input?.value || "";

  value =
    normalizeMonth(value);

  currentMonth =
    value;

  setMonthInput();

  await loadMonthData();
}


async function loadMonthData() {

  if (!currentUser) {
    return;
  }

  showLoading(true);

  try {

    await Promise.all([
      loadBudget(currentMonth),
      loadTransactions(currentMonth)
    ]);

    renderAll();

  } catch (error) {

    console.error(error);

    toast(
      "讀取資料時發生錯誤"
    );

  } finally {

    showLoading(false);
  }
}


/* =========================================================
   Budget
========================================================= */

async function loadBudget(month) {

  month =
    normalizeMonth(month);

  const monthDate =
    `${month}-01`;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("budgets")
      .select("*")
      .eq("user_id", currentUser.id)
      .eq("month", monthDate)
      .maybeSingle();

  if (error) {

    console.error(
      "Supabase loadBudget error:",
      error
    );

    throw error;
  }

  if (data) {

    budget = {
      income:
        Number(data.income || 0),

      necessary:
        Number(data.necessary || 0),

      credit_card:
        Number(data.credit_card || 0),

      cash_reserve:
        Number(data.cash_reserve || 0),

      free_spending:
        Number(data.free_spending || 0),

      investment:
        Number(data.investment || 0),

      other:
        Number(data.other || 0)
    };

  } else {

    budget = {
      income: 36000,
      necessary: 7000,
      credit_card: 15000,
      cash_reserve: 5000,
      free_spending: 10000,
      investment: 0,
      other: 0
    };
  }

  fillBudgetInputs();
}


function fillBudgetInputs() {

  const fields = {
    budgetIncome:
      budget.income,

    budgetNecessary:
      budget.necessary,

    budgetCreditCard:
      budget.credit_card,

    budgetCashReserve:
      budget.cash_reserve,

    budgetFreeSpending:
      budget.free_spending,

    budgetInvestment:
      budget.investment,

    budgetOther:
      budget.other
  };

  Object.entries(fields)
    .forEach(([id, value]) => {

      const element =
        document.getElementById(id);

      if (element) {
        element.value = value;
      }
    });
}


async function saveBudget() {

  if (!currentUser) {
    return;
  }

  const newBudget = {

    income:
      Number(
        document
          .getElementById("budgetIncome")
          .value || 0
      ),

    necessary:
      Number(
        document
          .getElementById("budgetNecessary")
          .value || 0
      ),

    credit_card:
      Number(
        document
          .getElementById("budgetCreditCard")
          .value || 0
      ),

    cash_reserve:
      Number(
        document
          .getElementById("budgetCashReserve")
          .value || 0
      ),

    free_spending:
      Number(
        document
          .getElementById("budgetFreeSpending")
          .value || 0
      ),

    investment:
      Number(
        document
          .getElementById("budgetInvestment")
          .value || 0
      ),

    other:
      Number(
        document
          .getElementById("budgetOther")
          .value || 0
      )
  };

  showLoading(true);

  try {

    const row = {
      user_id:
        currentUser.id,

      month:
        `${currentMonth}-01`,

      ...newBudget
    };

    const {
      error
    } =
      await supabaseClient
        .from("budgets")
        .upsert(
          row,
          {
            onConflict:
              "user_id,month"
          }
        );

    if (error) {
      throw error;
    }

    budget =
      newBudget;

    cancelBudgetEdit();

    renderAll();

    toast(
      "✅ 本月預算已儲存"
    );

  } catch (error) {

    console.error(error);

    toast(
      "儲存預算失敗：" +
      error.message
    );

  } finally {

    showLoading(false);
  }
}


function enableBudgetEdit() {

  fillBudgetInputs();

  document
    .getElementById("budgetReadonly")
    .classList.add("hidden");

  document
    .getElementById("budgetEdit")
    .classList.remove("hidden");
}


function cancelBudgetEdit() {

  fillBudgetInputs();

  document
    .getElementById("budgetEdit")
    .classList.add("hidden");

  document
    .getElementById("budgetReadonly")
    .classList.remove("hidden");
}


/* =========================================================
   Transactions
========================================================= */

async function loadTransactions(month) {

  if (!currentUser) {

    transactions = [];

    return;
  }

  month =
    normalizeMonth(month);

  const start =
    `${month}-01`;

  const end =
    getNextMonth(month);

  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(start) ||
    !/^\d{4}-\d{2}-\d{2}$/.test(end)
  ) {

    console.error(
      "Invalid date range:",
      {
        month,
        start,
        end
      }
    );

    toast(
      "月份格式錯誤，已自動修正。"
    );

    currentMonth =
      getSafeCurrentMonth();

    setMonthInput();

    return loadTransactions(
      currentMonth
    );
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("transactions")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .gte(
        "date",
        start
      )
      .lt(
        "date",
        end
      )
      .order(
        "date",
        {
          ascending: false
        }
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(
      "Supabase loadTransactions error:",
      error
    );

    throw error;
  }

  transactions =
    data || [];
}


/* =========================================================
   Add Transaction
========================================================= */

async function addTransaction(event) {

  event.preventDefault();

  if (!currentUser) {
    return;
  }

  const date =
    document
      .getElementById("txDate")
      .value;

  const item =
    document
      .getElementById("txItem")
      .value
      .trim();

  const category =
    document
      .getElementById("txCategory")
      .value;

  const paymentMethod =
    document
      .getElementById("txPaymentMethod")
      .value;

  const amount =
    Number(
      document
        .getElementById("txAmount")
        .value
    );

  const note =
    document
      .getElementById("txNote")
      .value
      .trim();

  if (!date || !item || amount <= 0) {

    toast(
      "請確認日期、項目與金額"
    );

    return;
  }

  showLoading(true);

  try {

    const {
      error
    } =
      await supabaseClient
        .from("transactions")
        .insert({
          user_id:
            currentUser.id,

          date,

          item,

          category,

          payment_method:
            paymentMethod,

          amount,

          note:
            note || null
        });

    if (error) {
      throw error;
    }

    const transactionMonth =
      date.slice(0, 7);

    resetTransactionForm();

    if (
      transactionMonth !==
      currentMonth
    ) {

      toast(
        `已新增，但這筆記帳屬於 ${getMonthLabel(transactionMonth)}`
      );

    } else {

      await loadTransactions(
        currentMonth
      );

      renderAll();

      toast(
        "✅ 記帳成功"
      );
    }

  } catch (error) {

    console.error(error);

    toast(
      "新增記帳失敗：" +
      error.message
    );

  } finally {

    showLoading(false);
  }
}


function resetTransactionForm() {

  const form =
    document.getElementById(
      "transactionForm"
    );

  form.reset();

  setDefaultTransactionDate();
}


function setDefaultTransactionDate() {

  const input =
    document.getElementById(
      "txDate"
    );

  if (!input) {
    return;
  }

  const now =
    new Date();

  const todayMonth =
    `${now.getFullYear()}-` +
    `${String(now.getMonth() + 1).padStart(2, "0")}`;

  if (
    todayMonth ===
    currentMonth
  ) {

    input.value =
      `${todayMonth}-` +
      `${String(now.getDate()).padStart(2, "0")}`;

  } else {

    input.value =
      `${currentMonth}-01`;
  }
}


/* =========================================================
   Edit Transaction
========================================================= */

function openEditModal(id) {

  const tx =
    transactions.find(
      item => item.id === id
    );

  if (!tx) {
    return;
  }

  document
    .getElementById("editId")
    .value =
    tx.id;

  document
    .getElementById("editDate")
    .value =
    tx.date;

  document
    .getElementById("editItem")
    .value =
    tx.item || "";

  document
    .getElementById("editCategory")
    .value =
    tx.category;

  document
    .getElementById("editPaymentMethod")
    .value =
    tx.payment_method;

  document
    .getElementById("editAmount")
    .value =
    tx.amount;

  document
    .getElementById("editNote")
    .value =
    tx.note || "";

  document
    .getElementById("editModal")
    .classList.add("show");
}


function closeEditModal() {

  document
    .getElementById("editModal")
    .classList.remove("show");
}


async function saveEditedTransaction(event) {

  event.preventDefault();

  const id =
    document
      .getElementById("editId")
      .value;

  const date =
    document
      .getElementById("editDate")
      .value;

  const item =
    document
      .getElementById("editItem")
      .value
      .trim();

  const category =
    document
      .getElementById("editCategory")
      .value;

  const paymentMethod =
    document
      .getElementById("editPaymentMethod")
      .value;

  const amount =
    Number(
      document
        .getElementById("editAmount")
        .value
    );

  const note =
    document
      .getElementById("editNote")
      .value
      .trim();

  if (!id || !date || !item || amount <= 0) {

    toast(
      "請確認資料是否完整"
    );

    return;
  }

  showLoading(true);

  try {

    const {
      error
    } =
      await supabaseClient
        .from("transactions")
        .update({

          date,

          item,

          category,

          payment_method:
            paymentMethod,

          amount,

          note:
            note || null

        })
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentUser.id
        );

    if (error) {
      throw error;
    }

    closeEditModal();

    await loadTransactions(
      currentMonth
    );

    renderAll();

    const newMonth =
      date.slice(0, 7);

    if (
      newMonth !==
      currentMonth
    ) {

      toast(
        `已修改，這筆記帳已移至 ${getMonthLabel(newMonth)}`
      );

    } else {

      toast(
        "✅ 記帳已修改"
      );
    }

  } catch (error) {

    console.error(error);

    toast(
      "修改失敗：" +
      error.message
    );

  } finally {

    showLoading(false);
  }
}


/* =========================================================
   Delete
========================================================= */

async function deleteTransaction(id) {

  const tx =
    transactions.find(
      item => item.id === id
    );

  if (!tx) {
    return;
  }

  const confirmed =
    confirm(
      `確定要刪除「${tx.item}」${formatMoney(tx.amount)} 嗎？`
    );

  if (!confirmed) {
    return;
  }

  showLoading(true);

  try {

    const {
      error
    } =
      await supabaseClient
        .from("transactions")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentUser.id
        );

    if (error) {
      throw error;
    }

    transactions =
      transactions.filter(
        item =>
          item.id !== id
      );

    renderAll();

    toast(
      "🗑️ 已刪除記帳"
    );

  } catch (error) {

    console.error(error);

    toast(
      "刪除失敗：" +
      error.message
    );

  } finally {

    showLoading(false);
  }
}


/* =========================================================
   Category Mapping
========================================================= */

const categoryMap = {

  "必要生活費": {
    key: "necessary",
    icon: "🏠"
  },

  "信用卡": {
    key: "credit_card",
    icon: "💳"
  },

  "現金／預備金": {
    key: "cash_reserve",
    icon: "💵"
  },

  "自由支出": {
    key: "free_spending",
    icon: "🎮"
  },

  "投資": {
    key: "investment",
    icon: "📈"
  },

  "其他": {
    key: "other",
    icon: "📦"
  }
};


/* =========================================================
   Calculate
========================================================= */

function getCategorySpent(category) {

  return transactions
    .filter(
      tx =>
        tx.category === category
    )
    .reduce(
      (
        total,
        tx
      ) =>
        total +
        Number(tx.amount || 0),
      0
    );
}


function getTotalExpense() {

  return transactions.reduce(
    (
      total,
      tx
    ) =>
      total +
      Number(tx.amount || 0),
    0
  );
}


function getCreditCardExpense() {

  return transactions
    .filter(
      tx =>
        tx.payment_method ===
        "信用卡"
    )
    .reduce(
      (
        total,
        tx
      ) =>
        total +
        Number(tx.amount || 0),
      0
    );
}


function getCashExpense() {

  return transactions
    .filter(
      tx =>
        tx.payment_method ===
        "現金"
    )
    .reduce(
      (
        total,
        tx
      ) =>
        total +
        Number(tx.amount || 0),
      0
    );
}


function getTotalBudget() {

  return (
    Number(budget.necessary) +
    Number(budget.credit_card) +
    Number(budget.cash_reserve) +
    Number(budget.free_spending) +
    Number(budget.investment) +
    Number(budget.other)
  );
}


/* =========================================================
   Render All
========================================================= */

function renderAll() {

  setMonthInput();

  renderDashboard();

  renderBudgetPage();

  renderTransactions();

  renderTransactionRecent();

  setDefaultTransactionDate();
}


/* =========================================================
   Dashboard
========================================================= */

function renderDashboard() {

  const income =
    Number(budget.income || 0);

  const expense =
    getTotalExpense();

  const remaining =
    income - expense;

  document
    .getElementById("statIncome")
    .textContent =
    formatMoney(income);

  document
    .getElementById("statExpense")
    .textContent =
    formatMoney(expense);

  document
    .getElementById("statRemaining")
    .textContent =
    formatMoney(remaining);

  document
    .getElementById("statCreditCard")
    .textContent =
    formatMoney(
      getCreditCardExpense()
    );

  renderHomeBudget();

  renderHomeRecent();
}


function renderHomeBudget() {

  const container =
    document.getElementById(
      "homeBudgetList"
    );

  const categories =
    Object.keys(categoryMap);

  container.innerHTML =
    categories.map(
      category => {

        const info =
          categoryMap[category];

        const budgetAmount =
          Number(
            budget[info.key] || 0
          );

        const spent =
          getCategorySpent(
            category
          );

        let percent = 0;

        if (budgetAmount > 0) {
          percent =
            Math.round(
              spent /
              budgetAmount *
              100
            );
        }

        const width =
          Math.min(
            percent,
            100
          );

        const over =
          spent >
          budgetAmount &&
          budgetAmount > 0;

        return `
          <div class="budget-row">

            <div class="budget-row-head">

              <div class="budget-name">
                ${info.icon}
                ${escapeHtml(category)}
              </div>

              <div class="budget-number">
                ${formatMoney(spent)}
                /
                ${formatMoney(budgetAmount)}
              </div>

            </div>

            <div class="progress">
              <div
                class="progress-bar ${over ? "over" : ""}"
                style="width:${width}%"
              ></div>
            </div>

          </div>
        `;
      }
    ).join("");
}


function renderHomeRecent() {

  const container =
    document.getElementById(
      "homeRecentList"
    );

  const list =
    transactions.slice(0, 5);

  if (!list.length) {

    container.innerHTML =
      `<div class="empty">
        📭 本月還沒有記帳
      </div>`;

    return;
  }

  container.innerHTML =
    list.map(
      tx =>
        renderTransactionItem(
          tx,
          false
        )
    ).join("");
}


/* =========================================================
   Budget Page
========================================================= */

function renderBudgetPage() {

  const totalBudget =
    getTotalBudget();

  const expense =
    getTotalExpense();

  const remaining =
    totalBudget - expense;

  document
    .getElementById("readonlyIncome")
    .textContent =
    formatMoney(
      budget.income
    );

  document
    .getElementById("readonlyBudgetTotal")
    .textContent =
    formatMoney(
      totalBudget
    );

  document
    .getElementById("readonlyExpense")
    .textContent =
    formatMoney(
      expense
    );

  document
    .getElementById("readonlyBudgetRemaining")
    .textContent =
    formatMoney(
      remaining
    );


  const container =
    document.getElementById(
      "readonlyBudgetList"
    );

  container.innerHTML =
    Object.keys(categoryMap)
      .map(category => {

        const info =
          categoryMap[category];

        const amount =
          Number(
            budget[info.key] || 0
          );

        const spent =
          getCategorySpent(
            category
          );

        const remain =
          amount - spent;

        const percent =
          amount > 0
            ? Math.round(
                spent /
                amount *
                100
              )
            : 0;

        const width =
          Math.min(
            percent,
            100
          );

        const over =
          spent >
          amount &&
          amount > 0;

        return `
          <div class="budget-row">

            <div class="budget-row-head">

              <div class="budget-name">
                ${info.icon}
                ${escapeHtml(category)}
              </div>

              <div class="budget-number">
                ${formatMoney(spent)}
                /
                ${formatMoney(amount)}
              </div>

            </div>

            <div class="progress">
              <div
                class="progress-bar ${over ? "over" : ""}"
                style="width:${width}%"
              ></div>
            </div>

            <div
              style="
                margin-top:7px;
                font-size:12px;
                color:${remain < 0 ? "var(--danger)" : "var(--muted)"};
              "
            >
              ${remain >= 0 ? "剩餘" : "超支"}
              ${formatMoney(Math.abs(remain))}
            </div>

          </div>
        `;
      })
      .join("");
}


/* =========================================================
   Transaction List
========================================================= */

function renderTransactions() {

  const container =
    document.getElementById(
      "transactionList"
    );

  if (!container) {
    return;
  }

  const search =
    (
      document
        .getElementById(
          "searchInput"
        )
        ?.value || ""
    )
      .trim()
      .toLowerCase();

  const category =
    document
      .getElementById(
        "filterCategory"
      )
      ?.value || "";

  const payment =
    document
      .getElementById(
        "filterPayment"
      )
      ?.value || "";


  const filtered =
    transactions.filter(
      tx => {

        const searchMatch =
          !search ||
          String(tx.item || "")
            .toLowerCase()
            .includes(search) ||
          String(tx.note || "")
            .toLowerCase()
            .includes(search);

        const categoryMatch =
          !category ||
          tx.category === category;

        const paymentMatch =
          !payment ||
          tx.payment_method === payment;

        return (
          searchMatch &&
          categoryMatch &&
          paymentMatch
        );
      }
    );


  const summary =
    document.getElementById(
      "listSummary"
    );

  if (summary) {

    const total =
      filtered.reduce(
        (
          sum,
          tx
        ) =>
          sum +
          Number(tx.amount || 0),
        0
      );

    summary.textContent =
      `共 ${filtered.length} 筆｜合計 ${formatMoney(total)}`;
  }


  if (!filtered.length) {

    container.innerHTML =
      `<div class="empty">
        📭 沒有符合條件的記帳
      </div>`;

    return;
  }


  container.innerHTML =
    filtered
      .map(
        tx =>
          renderTransactionItem(
            tx,
            true
          )
      )
      .join("");
}


function renderTransactionRecent() {

  const container =
    document.getElementById(
      "transactionRecentList"
    );

  if (!container) {
    return;
  }

  const list =
    transactions.slice(0, 5);

  if (!list.length) {

    container.innerHTML =
      `<div class="empty">
        📭 本月還沒有記帳
      </div>`;

    return;
  }

  container.innerHTML =
    list
      .map(
        tx =>
          renderTransactionItem(
            tx,
            true
          )
      )
      .join("");
}


function renderTransactionItem(
  tx,
  showButtons = true
) {

  const categoryInfo =
    categoryMap[
      tx.category
    ];

  const icon =
    categoryInfo?.icon ||
    "📦";

  return `
    <div class="transaction-item">

      <div class="transaction-main">

        <div class="transaction-title">
          ${escapeHtml(tx.item)}
        </div>

        <div class="transaction-meta">
          ${escapeHtml(tx.date)}
          ・
          ${icon}
          ${escapeHtml(tx.category)}
          ・
          ${escapeHtml(tx.payment_method)}
          ${
            tx.note
              ? `・ ${escapeHtml(tx.note)}`
              : ""
          }
        </div>

        ${
          showButtons
            ? `
              <div class="transaction-buttons">

                <button
                  class="mini-btn mini-edit"
                  onclick="openEditModal('${tx.id}')"
                >
                  ✏️ 編輯
                </button>

                <button
                  class="mini-btn mini-delete"
                  onclick="deleteTransaction('${tx.id}')"
                >
                  🗑️ 刪除
                </button>

              </div>
            `
            : ""
        }

      </div>

      <div class="transaction-amount expense">
        -${formatMoney(tx.amount)}
      </div>

    </div>
  `;
}


/* =========================================================
   Page Navigation
========================================================= */

function showPage(page) {

  currentPage =
    page;

  document
    .querySelectorAll(".page")
    .forEach(
      element => {

        element.classList.toggle(
          "active",
          element.id ===
          `page-${page}`
        );
      }
    );


  document
    .querySelectorAll(
      ".nav-btn, .mobile-nav button"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.page ===
          page
        );
      }
    );


  if (
    page ===
    "transaction"
  ) {

    setDefaultTransactionDate();
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   Modal click outside
========================================================= */

document
  .getElementById("editModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {
        closeEditModal();
      }
    }
  );


/* =========================================================
   Supabase Auth Listener
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event ===
      "SIGNED_OUT"
    ) {

      currentUser = null;

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("authPage")
        .classList.remove("hidden");

      return;
    }

    if (
      event ===
      "SIGNED_IN" &&
      session?.user &&
      !currentUser
    ) {

      currentUser =
        session.user;

      await startApp();
    }
  }
);


/* =========================================================
   Start
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    setDefaultTransactionDate();

    init();
  }
);

</script>
