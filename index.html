<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>每月預算記帳本</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --soft: #f3f4f6;
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;
      --radius: 18px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* =========================
       AUTH
    ========================= */

    #authView {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: min(420px, 100%);
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .auth-title {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      outline: none;
      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 3px rgba(156,163,175,.15);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      transition: .2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: .9;
    }

    .btn-secondary {
      background: var(--soft);
      color: var(--text);
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-success {
      background: #d1fae5;
      color: #047857;
    }

    .btn-full {
      width: 100%;
    }

    .auth-switch {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-switch button {
      background: none;
      border: 0;
      font-weight: 700;
      color: var(--text);
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-control input {
      width: 145px;
      padding: 9px 12px;
    }

    /* =========================
       LEDGER SELECTOR
    ========================= */

    .ledger-card {
      margin-top: 22px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .ledger-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .ledger-name {
      font-size: 20px;
      font-weight: 800;
    }

    .ledger-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* =========================
       PAGE
    ========================= */

    main {
      padding-bottom: 100px;
    }

    .page {
      margin-top: 20px;
    }

    .page-title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 18px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    /* =========================
       BUDGET
    ========================= */

    .budget-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .budget-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
    }

    .budget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .budget-name {
      font-weight: 700;
    }

    .budget-number {
      color: var(--muted);
      font-size: 13px;
    }

    .progress {
      height: 8px;
      background: #edf0f2;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #111827;
      border-radius: 99px;
    }

    .budget-percent {
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    /* =========================
       TRANSACTION
    ========================= */

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
    }

    .tx-main {
      min-width: 0;
    }

    .tx-item-name {
      font-weight: 750;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .tx-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .tx-right {
      text-align: right;
      white-space: nowrap;
    }

    .tx-amount {
      font-size: 18px;
      font-weight: 800;
    }

    .tx-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 7px;
    }

    .mini-btn {
      border: 0;
      background: var(--soft);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .empty {
      padding: 30px 10px;
      text-align: center;
      color: var(--muted);
    }

    /* =========================
       FORM GRID
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    /* =========================
       SEARCH
    ========================= */

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 15px;
    }

    /* =========================
       SETTINGS
    ========================= */

    .setting-item {
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-item:last-child {
      border-bottom: 0;
    }

    .setting-title {
      font-weight: 750;
      margin-bottom: 6px;
    }

    .setting-desc {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    /* =========================
       MEMBERS
    ========================= */

    .member {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .member:last-child {
      border-bottom: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .member-name {
      font-weight: 700;
    }

    .member-role {
      font-size: 12px;
      color: var(--muted);
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav-inner {
      max-width: 700px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      padding: 10px 4px 9px;
      color: #9ca3af;
      font-size: 11px;
    }

    .nav-btn .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    .nav-btn.active {
      color: var(--text);
      font-weight: 800;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: min(500px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 20px;
      padding: 22px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .budget-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 22px, 1100px);
      }

      .topbar-inner {
        min-height: 60px;
      }

      .brand {
        font-size: 16px;
      }

      .month-control {
        display: none;
      }

      .ledger-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .ledger-actions {
        width: 100%;
      }

      .ledger-actions .btn {
        flex: 1;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-value {
        font-size: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-full {
        grid-column: auto;
      }

      .filter-row {
        grid-template-columns: 1fr;
      }

      .tx-item {
        padding: 13px;
      }

      .tx-amount {
        font-size: 16px;
      }

      .card {
        padding: 16px;
      }

      .auth-card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH
  ========================= -->

  <section id="authView">
    <div class="auth-card">

      <div class="logo">💰</div>

      <div class="auth-title">每月預算記帳本</div>

      <div class="auth-subtitle">
        個人使用，也可以和另一半一起記帳
      </div>

      <form id="authForm">

        <div class="form-group">
          <label>Email</label>
          <input
            id="authEmail"
            type="email"
            autocomplete="email"
            placeholder="your@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label>密碼</label>
          <input
            id="authPassword"
            type="password"
            autocomplete="current-password"
            placeholder="至少 6 個字元"
            required
          />
        </div>

        <button
          id="authSubmit"
          class="btn btn-primary btn-full"
          type="submit"
        >
          登入
        </button>

      </form>

      <div class="auth-switch">
        <span id="authSwitchText">還沒有帳號？</span>
        <button id="authSwitchBtn" type="button">
          註冊
        </button>
      </div>

    </div>
  </section>


  <!-- =========================
       APP
  ========================= -->

  <section id="appView" class="hidden">

    <header class="topbar">
      <div class="container topbar-inner">

        <div class="brand">
          💰 每月預算記帳本
        </div>

        <div class="top-actions">

          <div class="month-control">
            <input
              id="monthInput"
              type="month"
              onchange="changeMonth()"
            />
          </div>

          <button
            class="btn btn-secondary"
            onclick="logout()"
          >
            登出
          </button>

        </div>

      </div>
    </header>


    <main>

      <div class="container">

        <!-- LEDGER -->
        <section class="ledger-card">

          <div>
            <div class="ledger-label">
              目前帳本
            </div>

            <div
              id="currentLedgerName"
              class="ledger-name"
            >
              我的帳本
            </div>
          </div>

          <div class="ledger-actions">

            <button
              class="btn btn-secondary"
              onclick="openLedgerManager()"
            >
              🔄 切換帳本
            </button>

            <button
              class="btn btn-secondary"
              onclick="openJoin()"
            >
              🔑 加入共用帳本
            </button>

          </div>

        </section>


        <!-- PAGE CONTAINER -->

        <section id="pageHome" class="page"></section>

        <section id="pageAdd" class="page hidden"></section>

        <section id="pageBudget" class="page hidden"></section>

        <section id="pageDetail" class="page hidden"></section>

        <section id="pageSettings" class="page hidden"></section>

      </div>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <button
          class="nav-btn active"
          data-page="home"
          onclick="showPage('home')"
        >
          <span class="nav-icon">🏠</span>
          首頁
        </button>

        <button
          class="nav-btn"
          data-page="add"
          onclick="showPage('add')"
        >
          <span class="nav-icon">➕</span>
          記帳
        </button>

        <button
          class="nav-btn"
          data-page="budget"
          onclick="showPage('budget')"
        >
          <span class="nav-icon">💰</span>
          預算
        </button>

        <button
          class="nav-btn"
          data-page="detail"
          onclick="showPage('detail')"
        >
          <span class="nav-icon">📋</span>
          明細
        </button>

        <button
          class="nav-btn"
          data-page="settings"
          onclick="showPage('settings')"
        >
          <span class="nav-icon">⚙️</span>
          設定
        </button>

      </div>

    </nav>

  </section>


  <!-- MODAL -->

  <div id="modalRoot"></div>

  <!-- TOAST -->

  <div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://dxzzgcsatudrgjnbtbnl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_m5bOwLJZRbhQls_76MoDrw_jCiF7Sbd";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let ledgers = [];

let currentLedger = null;

let transactions = [];

let budget = null;

let currentMonth =
  getSafeCurrentMonth();

let currentPage = "home";

let authMode = "login";


/* =========================================================
   CATEGORY
========================================================= */

const categoryMap = {

  "必要生活費": {
    key: "necessary",
    icon: "🏠"
  },

  "信用卡": {
    key: "credit_card",
    icon: "💳"
  },

  "現金／預備金": {
    key: "cash_reserve",
    icon: "💵"
  },

  "自由支出": {
    key: "free_spending",
    icon: "🎮"
  },

  "投資": {
    key: "investment",
    icon: "📈"
  },

  "其他": {
    key: "other",
    icon: "📦"
  }

};


/* =========================================================
   DEFAULT BUDGET
========================================================= */

const defaultBudget = {

  income: 36000,

  necessary: 7000,

  credit_card: 15000,

  cash_reserve: 5000,

  free_spending: 10000,

  investment: 0,

  other: 0

};


/* =========================================================
   BASIC FUNCTIONS
========================================================= */

function getSafeCurrentMonth() {

  const now = new Date();

  return (
    now.getFullYear() +
    "-" +
    String(now.getMonth() + 1).padStart(2, "0")
  );

}


function normalizeMonth(month) {

  if (
    typeof month === "string" &&
    /^\d{4}-\d{2}$/.test(month)
  ) {

    return month;

  }

  return getSafeCurrentMonth();

}


function getNextMonth(month) {

  month = normalizeMonth(month);

  const [year, monthNumber] =
    month.split("-").map(Number);

  const date =
    new Date(
      year,
      monthNumber,
      1
    );

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2, "0") +
    "-01"
  );

}


function money(value) {

  return Number(value || 0)
    .toLocaleString(
      "zh-TW"
    );

}


function esc(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function toast(message) {

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(() => {

      el.classList.remove("show");

    }, 2500);

}


function setMonthInput() {

  const input =
    document.getElementById(
      "monthInput"
    );

  if (input) {

    input.value =
      normalizeMonth(
        currentMonth
      );

  }

}


/* =========================================================
   AUTH
========================================================= */

function updateAuthUI() {

  const submit =
    document.getElementById(
      "authSubmit"
    );

  const switchText =
    document.getElementById(
      "authSwitchText"
    );

  const switchBtn =
    document.getElementById(
      "authSwitchBtn"
    );

  if (authMode === "login") {

    submit.textContent = "登入";

    switchText.textContent =
      "還沒有帳號？";

    switchBtn.textContent =
      "註冊";

  } else {

    submit.textContent = "註冊";

    switchText.textContent =
      "已經有帳號？";

    switchBtn.textContent =
      "登入";

  }

}


async function handleAuth(event) {

  event.preventDefault();

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  if (!email || !password) {

    toast("請輸入 Email 和密碼");

    return;

  }

  const button =
    document.getElementById(
      "authSubmit"
    );

  button.disabled = true;

  try {

    if (authMode === "login") {

      const {
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      toast("登入成功");

    } else {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      if (error) throw error;

      if (
        data.user &&
        !data.session
      ) {

        toast(
          "註冊成功，請確認 Email 後再登入"
        );

      } else {

        toast("註冊成功");

      }

    }

  } catch (error) {

    console.error(error);

    toast(
      error.message ||
      "操作失敗"
    );

  } finally {

    button.disabled = false;

  }

}


async function logout() {

  await supabaseClient.auth.signOut();

}


function switchAuthMode() {

  authMode =
    authMode === "login"
      ? "register"
      : "login";

  updateAuthUI();

}


/* =========================================================
   LEDGER
========================================================= */

async function ensurePersonalLedger() {

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "ensure_personal_ledger"
    );

async function loadLedgers() {

  const personalId =
    await ensurePersonalLedger();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("ledgers")
      .select("*")
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {

    throw error;

  }

  ledgers = data || [];

  if (!currentLedger) {

    currentLedger =
      ledgers.find(
        l => l.id === personalId
      ) ||
      ledgers[0];

  } else {

    currentLedger =
      ledgers.find(
        l =>
          l.id === currentLedger.id
      ) ||
      ledgers[0];

  }

  renderLedgerHeader();

}

/* =========================================================
   LOAD DATA
========================================================= */

async function loadMonthData() {

  if (
    !currentUser ||
    !currentLedger
  ) {

    transactions = [];

    budget = null;

    return;

  }

  currentMonth =
    normalizeMonth(
      currentMonth
    );

  await Promise.all([
    loadBudget(),
    loadTransactions()
  ]);

}


async function loadBudget() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("budgets")
      .select("*")
      .eq(
        "ledger_id",
        currentLedger.id
      )
      .eq(
        "month",
        currentMonth + "-01"
      )
      .maybeSingle();

  if (error) {

    console.error(error);

    toast(
      "讀取預算失敗：" +
      error.message
    );

    budget = {
      ...defaultBudget
    };

    return;

  }

  budget =
    data
      ? {
          ...defaultBudget,
          ...data
        }
      : {
          ...defaultBudget
        };

}


async function loadTransactions() {

  const start =
    currentMonth + "-01";

  const end =
    getNextMonth(
      currentMonth
    );

  const {
    data,
    error
  } =
    await supabaseClient
      .from("transactions")
      .select("*")
      .eq(
        "ledger_id",
        currentLedger.id
      )
      .gte(
        "date",
        start
      )
      .lt(
        "date",
        end
      )
      .order(
        "date",
        {
          ascending: false
        }
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(error);

    toast(
      "讀取記帳失敗：" +
      error.message
    );

    transactions = [];

    return;

  }

  transactions =
    data || [];

}

/* =========================================================
   CALC
========================================================= */

function calc() {

  const total =
    transactions.reduce(
      (sum, tx) =>
        sum + Number(tx.amount || 0),
      0
    );

  const credit =
    transactions
      .filter(
        tx =>
          tx.payment_method ===
          "信用卡"
      )
      .reduce(
        (sum, tx) =>
          sum + Number(tx.amount || 0),
        0
      );

  const cash =
    transactions
      .filter(
        tx =>
          tx.payment_method ===
          "現金"
      )
      .reduce(
        (sum, tx) =>
          sum + Number(tx.amount || 0),
        0
      );

  const income =
    Number(
      budget?.income || 0
    );

  return {

    total,

    credit,

    cash,

    income,

    remaining:
      income - total

  };

}


function categoryActual(key) {

  return transactions
    .filter(
      tx =>
        categoryMap[
          tx.category
        ]?.key === key
    )
    .reduce(
      (sum, tx) =>
        sum + Number(tx.amount || 0),
      0
    );

}

    limit > 0
      ? Math.round(
          actual / limit * 100

  const width =
    Math.min(
      percent,
      100
    );

  return `

    <div class="budget-item">

      <div class="budget-head">

        <div class="budget-name">
          ${
            categoryMap[
              name
            ]?.icon || ""

async function addTransaction(event) {

  event.preventDefault();

  if (!currentLedger) {

    toast("請先選擇帳本");

    return;

  }

  const date =
    document.getElementById(
      "txDate"
    ).value;

  const item =
    document.getElementById(
      "txItem"
    ).value.trim();

  const category =
    document.getElementById(
      "txCategory"
    ).value;

  const payment =
    document.getElementById(
      "txPayment"
    ).value;

  const amount =
    Number(
      document.getElementById(
        "txAmount"
      ).value
    );

  const note =
    document.getElementById(
      "txNote"
    ).value.trim();

  if (
    !date ||
    !item ||
    !category ||
    !payment ||
    !amount
  ) {

    toast(
      "請把必要欄位填寫完整"
    );

    return;

  }

  const {
    error
  } =
    await supabaseClient
      .from("transactions")
      .insert({

        user_id:
          currentUser.id,

        ledger_id:
          currentLedger.id,

        date,

        item,

        category,

        payment_method:
          payment,

        amount,

        note:
          note || null

      });

  if (error) {

    console.error(error);

    toast(
      "新增失敗：" +
      error.message
    );

    return;

  }

  toast("記帳成功 🎉");

  await loadMonthData();

  showPage("home");

}

      >

        ${transactions
          .map(txHtml)
          .join("")}

      </div>

    </div>

  `;

  if (!transactions.length) {

    document.getElementById(
      "detailList"
    ).innerHTML = `

      <div class="empty">
        📭 本月沒有符合條件的記帳
      </div>

    `;

  }

}


function filterTransactions() {

  const keyword =
    (
      document.getElementById(
        "searchInput"
      )?.value || ""
    )
      .trim()
      .toLowerCase();

  const category =
    document.getElementById(
      "filterCategory"
    )?.value || "";

  const list =
    transactions.filter(
      tx => {

        const text =
          (
            tx.item +
            " " +
            (tx.note || "")
          ).toLowerCase();

        return (
          (!keyword ||
            text.includes(keyword)) &&
          (!category ||
            tx.category === category)
        );

      }
    );

  const el =
    document.getElementById(
      "detailList"
    );

  if (!el) return;

  el.innerHTML =
    list.length
      ? list.map(txHtml).join("")
      : `
        <div class="empty">
          📭 沒有符合條件的記帳
        </div>
      `;

}

/* =========================================================

========================================================= */

function openCreateShared() {

    "modalRoot"
  ).innerHTML = `

    <div
      class="modal-bg"
      onclick="closeModal(event)"
    >

      <div
        class="modal"
        onclick="event.stopPropagation()"
      >

          💑 建立情侶共用帳本
        </div>

            onclick="closeModal()"

}


async function doCreateShared() {

  const name =
    document.getElementById(
      "sharedName"
    ).value.trim() ||
    "情侶共用帳本";

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "create_shared_ledger",
      {
        p_name: name
      }
    );

  if (error) {

    toast(
      "建立失敗：" +
      error.message
    );

    return;

  }

  closeModal();

  currentLedger = null;

  await loadLedgers();

  currentLedger =
    ledgers.find(
      l => l.id === data
    ) || currentLedger;

  await loadMonthData();

  renderCurrentPage();

  toast(
    "共用帳本建立成功 💑"
  );

}

/* =========================================================
   JOIN
========================================================= */

function openJoin() {

  document.getElementById(
    "modalRoot"
  ).innerHTML = `

    <div
      class="modal-bg"

    >

      <div
        class="modal"

        </div>

          >

          </button>

}


async function doJoin() {

  const code =
    document.getElementById(
      "inviteCode"
    ).value.trim();

  if (!code) {

    toast("請輸入邀請碼");

    return;

  }

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "join_ledger_by_code",
      {
        p_code: code
      }
    );

  if (error) {

    toast(
      error.message ||
      "加入失敗"
    );

    return;

  }

  closeModal();

  currentLedger = null;

  await loadLedgers();

  currentLedger =
    ledgers.find(
      l => l.id === data
    ) || currentLedger;

  await loadMonthData();

  renderCurrentPage();

  toast(
    "成功加入共用帳本 💑"
  );

}


/* =========================================================
   MEMBERS
========================================================= */

async function openMembers() {

  if (
    !currentLedger ||
    currentLedger.type !==
      "shared"
  ) {

    return;

  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("ledger_members")
      .select("*")
      .eq(
        "ledger_id",
        currentLedger.id
      )
      .order(
        "joined_at",
        {
          ascending: true
        }
      );

  if (error) {

    toast(
      "讀取成員失敗：" +
      error.message
    );

    return;

  }

  document.getElementById(
    "modalRoot"
  ).innerHTML = `

    <div
      class="modal-bg"
      onclick="closeModal(event)"
    >

      <div
        class="modal"
        onclick="event.stopPropagation()"
      >

        <div class="modal-title">
          👥 共用帳本成員
        </div>

        ${
          data?.length
            ? data
                .map(
                  member => `

                    <div class="member">

                      <div class="avatar">
                        ${
                          member.user_id ===
                          currentUser.id
                            ? "我"
                            : "💑"
                        }
                      </div>

                      <div>

                        <div class="member-name">
                          ${
                            member.user_id ===
                            currentUser.id
                              ? "我"
                              : "另一半"
                          }
                        </div>

                        <div class="member-role">
                          ${
                            member.role ===
                            "owner"
                              ? "帳本擁有者"
                              : "共同成員"
                          }
                        </div>

                      </div>

                    </div>

                  `
                )
                .join("")
            : `
              <div class="empty">
                目前沒有其他成員
              </div>
            `
        }

        <div class="modal-actions">

          <button
            class="btn btn-primary"
            onclick="closeModal()"
          >
            完成
          </button>

        </div>

      </div>

    </div>

  `;

}

   LEDGER MANAGER

/* =========================================================
   COPY
========================================================= */

async function copyText(text) {

  try {

    await navigator.clipboard.writeText(
      text
    );

    toast(
      "已複製到剪貼簿 📋"
    );

  } catch {

    toast(
      "複製失敗，請手動複製"
    );

  }

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(event) {

  if (
    event &&
    event.target !==
      event.currentTarget
  ) {

    return;

  }

  document.getElementById(
    "modalRoot"
  ).innerHTML = "";

}


/* =========================================================
   MONTH
========================================================= */

async function changeMonth() {

  const input =
    document.getElementById(
      "monthInput"
    );

  let value =
    input?.value || "";

  value =
    normalizeMonth(
      value
    );

  currentMonth =
    value;

  setMonthInput();

  await loadMonthData();

  renderCurrentPage();

}


/* =========================================================
   BOOT
========================================================= */

async function boot() {

  setMonthInput();

  updateAuthUI();

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if (
    data?.session?.user
  ) {

    currentUser =
      data.session.user;

    await enterApp();

  } else {

    showAuth();

  }

}


async function enterApp() {

  document
    .getElementById(
      "authView"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "appView"
    )
    .classList.remove(
      "hidden"
    );

  try {

    await loadLedgers();

    currentMonth =
      normalizeMonth(
        currentMonth
      );

    setMonthInput();

    await loadMonthData();

    showPage(
      currentPage
    );

  } catch (error) {

    console.error(error);

    toast(
      "載入失敗：" +
      error.message
    );

  }

}


function showAuth() {

  document
    .getElementById(
      "appView"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "authView"
    )
    .classList.remove(
      "hidden"
    );

}


/* =========================================================
   AUTH EVENTS
========================================================= */

document
  .getElementById(
    "authForm"
  )
  .addEventListener(
    "submit",
    handleAuth
  );


document
  .getElementById(
    "authSwitchBtn"
  )
  .addEventListener(
    "click",
    switchAuthMode
  );


supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      session?.user
    ) {

      currentUser =
        session.user;

      await enterApp();

    } else {

      currentUser =
        null;

      currentLedger =
        null;

      ledgers = [];

      transactions = [];

      budget = null;

      showAuth();

    }

  }
);


/* =========================================================
   START
========================================================= */

boot();

</script>
