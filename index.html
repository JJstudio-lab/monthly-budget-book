<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>每月預算記帳本 V1.5</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: min(1150px, 94%);
      margin: 0 auto;
      padding: 25px 0 50px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .login-box {
      max-width: 430px;
      margin: 80px auto;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 11px 12px;
      margin-top: 6px;
      margin-bottom: 12px;
      border-radius: 9px;
      border: 1px solid #d7dbe2;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #777;
    }

    button {
      cursor: pointer;
      border: none;
      background: #222;
      color: white;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.88;
    }

    .secondary {
      background: #e9edf3;
      color: #222;
    }

    .edit-btn {
      background: #555;
      padding: 7px 10px;
      width: auto;
      margin: 0 4px 0 0;
      font-size: 13px;
    }

    .danger {
      background: #c62828;
      padding: 7px 10px;
      width: auto;
      margin: 0;
      font-size: 13px;
    }

    .small-btn {
      width: auto;
      padding: 8px 12px;
      margin: 0;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .stat {
      padding: 18px;
      border-radius: 13px;
      background: #f7f8fa;
    }

    .stat-title {
      font-size: 14px;
      color: #777;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .money {
      font-variant-numeric: tabular-nums;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .budget-table,
    .transaction-table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 11px 8px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    th {
      color: #666;
      font-size: 14px;
      white-space: nowrap;
    }

    .right {
      text-align: right;
    }

    .progress {
      width: 100%;
      height: 9px;
      background: #e9edf2;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-bar {
      height: 100%;
      background: #222;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .over {
      background: #d32f2f;
    }

    .warning-text {
      color: #c62828;
      font-weight: 700;
    }

    .safe-text {
      color: #2e7d32;
      font-weight: 600;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .month-control input {
      margin: 0;
      width: 160px;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 9px 15px;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 12px;
      align-items: end;
    }

    .filter-grid input,
    .filter-grid select {
      margin-bottom: 0;
    }

    .category-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .summary-item {
      background: #f7f8fa;
      border-radius: 12px;
      padding: 15px;
    }

    .summary-name {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .summary-amount {
      font-size: 20px;
      font-weight: 700;
    }

    .summary-percent {
      color: #888;
      font-size: 13px;
      margin-top: 4px;
    }

    .action-buttons {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .modal-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-title h2 {
      margin: 0;
    }

    .close-btn {
      width: auto;
      margin: 0;
      padding: 5px 10px;
      background: #eee;
      color: #333;
      font-size: 20px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .modal-actions button {
      margin-bottom: 0;
    }

    .user-info {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .over-budget-box {
      background: #ffebee;
      color: #c62828;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      font-weight: 600;
    }

    .over-budget-box.show {
      display: block;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .category-summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filter-grid > div:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .budget-table,
      .transaction-table {
        font-size: 13px;
      }

      .table-wrap {
        overflow-x: auto;
      }
    }

    @media (max-width: 520px) {
      .container {
        width: 94%;
        padding-top: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat {
        padding: 13px;
      }

      .stat-value {
        font-size: 19px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .month-control {
        width: 100%;
      }

      .month-control input {
        flex: 1;
      }

      .logout {
        width: 100%;
      }

      .category-summary {
        grid-template-columns: 1fr 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .filter-grid > div:last-child {
        grid-column: auto;
      }

      .action-buttons {
        flex-direction: column;
        align-items: stretch;
        gap: 5px;
      }

      .edit-btn,
      .danger {
        width: 100%;
        margin: 0;
      }

      th,
      td {
        padding: 9px 6px;
      }
    }
  </style>
</head>

<body>

<!-- ============================================================
     登入頁面
============================================================ -->

<div id="loginPage" class="container">

  <div class="card login-box">

    <h1>💰 每月預算記帳本</h1>

    <div class="subtitle">
      雲端同步版 V1.5
    </div>

    <div id="loginMessage" class="message"></div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="輸入 Email"
    >

    <label>密碼</label>

    <input
      id="password"
      type="password"
      placeholder="輸入密碼"
    >

    <button onclick="login()">
      登入
    </button>

    <button class="secondary" onclick="register()">
      註冊新帳號
    </button>

  </div>

</div>


<!-- ============================================================
     App
============================================================ -->

<div id="appPage" style="display:none;">

  <div class="container">

    <!-- 頂部 -->

    <div class="topbar">

      <div>

        <h1>💰 每月預算記帳本</h1>

        <div class="subtitle">
          雲端同步・隨時記帳
        </div>

        <div
          id="userInfo"
          class="user-info"
        ></div>

      </div>

      <div class="month-control">

        <input
          id="monthPicker"
          type="month"
          onchange="changeMonth()"
        >

        <button
          class="secondary logout"
          onclick="logout()"
        >
          登出
        </button>

      </div>

    </div>


    <div id="appMessage" class="message"></div>


    <!-- 超支提醒 -->

    <div
      id="overBudgetBox"
      class="over-budget-box"
    ></div>


    <!-- ========================================================
         本月統計
    ========================================================= -->

    <div class="card">

      <h2>📊 本月統計</h2>

      <div class="grid">

        <div class="stat">
          <div class="stat-title">
            月收入
          </div>

          <div
            id="statIncome"
            class="stat-value money"
          >
            NT$0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            本月總支出
          </div>

          <div
            id="statExpense"
            class="stat-value money"
          >
            NT$0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            本月剩餘
          </div>

          <div
            id="statRemaining"
            class="stat-value money"
          >
            NT$0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            支出率
          </div>

          <div
            id="statRate"
            class="stat-value"
          >
            0%
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            💳 信用卡支出
          </div>

          <div
            id="statCreditCard"
            class="stat-value money"
          >
            NT$0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            💵 現金支出
          </div>

          <div
            id="statCash"
            class="stat-value money"
          >
            NT$0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            📈 投資
          </div>

          <div
            id="statInvestment"
            class="stat-value money"
          >
            NT$0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            🧾 記帳筆數
          </div>

          <div
            id="statCount"
            class="stat-value"
          >
            0
          </div>
        </div>

      </div>

    </div>


    <!-- ========================================================
         本月預算
    ========================================================= -->

    <div class="card">

      <h2>📋 本月預算</h2>

      <div class="form-grid">

        <div>
          <label>月收入</label>

          <input
            id="budgetIncome"
            type="number"
            min="0"
            step="1"
          >
        </div>


        <div>
          <label>必要生活費</label>

          <input
            id="budgetNecessary"
            type="number"
            min="0"
            step="1"
          >
        </div>


        <div>
          <label>信用卡消費預算</label>

          <input
            id="budgetCreditCard"
            type="number"
            min="0"
            step="1"
          >
        </div>


        <div>
          <label>現金／緊急預備金</label>

          <input
            id="budgetCashReserve"
            type="number"
            min="0"
            step="1"
          >
        </div>


        <div>
          <label>自由支出</label>

          <input
            id="budgetFreeSpending"
            type="number"
            min="0"
            step="1"
          >
        </div>


        <div>
          <label>投資</label>

          <input
            id="budgetInvestment"
            type="number"
            min="0"
            step="1"
          >
        </div>


        <div>
          <label>其他</label>

          <input
            id="budgetOther"
            type="number"
            min="0"
            step="1"
          >
        </div>

      </div>


      <button onclick="saveBudget()">
        💾 儲存本月預算
      </button>

    </div>


    <!-- ========================================================
         預算使用狀況
    ========================================================= -->

    <div class="card">

      <h2>📈 預算使用狀況</h2>

      <div class="table-wrap">

        <table class="budget-table">

          <thead>

            <tr>
              <th>預算項目</th>
              <th>預算</th>
              <th>實際支出</th>
              <th>剩餘</th>
              <th>使用率</th>
            </tr>

          </thead>

          <tbody id="budgetTableBody">
          </tbody>

        </table>

      </div>

    </div>


    <!-- ========================================================
         分類統計
    ========================================================= -->

    <div class="card">

      <h2>📊 分類支出</h2>

      <div
        id="categorySummary"
        class="category-summary"
      ></div>

    </div>


    <!-- ========================================================
         新增記帳
    ========================================================= -->

    <div class="card">

      <h2>➕ 新增記帳</h2>

      <div class="form-grid">

        <div>
          <label>日期</label>

          <input
            id="transactionDate"
            type="date"
          >
        </div>


        <div>
          <label>項目</label>

          <input
            id="transactionItem"
            type="text"
            placeholder="例如：午餐、交通、購物"
          >
        </div>


        <div>

          <label>分類</label>

          <select id="transactionCategory">

            <option value="必要生活費">
              必要生活費
            </option>

            <option value="信用卡">
              信用卡
            </option>

            <option value="現金／預備金">
              現金／預備金
            </option>

            <option value="自由支出">
              自由支出
            </option>

            <option value="投資">
              投資
            </option>

            <option value="其他">
              其他
            </option>

          </select>

        </div>


        <div>

          <label>付款方式</label>

          <select id="transactionPayment">

            <option value="信用卡">
              信用卡
            </option>

            <option value="現金">
              現金
            </option>

            <option value="轉帳">
              轉帳
            </option>

            <option value="其他">
              其他
            </option>

          </select>

        </div>


        <div>

          <label>金額</label>

          <input
            id="transactionAmount"
            type="number"
            min="0"
            step="1"
            placeholder="輸入金額"
          >

        </div>


        <div>

          <label>備註</label>

          <input
            id="transactionNote"
            type="text"
            placeholder="備註（可不填）"
          >

        </div>

      </div>


      <button onclick="addTransaction()">
        ➕ 新增記帳
      </button>

    </div>


    <!-- ========================================================
         搜尋與篩選
    ========================================================= -->

    <div class="card">

      <h2>🔍 搜尋／篩選</h2>

      <div class="filter-grid">

        <div>

          <label>分類</label>

          <select
            id="filterCategory"
            onchange="renderTransactionTable()"
          >

            <option value="">
              全部分類
            </option>

            <option value="必要生活費">
              必要生活費
            </option>

            <option value="信用卡">
              信用卡
            </option>

            <option value="現金／預備金">
              現金／預備金
            </option>

            <option value="自由支出">
              自由支出
            </option>

            <option value="投資">
              投資
            </option>

            <option value="其他">
              其他
            </option>

          </select>

        </div>


        <div>

          <label>付款方式</label>

          <select
            id="filterPayment"
            onchange="renderTransactionTable()"
          >

            <option value="">
              全部付款方式
            </option>

            <option value="信用卡">
              信用卡
            </option>

            <option value="現金">
              現金
            </option>

            <option value="轉帳">
              轉帳
            </option>

            <option value="其他">
              其他
            </option>

          </select>

        </div>


        <div>

          <label>搜尋項目／備註</label>

          <input
            id="filterKeyword"
            type="text"
            placeholder="例如：午餐、全聯、交通..."
            oninput="renderTransactionTable()"
          >

        </div>

      </div>

    </div>


    <!-- ========================================================
         記帳明細
    ========================================================= -->

    <div class="card">

      <h2>🧾 本月記帳明細</h2>

      <div
        id="transactionResultInfo"
        class="user-info"
        style="margin-bottom:12px;"
      ></div>

      <div class="table-wrap">

        <table class="transaction-table">

          <thead>

            <tr>
              <th>日期</th>
              <th>項目</th>
              <th>分類</th>
              <th>付款方式</th>
              <th class="right">金額</th>
              <th>備註</th>
              <th>操作</th>
            </tr>

          </thead>

          <tbody id="transactionTableBody">
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<!-- ============================================================
     編輯記帳 Modal
============================================================ -->

<div
  id="editModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-title">

      <h2>✏️ 編輯記帳</h2>

      <button
        class="close-btn"
        onclick="closeEditModal()"
      >
        ×
      </button>

    </div>


    <input
      id="editId"
      type="hidden"
    >


    <div class="form-grid">

      <div>

        <label>日期</label>

        <input
          id="editDate"
          type="date"
        >

      </div>


      <div>

        <label>項目</label>

        <input
          id="editItem"
          type="text"
          placeholder="例如：午餐、交通"
        >

      </div>


      <div>

        <label>分類</label>

        <select id="editCategory">

          <option value="必要生活費">
            必要生活費
          </option>

          <option value="信用卡">
            信用卡
          </option>

          <option value="現金／預備金">
            現金／預備金
          </option>

          <option value="自由支出">
            自由支出
          </option>

          <option value="投資">
            投資
          </option>

          <option value="其他">
            其他
          </option>

        </select>

      </div>


      <div>

        <label>付款方式</label>

        <select id="editPayment">

          <option value="信用卡">
            信用卡
          </option>

          <option value="現金">
            現金
          </option>

          <option value="轉帳">
            轉帳
          </option>

          <option value="其他">
            其他
          </option>

        </select>

      </div>


      <div>

        <label>金額</label>

        <input
          id="editAmount"
          type="number"
          min="0"
          step="1"
        >

      </div>


      <div>

        <label>備註</label>

        <input
          id="editNote"
          type="text"
          placeholder="備註（可不填）"
        >

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="secondary"
        onclick="closeEditModal()"
      >
        取消
      </button>

      <button onclick="saveEditTransaction()">
        💾 儲存修改
      </button>

    </div>

  </div>

</div>


<script>

/* ============================================================
   Supabase 設定
============================================================ */

const SUPABASE_URL =
  "https://dxzzgcsatudrgjnbtbnl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_m5bOwLJZRbhQls_76MoDrw_jCiF7Sbd";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ============================================================
   全域變數
============================================================ */

let currentUser = null;

let currentMonth = "";

let currentBudget = null;

let currentTransactions = [];


/* ============================================================
   預設預算
============================================================ */

const DEFAULT_BUDGET = {

  income: 36000,

  necessary: 7000,

  credit_card: 15000,

  cash_reserve: 5000,

  free_spending: 10000,

  investment: 0,

  other: 0

};


/* ============================================================
   工具
============================================================ */

function formatMoney(value) {

  return "NT$" +
    Number(value || 0).toLocaleString("zh-TW");

}


function showMessage(
  elementId,
  text,
  type = "success"
) {

  const element =
    document.getElementById(elementId);

  element.textContent = text;

  element.className =
    "message show " + type;

  setTimeout(() => {

    element.className =
      "message";

  }, 3000);

}


function getCurrentMonth() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  return `${year}-${month}`;

}


function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


function getMonthStart(month) {

  return `${month}-01`;

}


/* ============================================================
   修正版：取得下個月
============================================================ */

function getNextMonth(month) {

  const [year, monthNumber] =
    month.split("-").map(Number);

  const date =
    new Date(
      year,
      monthNumber,
      1
    );

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  return `${y}-${m}-01`;

}


/* ============================================================
   初始化
============================================================ */

async function init() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  if (session) {

    currentUser =
      session.user;

    showApp();

  }

}


/* ============================================================
   登入
============================================================ */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "請輸入 Email 和密碼",
      "error"
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .signInWithPassword({

        email,
        password

      });


  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;

  }


  currentUser =
    data.user;

  showApp();

}


/* ============================================================
   註冊
============================================================ */

async function register() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "請輸入 Email 和密碼",
      "error"
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "loginMessage",
      "密碼至少需要 6 個字元",
      "error"
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .signUp({

        email,
        password

      });


  if (error) {

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

    return;

  }


  if (data.session) {

    currentUser =
      data.user;

    showApp();

  } else {

    showMessage(
      "loginMessage",
      "註冊成功！如果系統要求驗證 Email，請先完成 Email 驗證。",
      "success"
    );

  }

}


/* ============================================================
   登出
============================================================ */

async function logout() {

  await supabaseClient
    .auth
    .signOut();

  currentUser = null;

  document
    .getElementById("appPage")
    .style
    .display = "none";

  document
    .getElementById("loginPage")
    .style
    .display = "block";

}


/* ============================================================
   顯示 App
============================================================ */

async function showApp() {

  document
    .getElementById("loginPage")
    .style
    .display = "none";

  document
    .getElementById("appPage")
    .style
    .display = "block";


  currentMonth =
    getCurrentMonth();


  document
    .getElementById("monthPicker")
    .value =
    currentMonth;


  document
    .getElementById("transactionDate")
    .value =
    getToday();


  if (currentUser) {

    document
      .getElementById("userInfo")
      .textContent =
      "目前登入：" +
      currentUser.email;

  }


  await loadMonth();

}


/* ============================================================
   切換月份
============================================================ */

async function changeMonth() {

  currentMonth =
    document
      .getElementById("monthPicker")
      .value;

  if (!currentMonth) {

    return;

  }


  document
    .getElementById("transactionDate")
    .value =
    `${currentMonth}-01`;


  await loadMonth();

}


/* ============================================================
   載入月份
============================================================ */

async function loadMonth() {

  await loadBudget();

  await loadTransactions();

  renderDashboard();

}


/* ============================================================
   載入預算
============================================================ */

async function loadBudget() {

  const monthDate =
    getMonthStart(currentMonth);


  const {
    data,
    error
  } =
    await supabaseClient
      .from("budgets")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "month",
        monthDate
      )
      .maybeSingle();


  if (error) {

    showMessage(
      "appMessage",
      "讀取預算失敗：" +
      error.message,
      "error"
    );

    return;

  }


  if (data) {

    currentBudget =
      data;

  } else {

    const newBudget = {

      user_id:
        currentUser.id,

      month:
        monthDate,

      income:
        DEFAULT_BUDGET.income,

      necessary:
        DEFAULT_BUDGET.necessary,

      credit_card:
        DEFAULT_BUDGET.credit_card,

      cash_reserve:
        DEFAULT_BUDGET.cash_reserve,

      free_spending:
        DEFAULT_BUDGET.free_spending,

      investment:
        DEFAULT_BUDGET.investment,

      other:
        DEFAULT_BUDGET.other

    };


    const {
      data: inserted,
      error:
        insertError
    } =
      await supabaseClient
        .from("budgets")
        .insert(newBudget)
        .select()
        .single();


    if (insertError) {

      showMessage(
        "appMessage",
        "建立預算失敗：" +
        insertError.message,
        "error"
      );

      return;

    }


    currentBudget =
      inserted;

  }


  fillBudgetForm();

}

  document
    .getElementById("budgetFreeSpending")

    currentBudget.free_spending || 0;


  document

/* ============================================================
   儲存預算
============================================================ */

async function saveBudget() {

  if (!currentUser) {

    return;

  }


  const budgetData = {

    user_id:
      currentUser.id,

    month:
      getMonthStart(currentMonth),

    income:
      Number(
        document
          .getElementById("budgetIncome")
          .value
      ) || 0,

    necessary:
      Number(
        document
          .getElementById("budgetNecessary")
          .value
      ) || 0,

    credit_card:
      Number(
        document
          .getElementById("budgetCreditCard")
          .value
      ) || 0,

    cash_reserve:
      Number(
        document
          .getElementById("budgetCashReserve")
          .value
      ) || 0,

    free_spending:
      Number(
        document
          .getElementById("budgetFreeSpending")
          .value
      ) || 0,

    investment:
      Number(
        document
          .getElementById("budgetInvestment")
          .value
      ) || 0,

    other:
      Number(
        document
          .getElementById("budgetOther")
          .value
      ) || 0

  };


  const {
    data,
    error
  } =
    await supabaseClient
      .from("budgets")
      .upsert(

        budgetData,

        {
          onConflict:
            "user_id,month"
        }

      )
      .select()
      .single();


  if (error) {

    showMessage(
      "appMessage",
      "儲存預算失敗：" +
      error.message,
      "error"
    );

    return;

  }


  currentBudget =
    data;


  renderDashboard();


  showMessage(
    "appMessage",
    "本月預算已儲存 ✓",
    "success"
  );

}


/* ============================================================
   載入交易
============================================================ */

async function loadTransactions() {

  const startDate =
    getMonthStart(currentMonth);

  const endDate =
    getNextMonth(currentMonth);


  const {
    data,
    error
  } =
    await supabaseClient
      .from("transactions")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .gte(
        "date",
        startDate
      )
      .lt(
        "date",
        endDate
      )
      .order(
        "date",
        {
          ascending: false
        }
      );


  if (error) {

    showMessage(
      "appMessage",
      "讀取記帳失敗：" +
      error.message,
      "error"
    );

    return;

  }


  currentTransactions =
    data || [];

}


/* ============================================================
   新增交易
============================================================ */

async function addTransaction() {

  const date =
    document
      .getElementById("transactionDate")
      .value;

  const item =
    document
      .getElementById("transactionItem")
      .value
      .trim();

  const category =
    document
      .getElementById("transactionCategory")
      .value;

  const payment =
    document
      .getElementById("transactionPayment")
      .value;

  const amount =
    Number(
      document
        .getElementById("transactionAmount")
        .value
    );

  const note =
    document
      .getElementById("transactionNote")
      .value
      .trim();


  if (!date) {

    showMessage(
      "appMessage",
      "請選擇日期",
      "error"
    );

    return;

  }


  if (!item) {

    showMessage(
      "appMessage",
      "請輸入項目",
      "error"
    );

    return;

  }


  if (!amount || amount <= 0) {

    showMessage(
      "appMessage",
      "請輸入正確金額",
      "error"
    );

    return;

  }


  const transaction = {

    user_id:
      currentUser.id,

    date,

    item,

    category,

    payment_method:
      payment,

    amount,

    note

  };


  const {
    error
  } =
    await supabaseClient
      .from("transactions")
      .insert(transaction);


  if (error) {

    showMessage(
      "appMessage",
      "新增記帳失敗：" +
      error.message,
      "error"
    );

    return;

  }


  document
    .getElementById("transactionItem")
    .value = "";

  document
    .getElementById("transactionAmount")
    .value = "";

  document
    .getElementById("transactionNote")
    .value = "";


  await loadTransactions();

  renderDashboard();


  showMessage(
    "appMessage",
    "記帳成功 ✓",
    "success"
  );

}

/* ============================================================
   刪除交易
============================================================ */

async function deleteTransaction(id) {

  const transaction =
    currentTransactions.find(
      item =>
        item.id === id
    );


  const itemName =
    transaction
      ? transaction.item
      : "這筆記帳";


  const confirmed =
    confirm(
      `確定要刪除「${itemName}」嗎？`
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("transactions")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    showMessage(
      "appMessage",
      "刪除失敗：" +
      error.message,
      "error"
    );

    return;

  }


  await loadTransactions();

  renderDashboard();


  showMessage(
    "appMessage",
    "已刪除記帳 ✓",
    "success"
  );

}


/* ============================================================
   Dashboard
============================================================ */

function renderDashboard() {

  if (!currentBudget) {

    return;

  }


  const transactions =
    currentTransactions;


  const totalExpense =
    transactions.reduce(
      (sum, item) =>
        sum +
        Number(
          item.amount || 0
        ),
      0
    );


  const creditCardExpense =
    transactions
      .filter(
        item =>
          item.payment_method ===
          "信用卡"
      )
      .reduce(
        (sum, item) =>
          sum +
          Number(
            item.amount || 0
          ),
        0
      );


  const cashExpense =
    transactions
      .filter(
        item =>
          item.payment_method ===
          "現金"
      )
      .reduce(
        (sum, item) =>
          sum +
          Number(
            item.amount || 0
          ),
        0
      );


  const investmentExpense =
    transactions
      .filter(
        item =>
          item.category ===
          "投資"
      )
      .reduce(
        (sum, item) =>
          sum +
          Number(
            item.amount || 0
          ),
        0
      );


  const income =
    Number(
      currentBudget.income || 0
    );


  const remaining =
    income -
    totalExpense;


  const rate =
    income > 0
      ? (
          totalExpense /
          income
        ) * 100
      : 0;


  document
    .getElementById("statIncome")
    .textContent =
    formatMoney(income);


  document
    .getElementById("statExpense")
    .textContent =
    formatMoney(totalExpense);


  document
    .getElementById("statRemaining")
    .textContent =
    formatMoney(remaining);


  document
    .getElementById("statRate")
    .textContent =
    rate.toFixed(1) +
    "%";


  document
    .getElementById("statCreditCard")
    .textContent =
    formatMoney(
      creditCardExpense
    );


  document
    .getElementById("statCash")
    .textContent =
    formatMoney(
      cashExpense
    );


  document
    .getElementById("statInvestment")
    .textContent =
    formatMoney(
      investmentExpense
    );


  document
    .getElementById("statCount")
    .textContent =
    transactions.length;


  renderBudgetTable();

  renderCategorySummary();

  renderTransactionTable();

  renderOverBudgetWarning();

}


/* ============================================================
   預算資料
============================================================ */

function getBudgetCategories() {

  return [

    {
      name: "必要生活費",
      budget:
        Number(
          currentBudget.necessary || 0
        )
    },

    {
      name: "信用卡",
      budget:
        Number(
          currentBudget.credit_card || 0
        )
    },

    {
      name: "現金／預備金",
      budget:
        Number(
          currentBudget.cash_reserve || 0
        )
    },

    {
      name: "自由支出",
      budget:
        Number(
          currentBudget.free_spending || 0
        )
    },

    {
      name: "投資",
      budget:
        Number(
          currentBudget.investment || 0
        )
    },

    {
      name: "其他",
      budget:
        Number(
          currentBudget.other || 0
        )
    }

  ];

}


/* ============================================================
   預算表
============================================================ */

function renderBudgetTable() {

  const categories =
    getBudgetCategories();


  const tbody =
    document
      .getElementById(
        "budgetTableBody"
      );


  tbody.innerHTML = "";


  let totalBudget = 0;

  let totalActual = 0;


  categories.forEach(
    category => {

      const actual =
        currentTransactions
          .filter(
            transaction =>
              transaction.category ===
              category.name
          )
          .reduce(
            (sum, transaction) =>
              sum +
              Number(
                transaction.amount || 0
              ),
            0
          );


      const remaining =
        category.budget -
        actual;


      const usage =
        category.budget > 0
          ? (
              actual /
              category.budget
            ) * 100
          : 0;


      totalBudget +=
        category.budget;

      totalActual +=
        actual;


      const tr =
        document.createElement("tr");


      const usageText =
        category.budget > 0
          ? usage.toFixed(1) +
            "%"
          : "—";


      let remainingClass =
        "";

      if (remaining < 0) {

        remainingClass =
          "warning-text";

      } else if (
        category.budget > 0 &&
        usage >= 80
      ) {

        remainingClass =
          "warning-text";

      } else {

        remainingClass =
          "safe-text";

      }


      tr.innerHTML = `

        <td>
          ${category.name}
        </td>

        <td class="money">
          ${formatMoney(
            category.budget
          )}
        </td>

        <td class="money">
          ${formatMoney(
            actual
          )}
        </td>

        <td class="money ${remainingClass}">
          ${formatMoney(
            remaining
          )}
        </td>

        <td style="min-width:180px;">

          <div>
            ${usageText}
          </div>

          <div class="progress">

            <div
              class="progress-bar ${
                usage > 100
                  ? "over"
                  : ""
              }"
              style="
                width:${Math.min(
                  usage,
                  100
                )}%;
              "
            ></div>

          </div>

        </td>

      `;


      tbody.appendChild(tr);

    }
  );


  const totalRemaining =
    totalBudget -
    totalActual;


  const tr =
    document.createElement("tr");


  tr.innerHTML = `

    <td>
      <strong>合計</strong>
    </td>

    <td class="money">
      <strong>
        ${formatMoney(
          totalBudget
        )}
      </strong>
    </td>

    <td class="money">
      <strong>
        ${formatMoney(
          totalActual
        )}
      </strong>
    </td>

    <td
      class="money ${
        totalRemaining < 0
          ? "warning-text"
          : "safe-text"
      }"
    >
      <strong>
        ${formatMoney(
          totalRemaining
        )}
      </strong>
    </td>

    <td></td>

  `;


  tbody.appendChild(tr);

}


/* ============================================================
   分類統計
============================================================ */

function renderCategorySummary() {

  const container =
    document
      .getElementById(
        "categorySummary"
      );


  container.innerHTML = "";


  const categories =
    getBudgetCategories();


  categories.forEach(
    category => {

      const actual =
        currentTransactions
          .filter(
            transaction =>
              transaction.category ===
              category.name
          )
          .reduce(
            (sum, transaction) =>
              sum +
              Number(
                transaction.amount || 0
              ),
            0
          );


      const percentage =
        currentTransactions.length > 0
          ? 0
          : 0;


      const budgetPercentage =
        category.budget > 0
          ? (
              actual /
              category.budget
            ) * 100
          : 0;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "summary-item";


      div.innerHTML = `

        <div class="summary-name">
          ${category.name}
        </div>

        <div class="summary-amount">
          ${formatMoney(actual)}
        </div>

        <div class="summary-percent">
          預算使用 ${budgetPercentage.toFixed(1)}%
        </div>

      `;


      container.appendChild(div);

    }
  );

}


/* ============================================================
   超支提醒
============================================================ */

function renderOverBudgetWarning() {

  const box =
    document
      .getElementById(
        "overBudgetBox"
      );


  const categories =
    getBudgetCategories();


  const overCategories =
    [];


  categories.forEach(
    category => {

      if (
        category.budget <= 0
      ) {

        return;

      }


      const actual =
        currentTransactions
          .filter(
            transaction =>
              transaction.category ===
              category.name
          )
          .reduce(
            (sum, transaction) =>
              sum +
              Number(
                transaction.amount || 0
              ),
            0
          );


      if (
        actual >
        category.budget
      ) {

        overCategories.push(
          `${category.name} 超支 ${formatMoney(
            actual -
            category.budget
          )}`
        );

      }

    }
  );


  if (
    overCategories.length > 0
  ) {

    box.innerHTML =
      "⚠️ 預算提醒： " +
      overCategories.join("、");

    box.classList.add("show");

  } else {

    box.classList.remove("show");

    box.textContent = "";

  }

}


/* ============================================================
   取得篩選後的交易
============================================================ */

function getFilteredTransactions() {

  const category =
    document
      .getElementById(
        "filterCategory"
      )
      .value;


  const payment =
    document
      .getElementById(
        "filterPayment"
      )
      .value;


  const keyword =
    document
      .getElementById(
        "filterKeyword"
      )
      .value
      .trim()
      .toLowerCase();


  return currentTransactions.filter(
    transaction => {

      if (
        category &&
        transaction.category !==
        category
      ) {

        return false;

      }


      if (
        payment &&
        transaction.payment_method !==
        payment
      ) {

        return false;

      }


      if (keyword) {

        const searchText =
          (
            transaction.item +
            " " +
            (
              transaction.note ||
              ""
            )
          )
          .toLowerCase();


        if (
          !searchText.includes(
            keyword
          )
        ) {

          return false;

        }

      }


      return true;

    }
  );

}


/* ============================================================
   記帳明細
============================================================ */

function renderTransactionTable() {

  const tbody =
    document
      .getElementById(
        "transactionTableBody"
      );


  tbody.innerHTML = "";


  const filteredTransactions =
    getFilteredTransactions();


  document
    .getElementById(
      "transactionResultInfo"
    )
    .textContent =
    `顯示 ${filteredTransactions.length} 筆，共 ${currentTransactions.length} 筆`;


  if (
    filteredTransactions.length ===
    0
  ) {

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td
        colspan="7"
        class="empty"
      >
        ${
          currentTransactions.length ===
          0
            ? "本月還沒有記帳資料"
            : "沒有符合篩選條件的記帳"
        }
      </td>

    `;


    tbody.appendChild(tr);

    return;

  }


  filteredTransactions.forEach(
    transaction => {

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>
          ${escapeHtml(
            transaction.date
          )}
        </td>

        <td>
          ${escapeHtml(
            transaction.item
          )}
        </td>

        <td>
          ${escapeHtml(
            transaction.category
          )}
        </td>

        <td>
          ${escapeHtml(
            transaction.payment_method
          )}
        </td>

        <td class="right money">
          ${formatMoney(
            transaction.amount
          )}
        </td>

        <td>
          ${escapeHtml(
            transaction.note || ""
          )}
        </td>

        <td>

          <div class="action-buttons">

            <button
              class="edit-btn"
              onclick="openEditModal('${transaction.id}')"
            >
              ✏️ 修改
            </button>

            <button
              class="danger"
              onclick="deleteTransaction('${transaction.id}')"
            >
              🗑️ 刪除
            </button>

          </div>

        </td>

      `;


      tbody.appendChild(tr);

    }
  );

}


/* ============================================================
   防止 HTML 注入
============================================================ */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* ============================================================
   點擊 Modal 外部關閉
============================================================ */

document
  .getElementById("editModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeEditModal();

      }

    }
  );


/* ============================================================
   ESC 關閉 Modal
============================================================ */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeEditModal();

    }

  }
);


/* ============================================================
   Supabase 登入狀態監聽
============================================================ */

supabaseClient
  .auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;


        if (
          document
            .getElementById(
              "appPage"
            )
            .style
            .display !== "block"
        ) {

          showApp();

        }

      } else {

        currentUser = null;

      }

    }
  );


/* ============================================================
   啟動
============================================================ */

init();
