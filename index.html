<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f7f7f8" />
  <title>每月預算記帳本</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ---------- Header ---------- */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #777;
      font-size: 14px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-email {
      font-size: 13px;
      color: #666;
    }

    /* ---------- Buttons ---------- */

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 600;
      transition: 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #222;
      color: white;
    }

    .btn-secondary {
      background: #e9eaed;
      color: #333;
    }

    .btn-danger {
      background: #ffe8e8;
      color: #c62828;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 13px;
    }

    /* ---------- Cards ---------- */

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.03),
        0 4px 18px rgba(0, 0, 0, 0.04);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
    }

    /* ---------- Login ---------- */

    .auth-wrap {
      max-width: 430px;
      margin: 8vh auto;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title h1 {
      margin: 0;
      font-size: 30px;
    }

    .auth-title p {
      color: #777;
      margin-top: 8px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #dcdfe4;
      background: #fff;
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      color: #222;
    }

    input:focus,
    select:focus {
      border-color: #777;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .auth-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    /* ---------- Month ---------- */

    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-control input {
      width: 160px;
      font-weight: 600;
    }

    /* ---------- Stats ---------- */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .stat {
      padding: 17px;
      border-radius: 14px;
      background: #f7f7f8;
    }

    .stat-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    /* ---------- Budget ---------- */

    .budget-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .budget-item {
      border: 1px solid #e5e6e9;
      border-radius: 14px;
      padding: 15px;
      min-width: 0;
      background: #fff;
    }

    .budget-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .budget-name {
      font-weight: 700;
      font-size: 15px;
    }

    .budget-input {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .budget-input span {
      color: #777;
      font-size: 14px;
      flex-shrink: 0;
    }

    .budget-input input {
      min-width: 0;
      text-align: right;
      font-weight: 650;
      font-size: 16px;
    }

    .progress {
      height: 8px;
      background: #eceef1;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #333;
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .budget-info {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }

    .over-budget {
      color: #c62828;
      font-weight: 700;
    }

    .budget-save {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }

    /* ---------- Transaction form ---------- */

    .transaction-form {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .transaction-form .field {
      margin: 0;
    }

    /* ---------- Search ---------- */

    .filter-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    /* ---------- Transaction list ---------- */

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaction {
      display: grid;
      grid-template-columns: 100px 1fr 110px 100px 90px;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border: 1px solid #e7e8eb;
      border-radius: 12px;
      background: #fff;
    }

    .transaction-date {
      color: #777;
      font-size: 13px;
    }

    .transaction-main {
      min-width: 0;
    }

    .transaction-item {
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transaction-note {
      color: #888;
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transaction-category,
    .transaction-payment {
      font-size: 13px;
      color: #666;
    }

    .transaction-amount {
      text-align: right;
      font-weight: 750;
    }

    .transaction-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
    }

    /* ---------- Empty ---------- */

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: #888;
    }

    /* ---------- Modal ---------- */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
    }

    .modal h3 {
      margin: 0 0 18px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    /* ---------- Loading ---------- */

    .loading {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.65);
      z-index: 2000;
      backdrop-filter: blur(2px);
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      background: white;
      padding: 18px 22px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      font-weight: 650;
    }

    /* ---------- Toast ---------- */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: #222;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      z-index: 3000;
      transition: 0.2s;
      max-width: calc(100vw - 30px);
      text-align: center;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hidden {
      display: none !important;
    }

    /* ---------- Mobile ---------- */

    @media (max-width: 800px) {
      .app {
        padding: 14px;
      }

      .header {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 23px;
      }

      .user-area {
        flex-direction: column;
        align-items: flex-end;
      }

      .user-email {
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      /*
        V2.2 重點修正：
        預算改為手機單欄排列。
        不讓第 5、6 個項目被裁切。
      */
      .budget-grid {
        grid-template-columns: 1fr;
      }

      .budget-item {
        width: 100%;
      }

      .transaction-form {
        grid-template-columns: 1fr 1fr;
      }

      .transaction-form .full-mobile {
        grid-column: 1 / -1;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .transaction {
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
      }

      .transaction-date {
        grid-column: 1;
      }

      .transaction-amount {
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      .transaction-main {
        grid-column: 1 / -1;
      }

      .transaction-category,
      .transaction-payment {
        grid-column: 1;
      }

      .transaction-actions {
        grid-column: 2;
        grid-row: 4;
      }

      .month-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .month-control {
        width: 100%;
      }

      .month-control input {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 15px;
        border-radius: 14px;
      }

      .stats-grid {
        gap: 9px;
      }

      .stat {
        padding: 13px;
      }

      .stat-value {
        font-size: 20px;
      }

      .budget-item {
        padding: 14px;
      }

      .budget-input input {
        font-size: 17px;
        min-height: 44px;
      }

      .transaction-form {
        grid-template-columns: 1fr;
      }

      .transaction-form .full-mobile {
        grid-column: auto;
      }

      .auth-actions {
        grid-template-columns: 1fr;
      }

      .header {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- ==================== 登入 ==================== -->

  <div id="authScreen" class="auth-wrap">
    <div class="auth-title">
      <h1>💰 每月預算記帳本</h1>
      <p>雲端同步版 V2.2</p>
    </div>

    <div class="card">
      <div class="field">
        <label>Email</label>
        <input
          id="authEmail"
          type="email"
          placeholder="輸入 Email"
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label>密碼</label>
        <input
          id="authPassword"
          type="password"
          placeholder="輸入密碼"
          autocomplete="current-password"
        />
      </div>

      <div class="auth-actions">
        <button class="btn btn-primary" onclick="login()">
          登入
        </button>

        <button class="btn btn-secondary" onclick="register()">
          註冊
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 主畫面 ==================== -->

  <div id="appScreen" class="hidden">

    <div class="app">

      <header class="header">
        <div class="brand">
          <h1>💰 每月預算記帳本</h1>
          <p>雲端同步版 V2.2</p>
        </div>

        <div class="user-area">
          <span id="userEmail" class="user-email"></span>
          <button class="btn btn-secondary btn-small" onclick="logout()">
            登出
          </button>
        </div>
      </header>

      <!-- 月份 -->

      <div class="month-bar">
        <div>
          <strong>目前月份</strong>
        </div>

        <div class="month-control">
          <button
            class="btn btn-secondary btn-small"
            onclick="previousMonth()"
          >
            ‹
          </button>

          <input
            id="monthInput"
            type="month"
            onchange="changeMonth()"
          />

          <button
            class="btn btn-secondary btn-small"
            onclick="nextMonth()"
          >
            ›
          </button>
        </div>
      </div>

      <!-- ==================== 統計 ==================== -->

      <section class="card">
        <div class="section-title">
          <h2>📊 本月概況</h2>
        </div>

        <div class="stats-grid">

          <div class="stat">
            <div class="stat-label">本月收入</div>
            <div id="statIncome" class="stat-value">$0</div>
          </div>

          <div class="stat">
            <div class="stat-label">本月總支出</div>
            <div id="statExpense" class="stat-value">$0</div>
          </div>

          <div class="stat">
            <div class="stat-label">信用卡支出</div>
            <div id="statCard" class="stat-value">$0</div>
          </div>

          <div class="stat">
            <div class="stat-label">本月剩餘</div>
            <div id="statRemaining" class="stat-value">$0</div>
          </div>

        </div>
      </section>

      <!-- ==================== 預算 ==================== -->

      <section class="card">

        <div class="section-title">
          <h2>📝 調整本月預算</h2>
        </div>

        <div class="budget-grid">

          <!-- 收入 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">💵 月收入</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetIncome"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>
          </div>

          <!-- 必要生活費 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">🏠 必要生活費</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetNecessary"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>

            <div class="progress">
              <div id="progressNecessary" class="progress-bar"></div>
            </div>

            <div class="budget-info">
              <span id="actualNecessary">$0</span>
              <span id="percentNecessary">0%</span>
            </div>
          </div>

          <!-- 信用卡 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">💳 信用卡</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetCreditCard"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>

            <div class="progress">
              <div id="progressCreditCard" class="progress-bar"></div>
            </div>

            <div class="budget-info">
              <span id="actualCreditCard">$0</span>
              <span id="percentCreditCard">0%</span>
            </div>
          </div>

          <!-- 現金／預備金 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">💰 現金／預備金</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetCashReserve"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>

            <div class="progress">
              <div id="progressCashReserve" class="progress-bar"></div>
            </div>

            <div class="budget-info">
              <span id="actualCashReserve">$0</span>
              <span id="percentCashReserve">0%</span>
            </div>
          </div>

          <!-- 自由支出 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">🎮 自由支出</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetFreeSpending"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>

            <div class="progress">
              <div id="progressFreeSpending" class="progress-bar"></div>
            </div>

            <div class="budget-info">
              <span id="actualFreeSpending">$0</span>
              <span id="percentFreeSpending">0%</span>
            </div>
          </div>

          <!-- 投資 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">📈 投資</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetInvestment"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>

            <div class="progress">
              <div id="progressInvestment" class="progress-bar"></div>
            </div>

            <div class="budget-info">
              <span id="actualInvestment">$0</span>
              <span id="percentInvestment">0%</span>
            </div>
          </div>

          <!-- 其他 -->

          <div class="budget-item">
            <div class="budget-item-header">
              <div class="budget-name">📦 其他</div>
            </div>

            <div class="budget-input">
              <span>$</span>
              <input
                id="budgetOther"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="0"
              />
            </div>

            <div class="progress">
              <div id="progressOther" class="progress-bar"></div>
            </div>

            <div class="budget-info">
              <span id="actualOther">$0</span>
              <span id="percentOther">0%</span>
            </div>
          </div>

        </div>

        <div class="budget-save">
          <button class="btn btn-primary" onclick="saveBudget()">
            💾 儲存本月預算
          </button>
        </div>

      </section>

      <!-- ==================== 新增記帳 ==================== -->

      <section class="card">

        <div class="section-title">
          <h2>➕ 新增記帳</h2>
        </div>

        <div class="transaction-form">

          <div class="field">
            <label>日期</label>
            <input id="txDate" type="date" />
          </div>

          <div class="field">
            <label>項目</label>
            <input
              id="txItem"
              type="text"
              placeholder="例如：午餐"
            />
          </div>

          <div class="field">
            <label>分類</label>
            <select id="txCategory">
              <option value="necessary">必要生活費</option>
              <option value="credit_card">信用卡</option>
              <option value="cash_reserve">現金／預備金</option>
              <option value="free_spending">自由支出</option>
              <option value="investment">投資</option>
              <option value="other">其他</option>
            </select>
          </div>

          <div class="field">
            <label>付款方式</label>
            <select id="txPayment">
              <option value="信用卡">信用卡</option>
              <option value="現金">現金</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="field">
            <label>金額</label>
            <input
              id="txAmount"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              placeholder="$"
            />
          </div>

          <button
            class="btn btn-primary"
            onclick="addTransaction()"
          >
            新增
          </button>

        </div>

      </section>

      <!-- ==================== 搜尋 ==================== -->

      <section class="card">

        <div class="section-title">
          <h2>🔎 本月記帳</h2>
        </div>

        <div class="filter-grid">

          <input
            id="searchInput"
            type="search"
            placeholder="搜尋項目／備註"
            oninput="renderTransactions()"
          />

          <select
            id="filterCategory"
            onchange="renderTransactions()"
          >
            <option value="">全部分類</option>
            <option value="necessary">必要生活費</option>
            <option value="credit_card">信用卡</option>
            <option value="cash_reserve">現金／預備金</option>
            <option value="free_spending">自由支出</option>
            <option value="investment">投資</option>
            <option value="other">其他</option>
          </select>

          <select
            id="filterPayment"
            onchange="renderTransactions()"
          >
            <option value="">全部付款方式</option>
            <option value="信用卡">信用卡</option>
            <option value="現金">現金</option>
            <option value="其他">其他</option>
          </select>

        </div>

        <div id="transactionList" class="transaction-list"></div>

      </section>

    </div>
  </div>

  <!-- ==================== 編輯 Modal ==================== -->

  <div id="editModal" class="modal-backdrop">

    <div class="modal">

      <h3>✏️ 編輯記帳</h3>

      <input id="editId" type="hidden" />

      <div class="field">
        <label>日期</label>
        <input id="editDate" type="date" />
      </div>

      <div class="field">
        <label>項目</label>
        <input id="editItem" type="text" />
      </div>

      <div class="field">
        <label>分類</label>
        <select id="editCategory">
          <option value="necessary">必要生活費</option>
          <option value="credit_card">信用卡</option>
          <option value="cash_reserve">現金／預備金</option>
          <option value="free_spending">自由支出</option>
          <option value="investment">投資</option>
          <option value="other">其他</option>
        </select>
      </div>

      <div class="field">
        <label>付款方式</label>
        <select id="editPayment">
          <option value="信用卡">信用卡</option>
          <option value="現金">現金</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="field">
        <label>金額</label>
        <input
          id="editAmount"
          type="number"
          min="0"
          step="1"
          inputmode="numeric"
        />
      </div>

      <div class="field">
        <label>備註</label>
        <input
          id="editNote"
          type="text"
          placeholder="可留空"
        />
      </div>

      <div class="modal-actions">
        <button
          class="btn btn-secondary"
          onclick="closeEditModal()"
        >
          取消
        </button>

        <button
          class="btn btn-primary"
          onclick="saveEditTransaction()"
        >
          儲存
        </button>
      </div>

    </div>
  </div>

  <!-- Loading -->

  <div id="loading" class="loading">
    <div class="loading-box">
      處理中…
    </div>
  </div>

  <!-- Toast -->

  <div id="toast" class="toast"></div>


  <script>
    /* ============================================================
       Supabase 設定
       ============================================================ */

    const SUPABASE_URL =
      "https://dxzzgcsatudrgjnbtbnl.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_m5bOwLJZRbhQls_76MoDrw_jCiF7Sbd";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ============================================================
       全域變數
       ============================================================ */

    let currentUser = null;
    let currentMonth = getSafeCurrentMonth();
    let transactions = [];
    let currentBudget = null;


    /* ============================================================
       預設預算
       ============================================================ */

    const DEFAULT_BUDGET = {
      income: 36000,
      necessary: 7000,
      credit_card: 15000,
      cash_reserve: 5000,
      free_spending: 10000,
      investment: 0,
      other: 0
    };


    /* ============================================================
       工具
       ============================================================ */

    function money(value) {
      return "$" + Number(value || 0).toLocaleString("zh-TW");
    }


    function getSafeCurrentMonth() {
      const now = new Date();

      const year = now.getFullYear();

      const month =
        String(now.getMonth() + 1).padStart(2, "0");

      return `${year}-${month}`;
    }


    function normalizeMonth(month) {

      if (
        typeof month === "string" &&
        /^\d{4}-\d{2}$/.test(month)
      ) {
        return month;
      }

      return getSafeCurrentMonth();
    }


    function getTodayString() {

      const now = new Date();

      const y = now.getFullYear();

      const m =
        String(now.getMonth() + 1).padStart(2, "0");

      const d =
        String(now.getDate()).padStart(2, "0");

      return `${y}-${m}-${d}`;
    }


    function getNextMonth(month) {

      month = normalizeMonth(month);

      const [year, monthNumber] =
        month.split("-").map(Number);

      const date =
        new Date(year, monthNumber, 1);

      const y =
        date.getFullYear();

      const m =
        String(date.getMonth() + 1).padStart(2, "0");

      return `${y}-${m}-01`;
    }


    function setMonthInput() {

      const input =
        document.getElementById("monthInput");

      if (input) {
        input.value =
          normalizeMonth(currentMonth);
      }
    }


    function showLoading(show = true) {

      const el =
        document.getElementById("loading");

      if (!el) return;

      el.classList.toggle("show", show);
    }


    function toast(message) {

      const el =
        document.getElementById("toast");

      if (!el) return;

      el.textContent = message;

      el.classList.add("show");

      clearTimeout(window.__toastTimer);

      window.__toastTimer =
        setTimeout(() => {
          el.classList.remove("show");
        }, 2600);
    }


    /* ============================================================
       Auth
       ============================================================ */

    async function login() {

      const email =
        document.getElementById("authEmail").value.trim();

      const password =
        document.getElementById("authPassword").value;

      if (!email || !password) {
        toast("請輸入 Email 和密碼");
        return;
      }

      showLoading(true);

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      showLoading(false);

      if (error) {
        console.error(error);
        toast("登入失敗：" + error.message);
        return;
      }

      currentUser = data.user;

      await startApp();
    }


    async function register() {

      const email =
        document.getElementById("authEmail").value.trim();

      const password =
        document.getElementById("authPassword").value;

      if (!email || !password) {
        toast("請輸入 Email 和密碼");
        return;
      }

      if (password.length < 6) {
        toast("密碼至少需要 6 個字元");
        return;
      }

      showLoading(true);

      const { data, error } =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      showLoading(false);

      if (error) {
        console.error(error);
        toast("註冊失敗：" + error.message);
        return;
      }

      if (data.session) {

        currentUser = data.user;

        await startApp();

      } else {

        toast(
          "註冊成功！如果有收到驗證信，請先完成 Email 驗證。"
        );
      }
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      currentUser = null;

      transactions = [];

      currentBudget = null;

      document
        .getElementById("appScreen")
        .classList.add("hidden");

      document
        .getElementById("authScreen")
        .classList.remove("hidden");
    }


    /* ============================================================
       App 啟動
       ============================================================ */

    async function startApp() {

      if (!currentUser) return;

      document
        .getElementById("authScreen")
        .classList.add("hidden");

      document
        .getElementById("appScreen")
        .classList.remove("hidden");

      document.getElementById("userEmail").textContent =
        currentUser.email || "";

      currentMonth =
        getSafeCurrentMonth();

      setMonthInput();

      document.getElementById("txDate").value =
        getTodayString();

      await loadMonthData();
    }


    /* ============================================================
       月份切換
       ============================================================ */

    function changeMonth() {

      const input =
        document.getElementById("monthInput");

      let value =
        input?.value || "";

      value =
        normalizeMonth(value);

      currentMonth =
        value;

      setMonthInput();

      loadMonthData();
    }


    function previousMonth() {

      const [year, month] =
        normalizeMonth(currentMonth)
          .split("-")
          .map(Number);

      const date =
        new Date(year, month - 2, 1);

      currentMonth =
        `${date.getFullYear()}-${String(
          date.getMonth() + 1
        ).padStart(2, "0")}`;

      setMonthInput();

      loadMonthData();
    }


    function nextMonth() {

      const [year, month] =
        normalizeMonth(currentMonth)
          .split("-")
          .map(Number);

      const date =
        new Date(year, month, 1);

      currentMonth =
        `${date.getFullYear()}-${String(
          date.getMonth() + 1
        ).padStart(2, "0")}`;

      setMonthInput();

      loadMonthData();
    }


    /* ============================================================
       載入月份資料
       ============================================================ */

    async function loadMonthData() {

      if (!currentUser) return;

      showLoading(true);

      try {

        await loadBudget(currentMonth);

        await loadTransactions(currentMonth);

        renderAll();

      } catch (error) {

        console.error(error);

        toast(
          "讀取資料失敗：" +
          (error.message || error)
        );

      } finally {

        showLoading(false);
      }
    }


    /* ============================================================
       Budget
       ============================================================ */

    async function loadBudget(month) {

      month =
        normalizeMonth(month);

      const monthDate =
        `${month}-01`;

      const { data, error } =
        await supabaseClient
          .from("budgets")
          .select("*")
          .eq("user_id", currentUser.id)
          .eq("month", monthDate)
          .maybeSingle();

      if (error) {

        console.error(
          "Supabase loadBudget error:",
          error
        );

        toast(
          "讀取預算失敗：" +
          error.message
        );

        currentBudget = {
          ...DEFAULT_BUDGET
        };

        fillBudgetInputs();

        return;
      }

      if (data) {

        currentBudget = {
          income: Number(data.income || 0),
          necessary: Number(data.necessary || 0),
          credit_card: Number(data.credit_card || 0),
          cash_reserve: Number(data.cash_reserve || 0),
          free_spending: Number(data.free_spending || 0),
          investment: Number(data.investment || 0),
          other: Number(data.other || 0)
        };

      } else {

        currentBudget = {
          ...DEFAULT_BUDGET
        };
      }

      fillBudgetInputs();
    }


    function fillBudgetInputs() {

      if (!currentBudget) return;

      document.getElementById("budgetIncome").value =
        currentBudget.income;

      document.getElementById("budgetNecessary").value =
        currentBudget.necessary;

      document.getElementById("budgetCreditCard").value =
        currentBudget.credit_card;

      document.getElementById("budgetCashReserve").value =
        currentBudget.cash_reserve;

      document.getElementById("budgetFreeSpending").value =
        currentBudget.free_spending;

      document.getElementById("budgetInvestment").value =
        currentBudget.investment;

      /*
        V2.2 修正：
        明確載入 other 欄位。
        手機版也可以正常輸入。
      */
      document.getElementById("budgetOther").value =
        currentBudget.other;
    }


    async function saveBudget() {

      if (!currentUser) return;

      const budget = {

        income:
          Number(
            document.getElementById("budgetIncome").value
          ) || 0,

        necessary:
          Number(
            document.getElementById("budgetNecessary").value
          ) || 0,

        credit_card:
          Number(
            document.getElementById("budgetCreditCard").value
          ) || 0,

        cash_reserve:
          Number(
            document.getElementById("budgetCashReserve").value
          ) || 0,

        free_spending:
          Number(
            document.getElementById("budgetFreeSpending").value
          ) || 0,

        investment:
          Number(
            document.getElementById("budgetInvestment").value
          ) || 0,

        other:
          Number(
            document.getElementById("budgetOther").value
          ) || 0
      };


      const payload = {

        user_id: currentUser.id,

        month: `${currentMonth}-01`,

        income: budget.income,

        necessary: budget.necessary,

        credit_card: budget.credit_card,

        cash_reserve: budget.cash_reserve,

        free_spending: budget.free_spending,

        investment: budget.investment,

        other: budget.other
      };


      showLoading(true);

      const { data, error } =
        await supabaseClient
          .from("budgets")
          .upsert(
            payload,
            {
              onConflict:
                "user_id,month"
            }
          )
          .select()
          .single();

      showLoading(false);

      if (error) {

        console.error(error);

        toast(
          "儲存預算失敗：" +
          error.message
        );

        return;
      }

      currentBudget = budget;

      renderAll();

      toast("本月預算已儲存 ☁️");
    }


    /* ============================================================
       Transactions
       ============================================================ */

    async function loadTransactions(month) {

      if (!currentUser) {

        transactions = [];

        return;
      }

      month =
        normalizeMonth(month);

      const start =
        `${month}-01`;

      const end =
        getNextMonth(month);


      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(start) ||
        !/^\d{4}-\d{2}-\d{2}$/.test(end)
      ) {

        console.error(
          "Invalid date range:",
          {
            month,
            start,
            end
          }
        );

        toast(
          "月份格式錯誤，已自動修正。"
        );

        month =
          getSafeCurrentMonth();

        currentMonth =
          month;

        setMonthInput();

        await loadTransactions(month);

        return;
      }


      const { data, error } =
        await supabaseClient
          .from("transactions")
          .select("*")
          .eq("user_id", currentUser.id)
          .gte("date", start)
          .lt("date", end)
          .order("date", {
            ascending: false
          })
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "Supabase loadTransactions error:",
          error
        );

        toast(
          "讀取記帳失敗：" +
          error.message
        );

        transactions = [];

        return;
      }

      transactions =
        data || [];
    }


    async function addTransaction() {

      if (!currentUser) return;

      const date =
        document.getElementById("txDate").value;

      const item =
        document.getElementById("txItem").value.trim();

      const category =
        document.getElementById("txCategory").value;

      const payment =
        document.getElementById("txPayment").value;

      const amount =
        Number(
          document.getElementById("txAmount").value
        ) || 0;


      if (!date) {

        toast("請選擇日期");

        return;
      }

      if (!item) {

        toast("請輸入項目");

        return;
      }

      if (amount <= 0) {

        toast("請輸入正確金額");

        return;
      }


      const payload = {

        user_id:
          currentUser.id,

        date,

        item,

        category,

        payment_method:
          payment,

        amount,

        note: ""
      };


      showLoading(true);

      const { error } =
        await supabaseClient
          .from("transactions")
          .insert(payload);

      showLoading(false);


      if (error) {

        console.error(error);

        toast(
          "新增記帳失敗：" +
          error.message
        );

        return;
      }


      document.getElementById("txItem").value =
        "";

      document.getElementById("txAmount").value =
        "";


      await loadTransactions(currentMonth);

      renderAll();

      toast("記帳成功！");
    }


    /* ============================================================
       Edit
       ============================================================ */

    function openEditModal(id) {

      const tx =
        transactions.find(
          item => item.id === id
        );

      if (!tx) return;


      document.getElementById("editId").value =
        tx.id;

      document.getElementById("editDate").value =
        tx.date;

      document.getElementById("editItem").value =
        tx.item;

      document.getElementById("editCategory").value =
        tx.category;

      document.getElementById("editPayment").value =
        tx.payment_method;

      document.getElementById("editAmount").value =
        tx.amount;

      document.getElementById("editNote").value =
        tx.note || "";


      document
        .getElementById("editModal")
        .classList.add("show");
    }


    function closeEditModal() {

      document
        .getElementById("editModal")
        .classList.remove("show");
    }


    async function saveEditTransaction() {

      const id =
        document.getElementById("editId").value;

      const date =
        document.getElementById("editDate").value;

      const item =
        document.getElementById("editItem").value.trim();

      const category =
        document.getElementById("editCategory").value;

      const payment =
        document.getElementById("editPayment").value;

      const amount =
        Number(
          document.getElementById("editAmount").value
        ) || 0;

      const note =
        document.getElementById("editNote").value.trim();


      if (!date || !item || amount <= 0) {

        toast("請確認資料是否完整");

        return;
      }


      showLoading(true);

      const { error } =
        await supabaseClient
          .from("transactions")
          .update({
            date,
            item,
            category,
            payment_method:
              payment,
            amount,
            note
          })
          .eq("id", id)
          .eq("user_id", currentUser.id);

      showLoading(false);


      if (error) {

        console.error(error);

        toast(
          "修改失敗：" +
          error.message
        );

        return;
      }


      closeEditModal();

      await loadTransactions(currentMonth);

      renderAll();

      toast("修改成功！");
    }


    async function deleteTransaction(id) {

      const ok =
        confirm("確定要刪除這筆記帳嗎？");

      if (!ok) return;


      showLoading(true);

      const { error } =
        await supabaseClient
          .from("transactions")
          .delete()
          .eq("id", id)
          .eq("user_id", currentUser.id);

      showLoading(false);


      if (error) {

        console.error(error);

        toast(
          "刪除失敗：" +
          error.message
        );

        return;
      }


      await loadTransactions(currentMonth);

      renderAll();

      toast("已刪除");
    }


    /* ============================================================
       Render
       ============================================================ */

    function renderAll() {

      renderStats();

      renderBudgetUsage();

      renderTransactions();
    }


    function renderStats() {

      const income =
        Number(
          currentBudget?.income || 0
        );

      const expense =
        transactions.reduce(
          (sum, tx) =>
            sum + Number(tx.amount || 0),
          0
        );

      const cardExpense =
        transactions
          .filter(
            tx =>
              tx.payment_method ===
              "信用卡"
          )
          .reduce(
            (sum, tx) =>
              sum + Number(tx.amount || 0),
            0
          );

      const remaining =
        income - expense;


      document.getElementById(
        "statIncome"
      ).textContent =
        money(income);

      document.getElementById(
        "statExpense"
      ).textContent =
        money(expense);

      document.getElementById(
        "statCard"
      ).textContent =
        money(cardExpense);

      document.getElementById(
        "statRemaining"
      ).textContent =
        money(remaining);
    }


    function getCategoryActual(category) {

      return transactions
        .filter(
          tx =>
            tx.category ===
            category
        )
        .reduce(
          (sum, tx) =>
            sum + Number(tx.amount || 0),
          0
        );
    }


    function updateBudgetProgress(
      category,
      actual,
      budget
    ) {

      const progress =
        document.getElementById(
          "progress" +
          category
            .split("_")
            .map(
              word =>
                word.charAt(0).toUpperCase() +
                word.slice(1)
            )
            .join("")
        );

      const actualEl =
        document.getElementById(
          "actual" +
          category
            .split("_")
            .map(
              word =>
                word.charAt(0).toUpperCase() +
                word.slice(1)
            )
            .join("")
        );

      const percentEl =
        document.getElementById(
          "percent" +
          category
            .split("_")
            .map(
              word =>
                word.charAt(0).toUpperCase() +
                word.slice(1)
            )
            .join("")
        );


      if (!progress) return;


      actualEl.textContent =
        money(actual);


      if (budget <= 0) {

        progress.style.width =
          "0%";

        percentEl.textContent =
          "—";

        return;
      }


      const percent =
        Math.round(
          (actual / budget) * 100
        );

      const width =
        Math.min(percent, 100);


      progress.style.width =
        width + "%";

      percentEl.textContent =
        percent + "%";


      if (percent >= 100) {

        percentEl.classList.add(
          "over-budget"
        );

      } else {

        percentEl.classList.remove(
          "over-budget"
        );
      }
    }


    function renderBudgetUsage() {

      if (!currentBudget) return;


      updateBudgetProgress(
        "Necessary",
        getCategoryActual("necessary"),
        Number(
          currentBudget.necessary || 0
        )
      );


      updateBudgetProgress(
        "CreditCard",
        getCategoryActual("credit_card"),
        Number(
          currentBudget.credit_card || 0
        )
      );


      updateBudgetProgress(
        "CashReserve",
        getCategoryActual("cash_reserve"),
        Number(
          currentBudget.cash_reserve || 0
        )
      );


      updateBudgetProgress(
        "FreeSpending",
        getCategoryActual("free_spending"),
        Number(
          currentBudget.free_spending || 0
        )
      );


      updateBudgetProgress(
        "Investment",
        getCategoryActual("investment"),
        Number(
          currentBudget.investment || 0
        )
      );


      /*
        V2.2：
        other 也完整納入預算使用率。
      */

      updateBudgetProgress(
        "Other",
        getCategoryActual("other"),
        Number(
          currentBudget.other || 0
        )
      );
    }


    /* ============================================================
       Transaction List
       ============================================================ */

    function categoryName(category) {

      const map = {

        necessary:
          "必要生活費",

        credit_card:
          "信用卡",

        cash_reserve:
          "現金／預備金",

        free_spending:
          "自由支出",

        investment:
          "投資",

        other:
          "其他"
      };

      return (
        map[category] ||
        category
      );
    }


    function renderTransactions() {

      const list =
        document.getElementById(
          "transactionList"
        );

      const search =
        (
          document.getElementById(
            "searchInput"
          )?.value || ""
        )
          .trim()
          .toLowerCase();

      const category =
        document.getElementById(
          "filterCategory"
        )?.value || "";

      const payment =
        document.getElementById(
          "filterPayment"
        )?.value || "";


      let filtered =
        [...transactions];


      if (search) {

        filtered =
          filtered.filter(tx => {

            const text =
              [
                tx.item,
                tx.note,
                categoryName(
                  tx.category
                ),
                tx.payment_method
              ]
                .join(" ")
                .toLowerCase();

            return text.includes(search);
          });
      }


      if (category) {

        filtered =
          filtered.filter(
            tx =>
              tx.category ===
              category
          );
      }


      if (payment) {

        filtered =
          filtered.filter(
            tx =>
              tx.payment_method ===
              payment
          );
      }


      if (!filtered.length) {

        list.innerHTML =
          `
          <div class="empty">
            📭 沒有符合條件的記帳
          </div>
          `;

        return;
      }


      list.innerHTML =
        filtered
          .map(tx => {

            const note =
              tx.note
                ? `<div class="transaction-note">${escapeHtml(tx.note)}</div>`
                : "";

            return `
              <div class="transaction">

                <div class="transaction-date">
                  ${escapeHtml(tx.date)}
                </div>

                <div class="transaction-main">

                  <div class="transaction-item">
                    ${escapeHtml(tx.item)}
                  </div>

                  ${note}

                </div>

                <div class="transaction-category">
                  ${escapeHtml(
                    categoryName(
                      tx.category
                    )
                  )}
                </div>

                <div class="transaction-payment">
                  ${escapeHtml(
                    tx.payment_method || ""
                  )}
                </div>

                <div class="transaction-amount">
                  ${money(tx.amount)}
                </div>

                <div class="transaction-actions">

                  <button
                    class="btn btn-secondary btn-small"
                    onclick="openEditModal('${tx.id}')"
                  >
                    編輯
                  </button>

                  <button
                    class="btn btn-danger btn-small"
                    onclick="deleteTransaction('${tx.id}')"
                  >
                    刪除
                  </button>

                </div>

              </div>
            `;
          })
          .join("");
    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* ============================================================
       初始化
       ============================================================ */

    async function init() {

      currentMonth =
        getSafeCurrentMonth();

      setMonthInput();

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (data?.session?.user) {

        currentUser =
          data.session.user;

        await startApp();

      } else {

        document
          .getElementById("authScreen")
          .classList.remove("hidden");

        document
          .getElementById("appScreen")
          .classList.add("hidden");
      }
    }


    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (
          event === "SIGNED_IN" &&
          session?.user
        ) {

          currentUser =
            session.user;

          await startApp();
        }

        if (
          event === "SIGNED_OUT"
        ) {

          currentUser = null;
        }
      }
    );


    init();


    /* ============================================================
       點擊 Modal 外部關閉
       ============================================================ */

    document
      .getElementById("editModal")
      .addEventListener(
        "click",
        function (event) {

          if (
            event.target === this
          ) {
            closeEditModal();
          }

        }
      );
  </script>

</body>
</html>
