<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />

  <title>每月預算記帳本 V2.1</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #202124;
      --sub: #70757a;
      --line: #e6e9ef;
      --primary: #4f6ef7;
      --primary-light: #eef2ff;
      --green: #22a06b;
      --red: #e5484d;
      --orange: #f59e0b;
      --shadow: 0 8px 24px rgba(30, 40, 70, 0.08);
      --radius: 18px;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px 18px 60px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .title-area p {
      margin: 5px 0 0;
      color: var(--sub);
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 15px;
      background: var(--card);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      color: var(--text);
    }

    .btn.primary {
      background: var(--primary);
      color: white;
    }

    .btn.danger {
      color: var(--red);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Login */
    .auth-card {
      max-width: 430px;
      margin: 60px auto;
      background: var(--card);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .auth-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: var(--sub);
      margin-top: 0;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 11px 13px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .auth-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .auth-actions .btn {
      flex: 1;
    }

    /* Month */
    .month-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      background: var(--card);
      padding: 14px 16px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .month-bar .month-label {
      font-size: 14px;
      color: var(--sub);
    }

    .month-input {
      width: 180px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stat-title {
      color: var(--sub);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 700;
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.red {
      color: var(--red);
    }

    /* Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 19px;
    }

    /* Budget */
    .budget-row {
      margin-bottom: 18px;
    }

    .budget-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .budget-head .actual {
      color: var(--sub);
    }

    .progress {
      height: 9px;
      border-radius: 999px;
      background: #edf0f5;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .progress-bar.warning {
      background: var(--orange);
    }

    .progress-bar.danger {
      background: var(--red);
    }

    .budget-percent {
      margin-top: 5px;
      font-size: 12px;
      color: var(--sub);
      text-align: right;
    }

    .budget-input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Category */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 13px;
      background: #f8f9fc;
      border-radius: 13px;
    }

    .category-name {
      font-size: 14px;
    }

    .category-amount {
      font-weight: 700;
    }

    /* Add transaction */
    .transaction-form {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1fr 1fr 1.1fr auto;
      gap: 10px;
      align-items: end;
    }

    .transaction-form .field {
      margin: 0;
    }

    /* Search */
    .search-bar {
      display: grid;
      grid-template-columns: 1fr 180px 150px;
      gap: 10px;
      margin-bottom: 15px;
    }

    /* Transactions */
    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaction-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px;
      display: grid;
      grid-template-columns: 90px 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    .transaction-date {
      font-size: 13px;
      color: var(--sub);
    }

    .transaction-name {
      font-weight: 600;
    }

    .transaction-meta {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
    }

    .transaction-amount {
      font-weight: 700;
      white-space: nowrap;
    }

    .transaction-actions {
      display: flex;
      gap: 5px;
    }

    .small-btn {
      border: 0;
      background: #f1f3f7;
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: var(--sub);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 25, 40, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(520px, 100%);
      background: white;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 11px 17px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 2000;
      max-width: calc(100% - 30px);
      text-align: center;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Loading */
    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      backdrop-filter: blur(3px);
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      background: white;
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    /* Mobile */
    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .transaction-form {
        grid-template-columns: 1fr 1fr;
      }

      .transaction-form .full-mobile {
        grid-column: span 2;
      }

      .search-bar {
        grid-template-columns: 1fr 1fr;
      }

      .search-bar input {
        grid-column: span 2;
      }
    }

    @media (max-width: 600px) {
      .app {
        padding: 16px 12px 50px;
      }

      .header {
        align-items: flex-start;
      }

      .title-area h1 {
        font-size: 23px;
      }

      .header-actions .btn {
        padding: 8px 10px;
      }

      .month-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .month-input {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-value {
        font-size: 20px;
      }

      .budget-input-grid {
        grid-template-columns: 1fr;
      }

      .transaction-form {
        grid-template-columns: 1fr;
      }

      .transaction-form .full-mobile {
        grid-column: auto;
      }

      .search-bar {
        grid-template-columns: 1fr;
      }

      .search-bar input {
        grid-column: auto;
      }

      .transaction-item {
        grid-template-columns: 1fr auto;
      }

      .transaction-date {
        grid-column: 1 / -1;
      }

      .transaction-actions {
        grid-column: 2;
        grid-row: 2;
      }

      .transaction-amount {
        grid-column: 1;
        grid-row: 2;
      }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading" class="loading">
    <div class="loading-box">⏳ 處理中...</div>
  </div>

  <!-- Login -->
  <div id="authView">
    <div class="auth-card">
      <h2>💰 每月預算記帳本</h2>
      <p>雲端同步版 V2.1</p>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="輸入 Email" autocomplete="email" />
      </div>

      <div class="field">
        <label>密碼</label>
        <input id="password" type="password" placeholder="輸入密碼" autocomplete="current-password" />
      </div>

      <div class="auth-actions">
        <button class="btn primary" onclick="login()">登入</button>
        <button class="btn" onclick="register()">註冊</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="appView" style="display:none;">
    <div class="app">

      <!-- Header -->
      <div class="header">
        <div class="title-area">
          <h1>💰 每月預算記帳本</h1>
          <p>雲端同步版 V2.1</p>
        </div>

        <div class="header-actions">
          <button class="btn" onclick="reloadCurrentMonth()">🔄 重新整理</button>
          <button class="btn" onclick="logout()">登出</button>
        </div>
      </div>

      <!-- Month -->
      <div class="month-bar">
        <div>
          <div class="month-label">目前記帳月份</div>
          <strong id="monthDisplay">2026 年 09 月</strong>
        </div>

        <input
          id="monthInput"
          class="month-input"
          type="month"
          onchange="changeMonth()"
        />
      </div>

      <!-- Stats -->
      <div class="stats">

        <div class="stat-card">
          <div class="stat-title">本月收入</div>
          <div id="statIncome" class="stat-value">$0</div>
        </div>

        <div class="stat-card">
          <div class="stat-title">本月總支出</div>
          <div id="statExpense" class="stat-value red">$0</div>
        </div>

        <div class="stat-card">
          <div class="stat-title">信用卡支出</div>
          <div id="statCard" class="stat-value">$0</div>
        </div>

        <div class="stat-card">
          <div class="stat-title">本月剩餘</div>
          <div id="statRemaining" class="stat-value green">$0</div>
        </div>

      </div>

      <!-- Budget + Category -->
      <div class="grid">

        <!-- Budget -->
        <div class="card">
          <h2>📊 本月預算</h2>

          <div class="budget-row">
            <div class="budget-head">
              <span>必要生活費</span>
              <span class="actual" id="actualNecessary">$0 / $0</span>
            </div>
            <div class="progress">
              <div id="barNecessary" class="progress-bar"></div>
            </div>
            <div id="percentNecessary" class="budget-percent">0%</div>
          </div>

          <div class="budget-row">
            <div class="budget-head">
              <span>信用卡</span>
              <span class="actual" id="actualCredit">$0 / $0</span>
            </div>
            <div class="progress">
              <div id="barCredit" class="progress-bar"></div>
            </div>
            <div id="percentCredit" class="budget-percent">0%</div>
          </div>

          <div class="budget-row">
            <div class="budget-head">
              <span>現金／預備金</span>
              <span class="actual" id="actualReserve">$0 / $0</span>
            </div>
            <div class="progress">
              <div id="barReserve" class="progress-bar"></div>
            </div>
            <div id="percentReserve" class="budget-percent">0%</div>
          </div>

          <div class="budget-row">
            <div class="budget-head">
              <span>自由支出</span>
              <span class="actual" id="actualFree">$0 / $0</span>
            </div>
            <div class="progress">
              <div id="barFree" class="progress-bar"></div>
            </div>
            <div id="percentFree" class="budget-percent">0%</div>
          </div>

          <div class="budget-row">
            <div class="budget-head">
              <span>投資</span>
              <span class="actual" id="actualInvestment">$0 / $0</span>
            </div>
            <div class="progress">
              <div id="barInvestment" class="progress-bar"></div>
            </div>
            <div id="percentInvestment" class="budget-percent">0%</div>
          </div>

          <hr style="border:0;border-top:1px solid var(--line);margin:20px 0;">

          <h3 style="margin:0 0 12px;">⚙️ 調整本月預算</h3>

          <div class="budget-input-grid">

            <div class="field">
              <label>月收入</label>
              <input id="budgetIncome" type="number" min="0" />
            </div>

            <div class="field">
              <label>必要生活費</label>
              <input id="budgetNecessary" type="number" min="0" />
            </div>

            <div class="field">
              <label>信用卡</label>
              <input id="budgetCredit" type="number" min="0" />
            </div>

            <div class="field">
              <label>現金／預備金</label>
              <input id="budgetReserve" type="number" min="0" />
            </div>

            <div class="field">
              <label>自由支出</label>
              <input id="budgetFree" type="number" min="0" />
            </div>

            <div class="field">
              <label>投資</label>
              <input id="budgetInvestment" type="number" min="0" />
            </div>

          </div>

          <button
            class="btn primary"
            style="width:100%;margin-top:10px;"
            onclick="saveBudget()"
          >
            💾 儲存本月預算
          </button>

        </div>

        <!-- Category -->
        <div class="card">
          <h2>📁 類別支出</h2>

          <div id="categoryList" class="category-list"></div>
        </div>

      </div>

      <!-- Add transaction -->
      <div class="card" style="margin-bottom:18px;">
        <h2>➕ 新增記帳</h2>

        <div class="transaction-form">

          <div class="field">
            <label>日期</label>
            <input id="txDate" type="date" />
          </div>

          <div class="field">
            <label>項目</label>
            <input id="txItem" type="text" placeholder="例如：午餐" />
          </div>

          <div class="field">
            <label>類別</label>
            <select id="txCategory">
              <option value="必要生活費">必要生活費</option>
              <option value="信用卡">信用卡</option>
              <option value="現金／預備金">現金／預備金</option>
              <option value="自由支出">自由支出</option>
              <option value="投資">投資</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="field">
            <label>付款方式</label>
            <select id="txPayment">
              <option value="信用卡">信用卡</option>
              <option value="現金">現金</option>
            </select>
          </div>

          <div class="field">
            <label>金額</label>
            <input id="txAmount" type="number" min="0" placeholder="0" />
          </div>

          <button class="btn primary" onclick="addTransaction()">
            新增
          </button>

        </div>
      </div>

      <!-- Transactions -->
      <div class="card">
        <h2>🧾 記帳明細</h2>

        <div class="search-bar">
          <input
            id="searchInput"
            type="text"
            placeholder="搜尋項目或備註..."
            oninput="renderTransactions()"
          />

          <select id="filterCategory" onchange="renderTransactions()">
            <option value="">全部類別</option>
            <option value="必要生活費">必要生活費</option>
            <option value="信用卡">信用卡</option>
            <option value="現金／預備金">現金／預備金</option>
            <option value="自由支出">自由支出</option>
            <option value="投資">投資</option>
            <option value="其他">其他</option>
          </select>

          <select id="filterPayment" onchange="renderTransactions()">
            <option value="">全部付款</option>
            <option value="信用卡">信用卡</option>
            <option value="現金">現金</option>
          </select>
        </div>

        <div id="transactionList" class="transaction-list"></div>
      </div>

    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal">

      <h2>✏️ 編輯記帳</h2>

      <input id="editId" type="hidden" />

      <div class="field">
        <label>日期</label>
        <input id="editDate" type="date" />
      </div>

      <div class="field">
        <label>項目</label>
        <input id="editItem" type="text" />
      </div>

      <div class="field">
        <label>類別</label>
        <select id="editCategory">
          <option value="必要生活費">必要生活費</option>
          <option value="信用卡">信用卡</option>
          <option value="現金／預備金">現金／預備金</option>
          <option value="自由支出">自由支出</option>
          <option value="投資">投資</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="field">
        <label>付款方式</label>
        <select id="editPayment">
          <option value="信用卡">信用卡</option>
          <option value="現金">現金</option>
        </select>
      </div>

      <div class="field">
        <label>金額</label>
        <input id="editAmount" type="number" min="0" />
      </div>

      <div class="field">
        <label>備註</label>
        <input id="editNote" type="text" />
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="closeEdit()">取消</button>
        <button class="btn primary" onclick="updateTransaction()">儲存</button>
      </div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* =========================================================
       Supabase 設定
    ========================================================= */

    const SUPABASE_URL =
      "https://dxzzgcsatudrgjnbtbnl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_m5bOwLJZRbhQls_76MoDrw_jCiF7Sbd";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       全域變數
    ========================================================= */

    let currentUser = null;
    let transactions = [];
    let currentBudget = null;

    /*
      ★ 重要修正
      永遠先取得有效的 YYYY-MM 月份
    */
    let currentMonth = getSafeCurrentMonth();


    /* =========================================================
       預設值
    ========================================================= */

    const DEFAULT_BUDGET = {
      income: 36000,
      necessary: 7000,
      credit_card: 15000,
      cash_reserve: 5000,
      free_spending: 10000,
      investment: 0,
      other: 0
    };


    /* =========================================================
       初始化
    ========================================================= */

    document.addEventListener("DOMContentLoaded", async () => {

      /*
        ★ 初始化月份
      */
      currentMonth = getSafeCurrentMonth();

      setMonthInput();

      setTodayDate();

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (session && session.user) {
        currentUser = session.user;
        await showApp();
      } else {
        showAuth();
      }

      /*
        監聽登入狀態
      */
      supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

          if (event === "SIGNED_IN" && session?.user) {
            currentUser = session.user;
            await showApp();
          }

          if (event === "SIGNED_OUT") {
            currentUser = null;
            transactions = [];
            currentBudget = null;
            showAuth();
          }
        }
      );

    });


    /* =========================================================
       月份安全處理
    ========================================================= */

    function getSafeCurrentMonth() {

      const now = new Date();

      const year = now.getFullYear();

      const month =
        String(now.getMonth() + 1).padStart(2, "0");

      return `${year}-${month}`;
    }


    /*
      確認月份一定是 YYYY-MM
    */
    function normalizeMonth(month) {

      if (
        typeof month === "string" &&
        /^\d{4}-\d{2}$/.test(month)
      ) {
        return month;
      }

      return getSafeCurrentMonth();
    }


    /*
      ★ 修正重點
      取得下一個月份
    */
    function getNextMonth(month) {

      month = normalizeMonth(month);

      const [year, monthNumber] =
        month.split("-").map(Number);

      const date =
        new Date(year, monthNumber, 1);

      const y =
        date.getFullYear();

      const m =
        String(date.getMonth() + 1)
          .padStart(2, "0");

      return `${y}-${m}-01`;
    }


    function getMonthStart(month) {

      month = normalizeMonth(month);

      return `${month}-01`;
    }

    /* =========================================================
       讀取預算
    ========================================================= */

    async function loadBudget(month) {

      if (!currentUser) return;

      month =
        normalizeMonth(month);

      const start =
        `${month}-01`;

      const {
        data,
        error
      } = await supabaseClient
        .from("budgets")
        .select("*")
        .eq("user_id", currentUser.id)
        .eq("month", start)
        .maybeSingle();

      if (error) {

        toast(
          "讀取預算失敗：" +
          error.message
        );

        return;

      }

      if (data) {

        currentBudget = data;

      } else {

        /*
          如果這個月份沒有預算，
          使用預設值，但不立即寫入資料庫。
        */
        currentBudget = {
          user_id: currentUser.id,
          month: start,
          ...DEFAULT_BUDGET
        };

      }

      fillBudgetInputs();

    }


    /* =========================================================
       ★ 讀取記帳 - 已修正
    ========================================================= */

    async function loadTransactions(month) {

      if (!currentUser) {
        transactions = [];
        return;
      }

      /*
        ★★★ 防止 month = "" ★★★
      */
      month =
        normalizeMonth(month);

      /*
        例如：
        2026-09
        ↓
        2026-09-01
      */
      const start =
        `${month}-01`;

      /*
        例如：
        2026-09
        ↓
        2026-10-01
      */
      const end =
        getNextMonth(month);

      /*
        最後再確認一次，
        防止錯誤日期進 Supabase
      */
      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(start) ||
        !/^\d{4}-\d{2}-\d{2}$/.test(end)
      ) {

        console.error(
          "Invalid date range:",
          {
            month,
            start,
            end
          }
        );

        toast(
          "月份格式錯誤，已自動修正。"
        );

        month =
          getSafeCurrentMonth();

        currentMonth =
          month;

        await loadTransactions(month);

        return;
      }

      const {
        data,
        error
      } = await supabaseClient
        .from("transactions")
        .select("*")
        .eq("user_id", currentUser.id)
        .gte("date", start)
        .lt("date", end)
        .order("date", {
          ascending: false
        })
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(
          "Supabase loadTransactions error:",
          error
        );

        toast(
          "讀取記帳失敗：" +
          error.message
        );

        transactions = [];

        return;

      }

      /*
        ★ 沒有記帳資料是正常的
        Supabase 會回傳 []
      */
      transactions =
        data || [];

    }

        return;
      }

        user_id:
          currentUser.id,

        date,

        item,

        category,

        payment_method,

        amount,

        note: ""

      setLoading(true);

        data,
        error
      } = await supabaseClient
        .from("transactions")
        .insert(record)
        .select()
        .single();

          "addTransaction error:",
          error
        );

        toast(
          "新增記帳失敗：" +
          error.message
        );

      }

      /*

      ) {

        setMonthInput();

      await loadTransactions(currentMonth);

      renderAll();

      */
      document.getElementById("txItem").value =
        "";

      document.getElementById("txAmount").value =
        "";

      document.getElementById("txCategory").value =
        "必要生活費";

    /* =========================================================

    function renderStats() {

      const income =
        Number(
          currentBudget?.income || 0
        );

      const expense =
        transactions.reduce(
          (sum, tx) =>
            sum + Number(tx.amount || 0),
          0
        );

      const cardExpense =
        transactions
          .filter(
            tx =>
              tx.payment_method === "信用卡"
          )
          .reduce(
            (sum, tx) =>
              sum + Number(tx.amount || 0),
            0
          );

      const remaining =
        income - expense;


      document.getElementById("statIncome")
        .textContent =
        "$" + formatMoney(income);

      document.getElementById("statExpense")
        .textContent =
        "$" + formatMoney(expense);

      document.getElementById("statCard")
        .textContent =
        "$" + formatMoney(cardExpense);

      const remainingElement =
        document.getElementById(
          "statRemaining"
        );

      remainingElement.textContent =
        "$" + formatMoney(remaining);

      remainingElement.classList.remove(
        "green",
        "red"
      );

      remainingElement.classList.add(
        remaining >= 0
          ? "green"
          : "red"
      );

    }


    /* =========================================================
       預算進度
    ========================================================= */

    function renderBudget() {

      if (!currentBudget) return;

      const categories = [

        {
          key: "necessary",
          name: "必要生活費",
          actualId: "actualNecessary",
          barId: "barNecessary",
          percentId: "percentNecessary"
        },

        {
          key: "credit_card",
          name: "信用卡",
          actualId: "actualCredit",
          barId: "barCredit",
          percentId: "percentCredit"
        },

        {
          key: "cash_reserve",
          name: "現金／預備金",
          actualId: "actualReserve",
          barId: "barReserve",
          percentId: "percentReserve"
        },

        {
          key: "free_spending",
          name: "自由支出",
          actualId: "actualFree",
          barId: "barFree",
          percentId: "percentFree"
        },

        {
          key: "investment",
          name: "投資",
          actualId: "actualInvestment",
          barId: "barInvestment",
          percentId: "percentInvestment"
        }

      ];


      categories.forEach(
        category => {

          const budget =
            Number(
              currentBudget[
                category.key
              ] || 0
            );

          const actual =
            getCategoryTotal(
              category.name
            );

          const bar =
            document.getElementById(
              category.barId
            );

          const actualElement =
            document.getElementById(
              category.actualId
            );

          const percentElement =
            document.getElementById(
              category.percentId
            );


          actualElement.textContent =
            `$${formatMoney(actual)} / $${formatMoney(budget)}`;


          bar.classList.remove(
            "warning",
            "danger"
          );


          if (budget <= 0) {

            bar.style.width = "0%";

            percentElement.textContent =
              "—";

            return;

          }


          const percent =
            (actual / budget) * 100;

          const width =
            Math.min(percent, 100);

          bar.style.width =
            `${width}%`;


          if (percent >= 100) {

            bar.classList.add("danger");

          } else if (percent >= 80) {

            bar.classList.add("warning");

          }


          percentElement.textContent =
            `${percent.toFixed(0)}%`;

        }
      );

    }


    /* =========================================================
       類別統計
    ========================================================= */

    function renderCategories() {

      const categories = [

        "必要生活費",
        "信用卡",
        "現金／預備金",
        "自由支出",
        "投資",
        "其他"

      ];

                </span>

                <span class="category-amount">
                  $${formatMoney(amount)}
                </span>
              </div>
            `;

          }
        ).join("");

    }


    function getCategoryTotal(category) {

      return transactions
        .filter(
          tx =>
            tx.category === category
        )
        .reduce(
          (sum, tx) =>
            sum + Number(tx.amount || 0),
          0
        );

    }


    /* =========================================================
       記帳列表
    ========================================================= */

    function renderTransactions() {

      const container =
        document.getElementById(
          "transactionList"
        );


      const search =
        (
          document.getElementById(
            "searchInput"
          )?.value || ""
        )
        .trim()
        .toLowerCase();


      const category =
        document.getElementById(
          "filterCategory"
        )?.value || "";


      const payment =
        document.getElementById(
          "filterPayment"
        )?.value || "";


      const filtered =
        transactions.filter(
          tx => {

            const matchSearch =
              !search ||
              String(tx.item || "")
                .toLowerCase()
                .includes(search) ||
              String(tx.note || "")
                .toLowerCase()
                .includes(search);


            const matchCategory =
              !category ||
              tx.category === category;


            const matchPayment =
              !payment ||
              tx.payment_method === payment;


            return (
              matchSearch &&
              matchCategory &&
              matchPayment
            );

          }
        );


      if (!filtered.length) {

        container.innerHTML = `
          <div class="empty">
            📭 沒有符合條件的記帳
          </div>
        `;

        return;
      }


      container.innerHTML =
        filtered.map(
          tx => `

            <div class="transaction-item">

              <div class="transaction-date">
                ${formatDate(tx.date)}
              </div>

              <div>
                <div class="transaction-name">
                  ${escapeHtml(tx.item)}
                </div>

                <div class="transaction-meta">
                  ${escapeHtml(tx.category)}
                  ・
                  ${escapeHtml(tx.payment_method)}
                  ${
                    tx.note
                      ? " ・ " +
                        escapeHtml(tx.note)
                      : ""
                  }
                </div>
              </div>

              <div class="transaction-amount">
                $${formatMoney(tx.amount)}
              </div>

              <div class="transaction-actions">

                <button
                  class="small-btn"
                  onclick="openEdit('${tx.id}')"
                >
                  編輯
                </button>

                <button
                  class="small-btn"
                  onclick="deleteTransaction('${tx.id}')"
                >
                  刪除
                </button>

              </div>

            </div>

          `
        ).join("");

    }


    /* =========================================================
       工具
    ========================================================= */

    function formatMoney(value) {

      return Number(value || 0)
        .toLocaleString("zh-TW");

    }


    function formatDate(date) {

      if (!date) return "";

      return date
        .replace(
          /^(\d{4})-(\d{2})-(\d{2})$/,
          "$1/$2/$3"
        );

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function toast(message) {

      const element =
        document.getElementById(
          "toast"
        );

      element.textContent =
        message;

      element.classList.add(
        "show"
      );

      clearTimeout(
        window.__toastTimer
      );

      window.__toastTimer =
        setTimeout(
          () => {
            element.classList.remove(
              "show"
            );
          },
          3000
        );

    }


    function setLoading(show) {

      document
        .getElementById("loading")
        .classList.toggle(
          "show",
          show
        );

    }


    /* =========================================================
       點擊背景關閉編輯視窗
    ========================================================= */

    document
      .getElementById("editModal")
      .addEventListener(
        "click",
        event => {

          if (
            event.target.id ===
            "editModal"
          ) {
            closeEdit();
          }

        }
      );

  </script>

</body>
</html>
