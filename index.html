<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fa">
  <title>每月預算記帳本 V2</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ===== LOGIN ===== */

    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        linear-gradient(145deg, #f5f7fa, #e9edf2);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 15px 45px rgba(0,0,0,.08);
    }

    .login-logo {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 18px;
    }

    .login-card h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .login-subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 26px;
      font-size: 14px;
    }

    /* ===== APP ===== */

    .app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245,246,248,.92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #e5e6e8;
    }

    .topbar-inner {
      max-width: 1180px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-email {
      font-size: 12px;
      color: #777;
    }

    .container {
      max-width: 1180px;
      margin: auto;
      padding: 22px 20px 80px;
    }

    /* ===== COMMON ===== */

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.035);
      border: 1px solid #ececef;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 16px;
    }

    .muted {
      color: #888;
      font-size: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #dddfe3;
      border-radius: 12px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #888;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      transition: .15s;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: #222;
      color: white;
    }

    .btn-secondary {
      background: #eef0f3;
      color: #333;
    }

    .btn-danger {
      background: #fff0f0;
      color: #c62828;
    }

    .btn-small {
      padding: 7px 11px;
      font-size: 12px;
    }

    /* ===== MONTH ===== */

    .month-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .month-selector input {
      max-width: 180px;
      font-weight: 700;
    }

    /* ===== SUMMARY ===== */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 19px;
      border-radius: 18px;
      background: white;
      border: 1px solid #ececef;
    }

    .summary-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .summary-small {
      margin-top: 6px;
      color: #999;
      font-size: 12px;
    }

    /* ===== BUDGET ===== */

    .budget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .budget-item {
      border: 1px solid #ececef;
      border-radius: 16px;
      padding: 16px;
    }

    .budget-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .budget-name {
      font-weight: 750;
    }

    .budget-numbers {
      font-size: 13px;
      color: #777;
      text-align: right;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #eceef1;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: #333;
      transition: width .3s;
    }

    .progress-bar.over {
      background: #d93025;
    }

    .budget-status {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .over-text {
      color: #d93025;
      font-weight: 700;
    }

    /* ===== EDIT BUDGET ===== */

    .budget-editor {
      margin-top: 20px;
    }

    .budget-form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    /* ===== TRANSACTION ===== */

    .transaction-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    /* ===== FILTER ===== */

    .filter-bar {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 15px;
    }

    /* ===== TRANSACTION LIST ===== */

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaction {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px;
      border: 1px solid #ececef;
      border-radius: 15px;
      background: white;
    }

    .transaction-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .category-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 13px;
      background: #f0f1f3;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
    }

    .transaction-info {
      min-width: 0;
    }

    .transaction-item {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transaction-meta {
      margin-top: 4px;
      color: #888;
      font-size: 12px;
    }

    .transaction-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .amount {
      font-weight: 800;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #999;
    }

    /* ===== TOAST ===== */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== MOBILE ===== */

    @media (max-width: 850px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .transaction-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .topbar-inner {
        padding: 13px 15px;
      }

      .container {
        padding: 15px 12px 80px;
      }

      .brand {
        font-size: 18px;
      }

      .user-email {
        display: none;
      }

      .card {
        border-radius: 17px;
        padding: 16px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }

      .summary-card {
        padding: 15px;
        border-radius: 15px;
      }

      .summary-value {
        font-size: 21px;
      }

      .budget-grid {
        grid-template-columns: 1fr;
      }

      .budget-form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filter-bar {
        grid-template-columns: 1fr;
      }

      .transaction {
        padding: 12px;
      }

      .transaction-right {
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }

      .amount {
        font-size: 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .month-selector {
        justify-content: space-between;
      }

      .month-selector input {
        max-width: none;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">💰</div>

    <h1>每月預算記帳本</h1>
    <div class="login-subtitle">V2 雲端同步版</div>

    <div style="margin-bottom:14px;">
      <label>Email</label>
      <input id="email" type="email" placeholder="輸入 Email">
    </div>

    <div style="margin-bottom:18px;">
      <label>密碼</label>
      <input id="password" type="password" placeholder="輸入密碼">
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" style="flex:1;" onclick="login()">
        登入
      </button>

      <button class="btn btn-secondary" style="flex:1;" onclick="register()">
        註冊
      </button>
    </div>

    <div id="loginMessage"
         style="text-align:center;margin-top:15px;font-size:13px;color:#888;">
    </div>
  </div>
</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

  <div class="topbar">
    <div class="topbar-inner">

      <div class="brand">
        💰 每月預算
      </div>

      <div class="user-area">
        <span id="userEmail" class="user-email"></span>
        <button class="btn btn-secondary btn-small" onclick="logout()">
          登出
        </button>
      </div>

    </div>
  </div>


  <main class="container">

    <!-- MONTH -->

    <div class="month-selector">
      <strong>📅 本月</strong>
      <input id="monthPicker"
             type="month"
             onchange="loadMonth()">
    </div>


    <!-- SUMMARY -->

    <div class="summary-grid">

      <div class="summary-card">
        <div class="summary-label">月收入</div>
        <div id="incomeValue" class="summary-value">NT$0</div>
        <div class="summary-small">本月預算收入</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">本月支出</div>
        <div id="expenseValue" class="summary-value">NT$0</div>
        <div id="transactionCount" class="summary-small">0 筆</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">本月剩餘</div>
        <div id="remainingValue" class="summary-value">NT$0</div>
        <div class="summary-small">收入－支出</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">支出率</div>
        <div id="rateValue" class="summary-value">0%</div>
        <div class="summary-small">支出 ÷ 收入</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">💳 信用卡</div>
        <div id="creditValue" class="summary-value">NT$0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">💵 現金</div>
        <div id="cashValue" class="summary-value">NT$0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">📈 投資</div>
        <div id="investmentValue" class="summary-value">NT$0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">🧾 記帳筆數</div>
        <div id="countValue" class="summary-value">0</div>
      </div>

    </div>


    <!-- BUDGET -->

    <div class="card">

      <div class="section-title">
        📊 本月預算進度
      </div>

      <div id="budgetList" class="budget-grid">
      </div>

    </div>


    <!-- BUDGET EDITOR -->

    <div class="card budget-editor">

      <div class="section-title">
        ⚙️ 預算設定
      </div>

      <div class="budget-form-grid">

        <div>
          <label>月收入</label>
          <input id="budgetIncome" type="number" min="0">
        </div>

        <div>
          <label>必要生活費</label>
          <input id="budgetNecessary" type="number" min="0">
        </div>

        <div>
          <label>信用卡</label>
          <input id="budgetCreditCard" type="number" min="0">
        </div>

        <div>
          <label>現金／預備金</label>
          <input id="budgetCashReserve" type="number" min="0">
        </div>

        <div>
          <label>自由支出</label>
          <input id="budgetFree" type="number" min="0">
        </div>

        <div>
          <label>投資</label>
          <input id="budgetInvestment" type="number" min="0">
        </div>

        <div>
          <label>其他</label>
          <input id="budgetOther" type="number" min="0">
        </div>

      </div>

      <div style="margin-top:15px;">
        <button class="btn btn-primary" onclick="saveBudget()">
          💾 儲存預算
        </button>
      </div>

    </div>


    <!-- TRANSACTION AREA -->

    <div class="transaction-layout">

      <!-- ADD -->

      <div class="card">

        <div class="section-title" id="formTitle">
          ➕ 新增記帳
        </div>

        <div class="form-grid">

          <div>
            <label>日期</label>
            <input id="txDate" type="date">
          </div>

          <div>
            <label>金額</label>
            <input id="txAmount"
                   type="number"
                   min="0"
                   step="1"
                   placeholder="0">
          </div>

          <div class="full">
            <label>項目</label>
            <input id="txItem" type="text" placeholder="例如：午餐">
          </div>

          <div>
            <label>分類</label>
            <select id="txCategory">
              <option value="必要生活費">必要生活費</option>
              <option value="信用卡">信用卡</option>
              <option value="現金／預備金">現金／預備金</option>
              <option value="自由支出">自由支出</option>
              <option value="投資">投資</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <label>付款方式</label>
            <select id="txPayment">
              <option value="信用卡">信用卡</option>
              <option value="現金">現金</option>
              <option value="轉帳">轉帳</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="full">
            <label>備註</label>
            <input id="txNote" type="text" placeholder="可不填">
          </div>

        </div>

        <div class="form-actions">

          <button id="saveTxBtn"
                  class="btn btn-primary"
                  onclick="saveTransaction()">
            新增記帳
          </button>

          <button id="cancelEditBtn"
                  class="btn btn-secondary hidden"
                  onclick="cancelEdit()">
            取消編輯
          </button>

        </div>

      </div>


      <!-- LIST -->

      <div class="card">

        <div class="section-title">
          🧾 本月記帳
        </div>

        <div class="filter-bar">

          <input id="searchInput"
                 type="text"
                 placeholder="🔍 搜尋項目、備註..."
                 oninput="renderTransactions()">

          <select id="filterCategory"
                  onchange="renderTransactions()">
            <option value="">全部分類</option>
            <option value="必要生活費">必要生活費</option>
            <option value="信用卡">信用卡</option>
            <option value="現金／預備金">現金／預備金</option>
            <option value="自由支出">自由支出</option>
            <option value="投資">投資</option>
            <option value="其他">其他</option>
          </select>

        </div>

        <div id="transactionList"
             class="transaction-list">
        </div>

      </div>

    </div>

  </main>
</div>


<div id="toast"></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://dxzzgcsatudrgjnbtbnl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_m5bOwLJZRbhQls_76MoDrw_jCiF7Sbd";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentBudget = null;
let transactions = [];
let editingTransactionId = null;


/* =========================================================
   DEFAULT BUDGET
========================================================= */

const DEFAULT_BUDGET = {
  income: 36000,
  necessary: 7000,
  credit_card: 15000,
  cash_reserve: 5000,
  free_spending: 10000,
  investment: 0,
  other: 0
};


/* =========================================================
   INIT
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  const now = new Date();

  document.getElementById("monthPicker").value =
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

  document.getElementById("txDate").value =
    formatDateLocal(now);

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {
    currentUser = data.session.user;
    showApp();
  }
});


supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (session) {
      currentUser = session.user;
      showApp();
    } else {
      currentUser = null;
      showLogin();
    }
  }
);


/* =========================================================
   AUTH
========================================================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showLoginMessage("請輸入 Email 和密碼");
    return;
  }

  showLoginMessage("登入中...");

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    showLoginMessage(error.message);
  }
}


async function register() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showLoginMessage("請輸入 Email 和密碼");
    return;
  }

  if (password.length < 6) {
    showLoginMessage("密碼至少需要 6 個字元");
    return;
  }

  showLoginMessage("註冊中...");

  const { error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if (error) {
    showLoginMessage(error.message);
  } else {
    showLoginMessage(
      "註冊成功！如果有要求 Email 驗證，請先完成驗證。"
    );
  }
}


async function logout() {

  await supabaseClient.auth.signOut();

  showLogin();
}


function showLogin() {

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("app")
    .classList.add("hidden");
}


async function showApp() {

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  document.getElementById("userEmail").textContent =
    currentUser?.email || "";

  await loadMonth();
}


function showLoginMessage(message) {

  document.getElementById("loginMessage")
    .textContent = message;
}


/* =========================================================
   MONTH
========================================================= */

function getSelectedMonth() {

  return document.getElementById("monthPicker").value;
}


function getNextMonth(month) {

  const [year, monthNumber] =
    month.split("-").map(Number);

  const date =
    new Date(year, monthNumber, 1);

  const y = date.getFullYear();

  const m =
    String(date.getMonth() + 1).padStart(2, "0");

  return `${y}-${m}-01`;
}


async function loadMonth() {

  if (!currentUser) return;

  const month =
    getSelectedMonth();

  await loadBudget(month);
  await loadTransactions(month);

  renderDashboard();
  renderBudget();
  renderTransactions();
}


/* =========================================================
   BUDGET
========================================================= */

async function loadBudget(month) {

  const firstDay =
    `${month}-01`;

  const { data, error } =
    await supabaseClient
      .from("budgets")
      .select("*")
      .eq("user_id", currentUser.id)
      .eq("month", firstDay)
      .maybeSingle();

  if (error) {
    toast("讀取預算失敗：" + error.message);
    return;
  }

  if (!data) {

    const { data: inserted, error: insertError } =
      await supabaseClient
        .from("budgets")
        .insert({
          user_id: currentUser.id,
          month: firstDay,
          ...DEFAULT_BUDGET
        })
        .select()
        .single();

    if (insertError) {
      toast("建立預算失敗：" + insertError.message);
      return;
    }

    currentBudget = inserted;

  } else {

    currentBudget = data;
  }

  document.getElementById("budgetIncome").value =
    currentBudget.income || 0;

  document.getElementById("budgetNecessary").value =
    currentBudget.necessary || 0;

  document.getElementById("budgetCreditCard").value =
    currentBudget.credit_card || 0;

  document.getElementById("budgetCashReserve").value =
    currentBudget.cash_reserve || 0;

  document.getElementById("budgetFree").value =
    currentBudget.free_spending || 0;

  document.getElementById("budgetInvestment").value =
    currentBudget.investment || 0;

  document.getElementById("budgetOther").value =
    currentBudget.other || 0;
}


async function saveBudget() {

  if (!currentUser) return;

  const month =
    `${getSelectedMonth()}-01`;

  const payload = {

    user_id: currentUser.id,

    month,

    income:
      Number(document.getElementById("budgetIncome").value) || 0,

    necessary:
      Number(document.getElementById("budgetNecessary").value) || 0,

    credit_card:
      Number(document.getElementById("budgetCreditCard").value) || 0,

    cash_reserve:
      Number(document.getElementById("budgetCashReserve").value) || 0,

    free_spending:
      Number(document.getElementById("budgetFree").value) || 0,

    investment:
      Number(document.getElementById("budgetInvestment").value) || 0,

    other:
      Number(document.getElementById("budgetOther").value) || 0
  };

  const { data, error } =
    await supabaseClient
      .from("budgets")
      .upsert(payload, {
        onConflict: "user_id,month"
      })
      .select()
      .single();

  if (error) {
    toast("儲存失敗：" + error.message);
    return;
  }

  currentBudget = data;

  toast("預算已儲存 ✓");

  renderDashboard();
  renderBudget();
}


/* =========================================================
   TRANSACTIONS
========================================================= */

async function loadTransactions(month) {

  const start =
    `${month}-01`;

  const end =
    getNextMonth(month);

  const { data, error } =
    await supabaseClient
      .from("transactions")
      .select("*")
      .eq("user_id", currentUser.id)
      .gte("date", start)
      .lt("date", end)
      .order("date", {
        ascending: false
      })
      .order("created_at", {
        ascending: false
      });

  if (error) {
    toast("讀取記帳失敗：" + error.message);
    return;
  }

  transactions = data || [];
}


/* =========================================================
   SAVE TRANSACTION
========================================================= */

async function saveTransaction() {

  if (!currentUser) return;

  const date =
    document.getElementById("txDate").value;

  const item =
    document.getElementById("txItem").value.trim();

  const category =
    document.getElementById("txCategory").value;

  const payment =
    document.getElementById("txPayment").value;

  const amount =
    Number(document.getElementById("txAmount").value);

  const note =
    document.getElementById("txNote").value.trim();

  if (!date || !item || !amount || amount <= 0) {
    toast("請完整輸入日期、項目與金額");
    return;
  }

  const payload = {
    date,
    item,
    category,
    payment_method: payment,
    amount,
    note: note || null
  };


  if (editingTransactionId) {

    const { error } =
      await supabaseClient
        .from("transactions")
        .update(payload)
        .eq("id", editingTransactionId)
        .eq("user_id", currentUser.id);

    if (error) {
      toast("修改失敗：" + error.message);
      return;
    }

    toast("記帳已修改 ✓");

  } else {

    payload.user_id =
      currentUser.id;

    const { error } =
      await supabaseClient
        .from("transactions")
        .insert(payload);

    if (error) {
      toast("新增失敗：" + error.message);
      return;
    }

    toast("記帳成功 ✓");
  }

  resetTransactionForm();

  await loadTransactions(getSelectedMonth());

  renderDashboard();
  renderBudget();
  renderTransactions();
}


/* =========================================================
   EDIT
========================================================= */

function editTransaction(id) {

  const tx =
    transactions.find(t => t.id === id);

  if (!tx) return;

  editingTransactionId = id;

  document.getElementById("txDate").value =
    tx.date;

  document.getElementById("txItem").value =
    tx.item;

  document.getElementById("txCategory").value =
    tx.category;

  document.getElementById("txPayment").value =
    tx.payment_method;

  document.getElementById("txAmount").value =
    tx.amount;

  document.getElementById("txNote").value =
    tx.note || "";

  document.getElementById("formTitle")
    .textContent = "✏️ 編輯記帳";

  document.getElementById("saveTxBtn")
    .textContent = "儲存修改";

  document.getElementById("cancelEditBtn")
    .classList.remove("hidden");

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


function cancelEdit() {

  resetTransactionForm();
}


function resetTransactionForm() {

  editingTransactionId = null;

  const now = new Date();

  document.getElementById("txDate").value =
    formatDateLocal(now);

  document.getElementById("txItem").value = "";

  document.getElementById("txAmount").value = "";

  document.getElementById("txNote").value = "";

  document.getElementById("formTitle")
    .textContent = "➕ 新增記帳";

  document.getElementById("saveTxBtn")
    .textContent = "新增記帳";

  document.getElementById("cancelEditBtn")
    .classList.add("hidden");
}


/* =========================================================
   DELETE
========================================================= */

async function deleteTransaction(id) {

  if (!confirm("確定要刪除這筆記帳嗎？")) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("transactions")
      .delete()
      .eq("id", id)
      .eq("user_id", currentUser.id);

  if (error) {
    toast("刪除失敗：" + error.message);
    return;
  }

  toast("已刪除");

  await loadTransactions(getSelectedMonth());

  renderDashboard();
  renderBudget();
  renderTransactions();
}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

  const income =
    Number(currentBudget?.income || 0);

  const expense =
    transactions.reduce(
      (sum, tx) => sum + Number(tx.amount || 0),
      0
    );

  const remaining =
    income - expense;

  const rate =
    income > 0
      ? expense / income * 100
      : 0;

  const credit =
    transactions
      .filter(t => t.payment_method === "信用卡")
      .reduce(
        (sum, t) => sum + Number(t.amount || 0),
        0
      );

  const cash =
    transactions
      .filter(t => t.payment_method === "現金")
      .reduce(
        (sum, t) => sum + Number(t.amount || 0),
        0
      );

  const investment =
    transactions
      .filter(t => t.category === "投資")
      .reduce(
        (sum, t) => sum + Number(t.amount || 0),
        0
      );

  document.getElementById("incomeValue").textContent =
    money(income);

  document.getElementById("expenseValue").textContent =
    money(expense);

  document.getElementById("remainingValue").textContent =
    money(remaining);

  document.getElementById("rateValue").textContent =
    `${rate.toFixed(1)}%`;

  document.getElementById("creditValue").textContent =
    money(credit);

  document.getElementById("cashValue").textContent =
    money(cash);

  document.getElementById("investmentValue").textContent =
    money(investment);

  document.getElementById("countValue").textContent =
    transactions.length;

  document.getElementById("transactionCount").textContent =
    `${transactions.length} 筆`;
}


/* =========================================================
   BUDGET DISPLAY
========================================================= */

function renderBudget() {

  const actual = {
    "必要生活費": 0,
    "信用卡": 0,
    "現金／預備金": 0,
    "自由支出": 0,
    "投資": 0,
    "其他": 0
  };

  transactions.forEach(tx => {

    if (actual[tx.category] !== undefined) {
      actual[tx.category] +=
        Number(tx.amount || 0);
    }

  });


  const budgets = {

    "必要生活費":
      Number(currentBudget?.necessary || 0),

    "信用卡":
      Number(currentBudget?.credit_card || 0),

    "現金／預備金":
      Number(currentBudget?.cash_reserve || 0),

    "自由支出":
      Number(currentBudget?.free_spending || 0),

    "投資":
      Number(currentBudget?.investment || 0),

    "其他":
      Number(currentBudget?.other || 0)
  };


  const icons = {
    "必要生活費": "🏠",
    "信用卡": "💳",
    "現金／預備金": "💵",
    "自由支出": "🎮",
    "投資": "📈",
    "其他": "📦"
  };


  const html =
    Object.keys(budgets)
      .map(category => {

        const budget =
          budgets[category];

        const spent =
          actual[category];

        const percent =
          budget > 0
            ? spent / budget * 100
            : 0;

        const width =
          Math.min(percent, 100);

        const over =
          budget > 0 && spent > budget;

        const remaining =
          budget - spent;

        return `
          <div class="budget-item">

            <div class="budget-head">

              <div class="budget-name">
                ${icons[category]} ${category}
              </div>

              <div class="budget-numbers">
                ${money(spent)}
                /
                ${money(budget)}
              </div>

            </div>

            <div class="progress">
              <div
                class="progress-bar ${over ? "over" : ""}"
                style="width:${width}%">
              </div>
            </div>

            <div class="budget-status">

              <span>
                ${budget > 0
                  ? `${percent.toFixed(1)}%`
                  : "未設定預算"}
              </span>

              <span class="${over ? "over-text" : ""}">
                ${
                  budget > 0
                    ? (
                        over
                          ? `超支 ${money(Math.abs(remaining))}`
                          : `剩餘 ${money(remaining)}`
                      )
                    : ""
                }
              </span>

            </div>

          </div>
        `;
      })
      .join("");

  document.getElementById("budgetList")
    .innerHTML = html;
}


/* =========================================================
   TRANSACTION LIST
========================================================= */

function renderTransactions() {

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const category =
    document.getElementById("filterCategory")
      .value;


  const filtered =
    transactions.filter(tx => {

      const text =
        `${tx.item || ""} ${tx.note || ""}`
          .toLowerCase();

      const matchSearch =
        !search ||
        text.includes(search);

      const matchCategory =
        !category ||
        tx.category === category;

      return matchSearch && matchCategory;
    });


  if (!filtered.length) {

    document.getElementById("transactionList")
      .innerHTML =
        `<div class="empty">
          📭 沒有符合條件的記帳
        </div>`;

    return;
  }


  document.getElementById("transactionList")
    .innerHTML =
      filtered
        .map(tx => {

          const icon =
            getCategoryIcon(tx.category);

          return `
            <div class="transaction">

              <div class="transaction-left">

                <div class="category-icon">
                  ${icon}
                </div>

                <div class="transaction-info">

                  <div class="transaction-item">
                    ${escapeHtml(tx.item)}
                  </div>

                  <div class="transaction-meta">
                    ${tx.date}
                    ・
                    ${escapeHtml(tx.category)}
                    ・
                    ${escapeHtml(tx.payment_method)}
                    ${
                      tx.note
                        ? " ・ " + escapeHtml(tx.note)
                        : ""
                    }
                  </div>

                </div>

              </div>


              <div class="transaction-right">

                <div class="amount">
                  ${money(tx.amount)}
                </div>

                <button
                  class="btn btn-secondary btn-small"
                  onclick="editTransaction('${tx.id}')">
                  編輯
                </button>

                <button
                  class="btn btn-danger btn-small"
                  onclick="deleteTransaction('${tx.id}')">
                  刪除
                </button>

              </div>

            </div>
          `;
        })
        .join("");
}


/* =========================================================
   HELPERS
========================================================= */

function money(value) {

  return "NT$" +
    Number(value || 0)
      .toLocaleString("zh-TW");
}


function formatDateLocal(date) {

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const d =
    String(date.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function getCategoryIcon(category) {

  const icons = {

    "必要生活費": "🏠",

    "信用卡": "💳",

    "現金／預備金": "💵",

    "自由支出": "🎮",

    "投資": "📈",

    "其他": "📦"
  };

  return icons[category] || "🧾";
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function toast(message) {

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  }, 2200);
}
</script>
